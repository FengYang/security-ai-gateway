// otpmask.proto — 南向私有二进制协议（M5，技术方案 4.2）
//
// 说明：MVP 采用手写 Varint 二进制编解码（wire format 与 Protobuf 兼容），
// 避免 protoc 工具链依赖。本文件为协议权威定义，Go/Python 实现必须一致。
//
// Wire format（与 Protobuf 字段编码兼容，无字段号——按固定顺序，更紧凑）：
//
//	CipherVector:
//	  varint dim
//	  varint 元素个数 n
//	  n × varint（无符号，uint64 元素）
//
//	InferenceRequest:
//	  string request_id        (varint 长度 + UTF-8 字节)
//	  varint timestamp_ns
//	  string model             (varint 长度 + 字节)
//	  varint max_new_tokens
//	  bytes nonce              (varint 长度 + 字节)
//	  varint 向量个数 m
//	  m × CipherVector
//	  bytes cipher_text        (varint 长度 + 字节；M9-4 guardrail 密文文本，可空)
//	  bytes signature          (varint 长度 + HMAC-SHA256 32 字节)
//	  [string engine_type]     (6.2 可选扩展：追加于末尾；"tee_gpu" | "masked_vector"；空=缺省 tee_gpu)
//	  [string attest_type]     (6.2 可选扩展：追加于末尾；"quote" | "token"；空=缺省 token/MVP 兼容)
//
//	InferenceResponse:
//	  string request_id
//	  varint timestamp_ns
//	  varint status            (0=OK 1=ERROR 2=RATE_LIMITED 3=MODEL_NOT_FOUND)
//	  CipherVector cipher_output
//	  varint tokens_generated
//	  bytes signature
//
// 签名：HMAC-SHA256(K_sig, request_id || timestamp_ns || nonce || payload)
//   - K_sig 与掩码密钥分离（4.2.3），MVP 由环境变量注入，生产 TEE 签发
//   - 防重放：timestamp_ns 窗口 30s + request_id 去重
//
// 段① 载荷加密信封（P1a，GA-路线1发布规划；见 protocol/go/envelope.go）：
//
//	Envelope:
//	  varint version      信封格式版本（当前 1）
//	  varint suite        密码套件 ID（1 = AES-256-GCM；国密 SM4-GCM 预留）
//	  byte  direction     1 = c2s（网关→TEE），2 = s2c（TEE→网关）
//	  8 字节大端 counter  64bit 单调计数器
//	  bytes ciphertext    varint 长度 + AEAD 密文（含 16 字节 GCM tag）
//
//   - 方向子密钥：HKDF-SHA256(K_enc, info="otpmask/kdf/enc/{c2s|s2c}/v1")
//   - nonce：12 字节 = "OTPE" + 8 字节大端计数器（同方向计数器唯一 ⇒ nonce 唯一）
//   - AAD（不随 wire 传输）：sessionID/方向/计数器/endpoint 规范化序列化
//   - 反重放：接收侧 CounterWindow 64 槽滑动窗口（请求）或严格递增校验（SSE 分片）

syntax = "proto3";

package otpmask.protocol;

message CipherVector {
  repeated uint64 data = 1; // 量化密文/明文向量元素
}

message InferenceRequest {
  string request_id = 1;
  int64 timestamp_ns = 2;
  string model = 3;
  uint32 max_new_tokens = 4;
  bytes nonce = 5;
  repeated CipherVector cipher_vectors = 6;
  bytes cipher_text = 7; // M9-4 guardrail 密文文本（可空）
  bytes signature = 8; // HMAC-SHA256
  string engine_type = 9; // 6.2 可选扩展："tee_gpu"（缺省）| "masked_vector"
  string attest_type = 10; // 6.2 可选扩展："quote" | "token"（缺省，MVP 兼容）
}

enum Status {
  OK = 0;
  ERROR = 1;
  RATE_LIMITED = 2;
  MODEL_NOT_FOUND = 3;
}

message InferenceResponse {
  string request_id = 1;
  int64 timestamp_ns = 2;
  Status status = 3;
  CipherVector cipher_output = 4;
  uint32 tokens_generated = 5;
  bytes signature = 6;
}

// 段① 加密信封（P1a；wire 见文件头注释，Go/Python 双实现逐位一致）
message Envelope {
  uint32 version = 1;    // 信封格式版本（当前 1）
  uint32 suite = 2;      // 密码套件 ID（1 = AES-256-GCM；国密预留）
  uint32 direction = 3;  // 1 = c2s（网关→TEE），2 = s2c（TEE→网关）
  uint64 counter = 4;    // 64bit 单调计数器（nonce 与 AAD 的来源）
  bytes ciphertext = 5;  // AEAD 密文（含 16 字节 GCM tag）
}
