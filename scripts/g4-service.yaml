# G-4 OG-16 批 5：指向节点侧车进程的 Service + Endpoints
# 侧车和 llama-server 直接跑在节点上（进程方式），不需要容器化
# Service 名：qwen3guard-l2.otpmask:19112
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3guard-l2
  namespace: otpmask
  labels:
    app: qwen3guard-l2
    og-batch: g4
spec:
  ports:
    - name: sidecar
      port: 19112
      targetPort: 19112
      protocol: TCP
    - name: llama
      port: 19110
      targetPort: 19110
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: qwen3guard-l2
  namespace: otpmask
  labels:
    app: qwen3guard-l2
    og-batch: g4
subsets:
  - addresses:
      # 节点 IP（侧车和 llama-server 跑在节点上）
      - ip: 192.168.31.166
    ports:
      - name: sidecar
        port: 19112
        protocol: TCP
      - name: llama
        port: 19110
        protocol: TCP
