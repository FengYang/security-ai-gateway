admin:
  address:
    socket_address:
      protocol: TCP
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        protocol: TCP
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          scheme_header_transformation:
            scheme_to_overwrite: https
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              cors:
                # P0a：CORS（开发环境允许所有来源；生产按需收紧 allow_origin_string_match）
                allow_origin_string_match:
                - prefix: "*"
                allow_methods: GET, POST, OPTIONS
                allow_headers: content-type, authorization, x-tenant-id, x-session-id, x-attest-token
                expose_headers: content-type
                max_age: "1728000"
              routes:
              - match:
                  prefix: "/infer"
                route:
                  cluster: tee-infer
          http_filters:
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
          - name: envoy.filters.http.buffer
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
              max_request_bytes: 16777216
          # P0a：IP 黑白名单（RBAC，fail-closed 语义：白名单内放行，其余 403）。
          # 默认 0.0.0.0/0 = 放行全部；生产按实际网段收紧（如内网 CIDR）。
          # 位于 wasm 加密链前端，仅按 source IP 决策，不接触密文 body。
          - name: envoy.filters.http.rbac
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
              rules:
                action: ALLOW
                policies:
                  ip_allowlist:
                    permissions:
                    - any: true
                    principals:
                    - remote_ip:
                        address_prefix: 0.0.0.0
                        prefix_len: 0
          # P0a：QPS 限流（Envoy 本地限流，进程内 token bucket，零外部依赖）。
          # 全局维度（每秒 1000 并发突发 2000）；集群级多副本一致限流需
          # envoy.filters.http.ratelimit + 独立 ratelimit 服务（Redis），见 GA-AI网关能力补齐方案 §5 P0a。
          # 超限返回 429；限流不可用 = 本 filter 不拦截（fail-open 为 Envoy 本地限流默认，
          # 如需 fail-closed 依赖外部 ratelimit 服务的 override 语义，见升级路径）。
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: http_local_rate_limiter
              token_bucket:
                max_tokens: 2000
                tokens_per_fill: 1000
                fill_interval: 1s
              filter_enabled:
                runtime_key: local_rate_limit_enabled
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              filter_enforced:
                runtime_key: local_rate_limit_enforced
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              response_headers_to_add:
              - append: false
                header:
                  key: x-local-rate-limit
                  value: "true"
          - name: otpmask
            typed_config:
              "@type": type.googleapis.com/udpa.type.v1.TypedStruct
              type_url: type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
              value:
                config:
                  name: otpmask
                  vm_config:
                    runtime: envoy.wasm.runtime.v8
                    code:
                      local:
                        filename: /etc/envoy/main.wasm
                  configuration:
                    "@type": "type.googleapis.com/google.protobuf.StringValue"
                    # attest_mode=token：本地 compose 栈的 Envoy 无 TEE 证明主机 API（quote 握手会以
                    # "调用 attest 失败: bad argument" fail-closed），且 tee-infer-service 容器以
                    # -sig-key/-attest-token 启动（token 模式）；生产 CR 缺省 quote（见 deploy/higress）。
                    # tee_service/embedding_service 填 <名>.dns：插件出站统一 wrapper.FQDNCluster，
                    # 其簇名 = outbound|<port>||<FQDN>，故 FQDN 取本文件末尾已声明的
                    # outbound|<port>||<名>.dns 的 <名>.dns 部分；生产 CR 用完整服务域名。
                    value: |
                      {
                        "attest_mode": "token",
                        "mask_modulus": 4294967296,
                        "model": "mock",
                        "embedding_service": "embedding_service.dns",
                        "embedding_port": 18080,
                        "tee_service": "tee_infer_service.dns",
                        "tee_port": 19090,
                        "sig_key": "3031323334353637383961626364656630313233343536373839616263646566",
                        "attest_token": "3031323334353637383961626364656630313233343536373839616263646566",
                        "crypto_service": "cryptop-svc.dns",
                        "crypto_service_port": 19097,
                        "crypto_profile": "intl",
                        "mask_prg": "hmac-sha256"
                      }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # 密态推理服务（路径 A，南向协议二进制）
  - name: tee-infer
    connect_timeout: 30s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: tee-infer
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: tee-infer-service
                port_value: 19090
  # wrapper.NewClusterClient(DnsCluster{ServiceName:"embedding_service",Port:18080})
  # 生成的 Istio 风格 cluster 名
  - name: "outbound|18080||embedding_service.dns"
    connect_timeout: 5s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: "outbound|18080||embedding_service.dns"
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: embedding-service
                port_value: 18080
  # wrapper.NewClusterClient(DnsCluster{ServiceName:"tee_infer_service",Port:19090})
  - name: "outbound|19090||tee_infer_service.dns"
    connect_timeout: 5s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: "outbound|19090||tee_infer_service.dns"
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: tee-infer-service
                port_value: 19090
  # cryptop sidecar（compose 下经服务名 LOGICAL_DNS；k8s 同 Pod 时为 127.0.0.1 STATIC，
  # 见 deploy/k8s 与 deploy/helm）。簇名须与插件 FQDNCluster 口径一致。
  - name: "outbound|19097||cryptop-svc.dns"
    connect_timeout: 5s
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: "outbound|19097||cryptop-svc.dns"
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: cryptopsvc
                port_value: 19097
