version: '3.7'

services:
  envoy:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/gateway:v2.1.5
    entrypoint: /usr/local/bin/envoy
    command: -c /etc/envoy/envoy.yaml --component-log-level wasm:debug
    depends_on:
    - mock-infer
    - cryptopsvc
    networks:
    - wasmtest
    ports:
    - "10000:10000"
    volumes:
    - ./envoy.yaml:/etc/envoy/envoy.yaml
    - ./main.wasm:/etc/envoy/main.wasm

  mock-infer:
    image: python:3-alpine
    working_dir: /app
    volumes:
    - ./mock_infer.py:/app/mock_infer.py
    command: python /app/mock_infer.py
    environment:
    - MOCK_DELTA=7
    networks:
    - wasmtest
    ports:
    - "19000:9000"

  embedding-service:
    build:
      context: ../../..
      dockerfile: gateway/embedding-service/Dockerfile
    networks:
    - wasmtest
    ports:
    - "18080:18080"

  tee-infer-service:
    build:
      context: ../../..
      dockerfile: gateway/tee-infer-service/Dockerfile
    command:
    - "-sig-key"
    - "3031323334353637383961626364656630313233343536373839616263646566"
    - "-attest-token"
    - "3031323334353637383961626364656630313233343536373839616263646566"
    # 审计 WORM 文件（门禁 #7 边界 A 实链）：使审计链可由独立验证器 audit-verify 判定完整性
    # （此前为内存模式：本文件由 e2e 脚本经 docker cp 取出后跑 audit-verify -schema tee）。
    - "-audit-file"
    - "/tmp/tee-audit.jsonl"
    networks:
    - wasmtest
    ports:
    - "19090:19090"

  cryptopsvc:
    build:
      context: ../../..
      dockerfile: gateway/cryptopsvc/Dockerfile
    command:
    - "-listen"
    - "0.0.0.0:19097"
    - "-profile"
    - "intl"
    environment:
    # 开发演示值（intl 32B hex）；生产由部署环境替换。
    - CRYPTO_STATIC_KEYS={"session/sig/v1":"3031323334353637383961626364656630313233343536373839616263646566","session/hmac/v1":"3031323334353637383961626364656630313233343536373839616263646566"}
    networks:
    - wasmtest

networks:
  wasmtest: {}
