# tee-infer-service
# 生产参数：-enclave mock（开发/CI）| tdx/sgx（硬件接入后切换）
# 威胁模型 GAP-01/GAP-05：本 base 为开发/CI 形态（mock 飞地、无管理令牌），故显式声明 -dev-mode。
# 生产/TDX overlay 必须移除 -dev-mode 并配置 -admin-token，否则服务启动守卫将拒绝启动（fail-closed）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tee-infer-service
  namespace: otpmask
  labels:
    app: tee-infer-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tee-infer-service
  template:
    metadata:
      labels:
        app: tee-infer-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "19090"
    spec:
      containers:
      - name: tee-infer-service
        image: otpmask/tee-infer-service:latest
        imagePullPolicy: IfNotPresent
        args:
        - "-enclave"
        - "$(ENCLAVE_MODE)"
        - "-sig-key"
        - "$(SIG_KEY)"
        - "-attest-token"
        - "$(ATTEST_TOKEN)"
        - "-tsa"
        - "mock"
        # 开发/CI 逃生口（GAP-01/GAP-05）；生产必须移除并改配 -admin-token。
        - "-dev-mode"
        env:
        - name: ENCLAVE_MODE
          value: "mock" # overlay 可覆盖为 tdx/sgx
        - name: SIG_KEY
          valueFrom:
            secretKeyRef:
              name: otpmask-keys
              key: sig-key
        - name: ATTEST_TOKEN
          valueFrom:
            secretKeyRef:
              name: otpmask-keys
              key: attest-token
        ports:
        - containerPort: 19090
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 2000m
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        # liveness 刻意不联动审核侧车：侧车故障应由 readiness 摘流，
        # 而非重启本容器——重启不修复侧车，且 -seal-file 为空时会使证明会话失效（放大为重启风暴）。
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: tee-infer-service
  namespace: otpmask
spec:
  selector:
    app: tee-infer-service
  ports:
  - name: http
    port: 19090
    targetPort: http
