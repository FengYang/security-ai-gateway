# tee-infer-service
# 生产参数：-enclave mock（开发/CI）| tdx/sgx（硬件接入后切换）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tee-infer-service
  namespace: otpmask
  labels:
    app: tee-infer-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tee-infer-service
  template:
    metadata:
      labels:
        app: tee-infer-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "19090"
    spec:
      containers:
      - name: tee-infer-service
        image: otpmask/tee-infer-service:latest
        imagePullPolicy: IfNotPresent
        args:
        - "-enclave"
        - "$(ENCLAVE_MODE)"
        - "-sig-key"
        - "$(SIG_KEY)"
        - "-attest-token"
        - "$(ATTEST_TOKEN)"
        - "-tsa"
        - "mock"
        env:
        - name: ENCLAVE_MODE
          value: "mock" # overlay 可覆盖为 tdx/sgx
        - name: SIG_KEY
          valueFrom:
            secretKeyRef:
              name: otpmask-keys
              key: sig-key
        - name: ATTEST_TOKEN
          valueFrom:
            secretKeyRef:
              name: otpmask-keys
              key: attest-token
        ports:
        - containerPort: 19090
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 2000m
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: tee-infer-service
  namespace: otpmask
spec:
  selector:
    app: tee-infer-service
  ports:
  - name: http
    port: 19090
    targetPort: http
