# P1-7 T6（本体 §3.4 / D-4 / D-16 / C-4 / C-8 / R-采样-5 / D-9）：
# 审计归档对象存储生命周期清单（T0 缺口④：deploy/storage/audit-lifecycle.yaml）
#
# ── 分层口径（本体 §3.4 分层表 + L255 分层边界注）──────────────────────────────
#   热层 0–7 天   ：本地 WORM 日分段（PVC，D-14 单写者），100% 全量
#   温层 8–30 天  ：归档**全量、不降采样**（D-16：副本 prev_hash 连续 ⇒ 可从头全链校验，
#                   `audit-verify` 退出码 0；30 天内可全量回溯，缓解 A3-16 等保窗口不足）
#   冷层 31 天–1 年：**仅命中 + 日聚合**（不完整链 D-16；每个冷层对象自带
#                   `first_prev_hash` + 段末哈希，验证走 `audit-verify -from/-to/-entry-hash`
#                   窗口抽样，不适用从头全链校验）
#   销毁           ：超留存期由**存储层生命周期**自动清理
#
# ── 生命周期迁移节奏（§3.4 L255：30d → 90d → 超期清理）────────────────────────
#   30d：STANDARD → STANDARD_IA（冷层早期，低频访问）
#   90d：→ GLACIER / 归档类（对应主方案"冷 90 天–1 年"归档阶段）
#   超留存期：Expiration 删除。默认 **365 天**（与 `auditretention.go`
#             `defaultAuditRetentionDays=365` 对齐）；**法定硬底 180 天**（C-8），
#             配置低于 180 天须先改 `/audit/retention` 留存声明（fail-closed 校验）。
#
# ── ⚠️ 前置依赖（T0/W0 已登记，非本文件可自足）────────────────────────────────
#   ① bucket 创建时须启用 **Object Lock（COMPLIANCE 合规模式）**（D-9）：
#      保留期内 root 亦不可覆写/删除，防"整条链整体替换"（仅哈希链防不住该攻击）。
#   ② 归档器写入对象存储时须按对象类型打 tag/prefix：
#      - 冷层"仅命中 + 聚合"由**归档器**在写入时决定——S3 lifecycle 只能按
#        年龄/tag/prefix 迁移，无法按内容判定；
#      - **R-采样-5**：配置/策略变更类 action（guardrail_config / *_policy_reload /
#        output_guard_* / tenant_disposition_change 等 10 项）**恒保留、冷层不丢弃**
#        ⇒ 归档器须打 `audit-kind=policy-change` tag（或独立 prefix），
#        本清单对应 Rule **不设 Expiration**。
#
# ── 服务纪律（C-4）───────────────────────────────────────────────────────────
#   服务**不删除任何审计数据**；已成功归档（对象存储存在不可变只读副本）的
#   本地日分段，其 `unlink` 须以**归档成功回执**为前置，否则视为违规。
#   本文件是存储层执行的**声明侧**，与 `auditretention.go`（声明）构成"声明—执行"对。
#
# ── 应用方式（S3 兼容端点：MinIO / 阿里云 OSS S3 兼容 / AWS S3 同理）──────────
#   mc mb --with-lock myminio/security-audit-archive
#   mc ilm import myminio/security-audit-archive < audit-lifecycle-s3.xml
#   # 或：aws s3api put-bucket-lifecycle-configuration \
#   #       --bucket security-audit-archive \
#   #       --lifecycle-configuration file://audit-lifecycle-s3.xml
#
# ── 核验（V-3 分层生效 / V-4 温层副本退出码 0）────────────────────────────────
#   温层副本 `audit-verify` 退出码 0；冷层窗口抽样；分层边界须与
#   `POST /audit/retention` 声明值一致（T9）；StorageClass 迁移可 `mc ls --recursive`
#   或 `head-object` 的 StorageClass 字段核验。
#
# ⚠️ 本清单为**配置模板**：bucket 名称 / StorageClass 类名（GLACIER 等）/
#   保留天数须按实际对象存储产品与运维拍板后调整（与 values.yaml storageClass
#   "须由运维拍板"同一约定）。

apiVersion: security-ai-gateway/v1
kind: AuditObjectStorageLifecycle
metadata:
  name: audit-archive-lifecycle
  owner: P1-7-T6
spec:
  bucket: security-audit-archive
  objectLock:
    mode: COMPLIANCE           # D-9：合规模式，保留期内 root 亦不可删/不可覆写
    defaultRetentionDays: 365  # 与 auditretention.go defaultAuditRetentionDays=365 对齐
    legalHoldSupported: true
  versioning: enabled
  retentionFloorDays: 180      # C-8 法定硬底；低于此值的配置一律拒绝
  tiers:
    - name: hot
      scope: 0-7d
      location: local-pvc      # tee-infer WORM 日分段（D-14 单写者；非对象存储）
      sampling: full
    - name: warm
      scope: 8-30d
      location: object-storage
      sampling: full           # D-16：全量不降采样（prev_hash 连续 ⇒ 可全链校验）
    - name: cold
      scope: 31d-1y
      location: object-storage-archive-class
      sampling: hit-only-plus-daily-aggregate   # 不完整链；对象自带 first_prev_hash + 段末哈希
  rules:
    # 主规则：年龄迁移 + 超留存期清理（30d → 90d → 365d 过期）
    - id: audit-transitions
      filterPrefix: "audit/"
      status: Enabled
      transitions:
        - afterDays: 30
          storageClass: STANDARD_IA
        - afterDays: 90
          storageClass: GLACIER
      expiration:
        afterDays: 365         # 超留存期清理；≥180 法定硬底（C-8）
    # R-采样-5：配置/策略变更类事件恒保留（归档器打 audit-kind=policy-change）
    - id: audit-policy-change-retain
      filterTag:
        audit-kind: policy-change
      status: Enabled
      transitions:
        - afterDays: 30
          storageClass: STANDARD_IA
      expiration: null         # 恒保留：冷层亦不丢弃（无过期规则）
    # 冷层日聚合统计对象（小对象，与事件同保留期）
    - id: audit-aggregate-retention
      filterPrefix: "audit-aggregate/"
      status: Enabled
      expiration:
        afterDays: 365

# 等价 S3 lifecycle 配置（可直接 `mc ilm import` 或 put-bucket-lifecycle-configuration）。
# 注意：Object Lock 的保留期在 bucket 默认策略/对象级 retain-until-date 设置，
# 不在本 lifecycle 内；二者配合——保留期内 Expiration 不生效。
s3LifecycleXML: |
  <LifecycleConfiguration>
    <Rule>
      <ID>audit-transitions</ID>
      <Filter><Prefix>audit/</Prefix></Filter>
      <Status>Enabled</Status>
      <Transition><Days>30</Days><StorageClass>STANDARD_IA</StorageClass></Transition>
      <Transition><Days>90</Days><StorageClass>GLACIER</StorageClass></Transition>
      <Expiration><Days>365</Days></Expiration>
    </Rule>
    <Rule>
      <ID>audit-policy-change-retain</ID>
      <Filter><Tag><Key>audit-kind</Key><Value>policy-change</Value></Tag></Filter>
      <Status>Enabled</Status>
      <Transition><Days>30</Days><StorageClass>STANDARD_IA</StorageClass></Transition>
      <!-- R-采样-5：恒保留，无 Expiration -->
    </Rule>
    <Rule>
      <ID>audit-aggregate-retention</ID>
      <Filter><Prefix>audit-aggregate/</Prefix></Filter>
      <Status>Enabled</Status>
      <Expiration><Days>365</Days></Expiration>
    </Rule>
  </LifecycleConfiguration>
