    global_auth: "false"
- name: ip-restriction
  order: 30
- name: replay-protection
  order: 35
- name: local-rate-limit
  order: 40
- name: request-validation
  order: 50
- name: ai-quota
  order: 60
- name: ai-token-ratelimit
  order: 70
