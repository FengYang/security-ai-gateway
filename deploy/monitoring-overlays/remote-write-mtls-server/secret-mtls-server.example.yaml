# 【模板 · 禁止直接 apply · 不在 kustomization resources 内】
# P2-4 PRE-A-4：mTLS 终止代理的**服务端证书 + 信任的客户端 CA**
#
# 【与发送侧证书同源】
#   deploy/monitoring-overlays/remote-write-mtls/gen-ca.sh --out ./certs
#     → ca.crt（CA） / server.crt+server.key（本代理用） / client.crt+client.key（各集群 Prometheus 用）
#   本 Secret 装的是 **server 侧**：tls.crt+tls.key = server，ca.crt = 用来验客户端证书的那个 CA。
#   注意：name 是 `-server` 后缀，与发送侧 `otpmask-remote-write-mtls`（客户端证书）**不是同一个 Secret**。
#
# 【注入命令（禁止把真实证书写进仓库）】
#   kubectl -n otpmask create secret generic otpmask-remote-write-mtls-server \
#     --from-file=tls.crt=./certs/server.crt \
#     --from-file=tls.key=./certs/server.key \
#     --from-file=ca.crt=./certs/ca.crt \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   注意用 `create secret generic`（而非 `create secret tls`）：
#   kubernetes.io/tls 类型只接受 tls.crt/tls.key 两键，装不下 ca.crt 这个第三键。
#
# 【消费方】nginx-mtls-proxy.yaml 的 volume `tls`（挂到 /etc/nginx/tls，defaultMode 0440 + fsGroup 101）
#   ssl_certificate / ssl_certificate_key / ssl_client_certificate 三处引用。
#
# 【轮换】客户端证书默认 90 天（gen-ca.sh --days）。轮换步骤：
#   1) 用同一 CA 重签客户端证书 → 更新发送侧 Secret（不影响服务端）；
#   2) 若换 CA：先更新本 Secret 的 ca.crt（同时信任新旧 CA 需双证书拼接，见 README §5），
#      再逐集群换发客户端证书，最后移除旧 CA —— 否则换 CA 瞬间全集群写入中断。
apiVersion: v1
kind: Secret
metadata:
  name: otpmask-remote-write-mtls-server
  namespace: otpmask
  labels:
    app: remote-write-mtls-gateway
type: Opaque
stringData:
  # 服务端证书（SAN 必须包含发送侧配置的 server_name）
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_SERVER_CERTIFICATE_PEM
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_SERVER_PRIVATE_KEY_PEM
    -----END PRIVATE KEY-----
  # 信任的客户端 CA（nginx ssl_client_certificate）
  # 双 CA 过渡期可拼接多张 PEM（同一键内按顺序排列），nginx 会视作信任链集合。
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_CLIENT_CA_CERTIFICATE_PEM
    -----END CERTIFICATE-----
