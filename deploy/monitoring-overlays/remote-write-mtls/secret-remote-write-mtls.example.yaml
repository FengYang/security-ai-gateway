# 【模板 · 禁止直接 apply · 不在 kustomization resources 内】
# P2-4 T-4.3：remote-write 通道的 **mTLS 客户端证书**（各集群 Prometheus 使用）。
#
# 【凭据禁止入库】本文件只给出**形态与占位**，真实证书由 KMS / cert-manager / 内部 CA 签发后注入：
#   kubectl -n otpmask create secret generic otpmask-remote-write-mtls \
#     --from-file=tls.crt=/path/client.crt \
#     --from-file=tls.key=/path/client.key \
#     --from-file=ca.crt=/path/ca.crt
#   ⚠️ `create secret tls` 只收 tls.crt/tls.key（装不下 ca.crt）；
#      `create secret generic` 也不支持 --cert/--key/--ca-file。两键三键别混用。
# 或用 cert-manager 的 Certificate + External Secrets 同步（生产推荐）。
#
# 【消费方】deploy/monitoring-overlays/remote-write-mtls/patch-prometheus-tls-volume.yaml
#   → 挂载到 /etc/prometheus/mtls（readOnly），并在 prometheus.yml 的 remote_write 段引用：
#       tls_config: {ca_file / cert_file / key_file: /etc/prometheus/mtls/...}
#       server_name: <中央接收端的服务名>（用于证书校验，见 snippet）
#
# 【与 T-4.3 接收侧的关系】Prometheus **原生不校验客户端证书** → 接收侧必须由前置代理
# 做 mTLS 终止与客户端证书校验（详见 deploy/monitoring/central/trust/README.md）。
# 双方须使用**同一 CA** 签发：接收侧信任该 CA，发送侧用其签发的客户端证书。
apiVersion: v1
kind: Secret
metadata:
  name: otpmask-remote-write-mtls
  namespace: otpmask
type: kubernetes.io/tls
stringData:
  # 客户端证书（CN/SAN 建议体现集群 ID，便于接收侧按证书主体做来源识别）
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_CLIENT_CERTIFICATE_PEM
    -----END CERTIFICATE-----
  # 客户端私钥（权限由 Secret 卷默认 0644 控制 → 生产建议改用 CSI Secret Store 或
  # 限制卷权限；Prometheus 以 nobody(65534) 运行，私钥需对该用户可读）
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_CLIENT_PRIVATE_KEY_PEM
    -----END PRIVATE KEY-----
  # 信任的 CA（用于校验中央接收端证书）
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_CA_CERTIFICATE_PEM
    -----END CERTIFICATE-----
