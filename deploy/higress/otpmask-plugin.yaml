# otpmask 插件 WasmPlugin 挂载（P0b：形态 A → 形态 B 迁移）
#
# 背景：D-0 修正为 Higress 控制面形态。otpmask 插件代码零改动
# （Proxy-Wasm ABI 兼容），仅挂载方式从 envoy.yaml 裸挂改为 WasmPlugin CRD。
#
# 插件分发（wasm 7.1MB 超 ConfigMap 1MiB，二选一）：
#   1. OCI artifact（推荐）：编译 main.wasm（Go wasip1）后用
#      oras push <registry>/plugins/otpmask:1.0.0 \
#        --artifact-type application/vnd.module.wasm.content.layer.v1+wasm main.wasm
#      （或 docker buildx imagetools 方式；如用镜像内打包需先补 Dockerfile.oci）
#      并将下方 url 改为: oci://<registry>/plugins/otpmask:1.0.0
#   2. 本地 HTTP 服务（与 key-auth.internal 同机制）：
#      将 main.wasm 放到网关可访问的静态服务，url: http://<host>/otpmask/1.0.0/plugin.wasm
#
# phase/priority：phase 缺省（DEFAULT）→ 在 AUTHN（key-auth 等）之后执行，
# 保证"外部认证/安全 → otpmask 段① 加密"的链序；failStrategy FAIL_CLOSED
# （评审 P0 强制项：插件故障即拒绝，不降级放行）。
#
# 作用域 = 白名单制（重要，勿改回黑名单）：
#   本插件通过 matchRules 仅绑定需要密态加密的路由（见下），并置 defaultConfigDisable: true，
#   使 /provider/*（ai-*：明文双轨，T1 §4.3）与 tee-admin（/usage /audit 管理面）等
#   路由不在 _match_route_ 内 → GetMatchConfig 返回 nil → 插件跳过（等效豁免）。
#   机制说明：matchRules 会被 controller 转为 VM 配置 _rules_/_match_route_（按路由名匹配，
#   ECDS dump 已证）；defaultConfigDisable: true 时未匹配路由不回退全局配置。
#   旧实现用 config:{} + configDisable:true 豁免 17 条 ai-* 路由是无效的——
#   wasm-go 对空配置按"enable globally with defaults"处理，插件仍会运行并误拦截
#   明文 body（本地 E2E 复现：/provider/openai 被 fail-closed 503"无法解析请求体"）。
#   白名单随密态路由增删同步维护（当前仅 infer）。
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: otpmask
  namespace: higress-system
spec:
  # url 为插件 wasm 拉取地址（OCI 或 HTTP）；按上方说明替换为实际地址。
  # 占位值指向仓库内置镜像（构建后推送真实 registry 时替换）。
  url: oci://higress-registry.cn-hangzhou.cr.aliyuncs.com/plugins/otpmask:1.0.0
  failStrategy: FAIL_CLOSE
  defaultConfigDisable: true
  matchRules:
  # 密态路由白名单：仅 infer 走段① 加密；ai-*（/provider/* 明文双轨）与 tee-admin
  # 管理面不在此列 → 自动豁免，无需逐条 configDisable。
  # 路由名 = Ingress 名（infer，见 ingress-infer.yaml）。
  # 插件出站目标（tee/embedding/凭据端点）**必须写 McpBridge dns registry 名 `<name>.dns`**
  # ——注册见 deploy/higress/mcp-bridge-registries.yaml「平台内部服务」段；
  # 簇名只可能是 `outbound|<port>||<name>.dns`（dns registry）或网关同命名空间 Service 的
  # `<svc>.<gw-ns>.svc.cluster.local`。**勿填跨命名空间 FQDN**
  # （如 `tee-infer-service.otpmask.svc.cluster.local`）：该簇不存在 →
  # wasm hostcall `bad argument` → 插件 fail-closed（503，不降级）。本地集群实测于 2026-09-13。
  - ingress:
    - infer
    config:
      mask_modulus: "4294967296"
      model: "mock"
      embedding_service: "embedding.dns"
      embedding_port: "18080"
      tee_service: "tee-infer.dns"
      tee_port: "19090"
      # 密钥生产化（评审 P0，2026-09-01）：以下两项仅在 token 模式（attest_mode: token）下
      # 使用，且必须与 tee-infer 侧 otpmask-keys Secret 完全一致（sig_key 用于协议签名
      # 验签、attest_token 为共享证明凭证），否则签名/证明校验 fail-closed 拒绝。
      # 当前 attest_mode=quote 下二者不生效（用挑战-响应会话 K_sig），但仍严禁硬编码
      # 演示值——生产由部署流水线从 K8s Secret（otpmask-secret.yaml）经 Kustomize/Helm/
      # CI 变量替换注入占位符；切回 token 模式前必须完成注入，见 deploy/higress/README.md §6。
      sig_key: "__SIG_KEY_HEX__"
      attest_token: "__ATTEST_TOKEN_HEX__"
      attest_mode: "quote"
      # ---- P0-4 §12.1：cryptop sidecar（与网关同 Pod，明文不出 Pod）----
      # 簇经 McpBridge static 注册（见 mcp-bridge-registries.yaml，127.0.0.1:19097），
      # 名口径 outbound|19097||cryptop-svc.static；sidecar 容器经
      # cryptopsvc-sidecar-patch.yaml 注入网关 Deployment。
      crypto_service: "cryptop-svc.static"
      crypto_service_port: "19097"
      crypto_profile: "intl"
      mask_prg: "hmac-sha256"
      # ---- 段① 凭据运行态拉取（Phase 1 门禁 #8 / GF.2.5）----
      # 启用后：插件按 credential_interval 周期从管理面**只读**端点
      # （GET /v1/adminext/credentials/<credential_name>）拉取 sig_key/attest_token，
      # **CR 内不再出现真实密钥**（上方 sig_key/attest_token 两项可整体删除）；
      # 轮换＝改管理面凭据文件后由插件周期热生效，**无需重启网关/插件**。
      # 默认关闭（credential_enabled="false" = 行为与接线前完全一致）。
      # 安全边界（如实）：通道为**内网 + 受限读取令牌**（明文）；credential_token 非厂商密钥，
      # 但仍建议经 Secret 注入而非硬编码，见 deploy/higress/README.md §6。
      credential_enabled: "false"
      credential_service: "admin-credential.dns"
      credential_port: "19095"
      credential_name: "otpmask-keys"
      credential_interval: "300"
      credential_token: "__CREDENTIAL_TOKEN__"
      # ---- 限流表拉取（Phase 1 门禁 #7 / 判据 5）----
      # 启用后：插件周期从 gateway-core `GET /ratelimits` 拉取**已签名**限流表（K_rx 验签、
      # 版本单调、**失败保留旧表**；从未拉到 → 放行 + otpmask_ratelimit_degraded_total 告警）。
      # 与路由决策开关 gateway_core_enabled **相互独立**（避免为拉表而打开路由决策）。
      # 默认关闭（ratelimit_enabled="false" = 行为与接线前完全一致）；数据面**执行**仍走
      # 控制面编译产物（cluster-key-rate-limit 配置）。
      ratelimit_enabled: "false"
      # 注意：`gateway-core.dns` 对应 McpBridge 注册名 `gateway-core`，**当前待补**
      # （仓库尚无 gateway-core 的 K8s 清单 → 无 Service 可指向；注册位见
      # mcp-bridge-registries.yaml「平台内部服务」段的注释项）。未注册时该路径按设计
      # 「从未拉到 → 放行 + degraded 计数」，不影响业务可用性。
      gateway_core_service: "gateway-core.dns"
      gateway_core_port: "8085"
      poll_interval: "60"
      # ---- 通道令牌生产化（门禁 #7 边界 C）----
      # 通道令牌（gateway-core 拉取鉴权）**不落 CR**：改由管理面凭据端点运行态拉取
      # （GET /v1/adminext/credentials/core-channel，与段① 凭据共用同一 tick，
      # 轮换即时生效、失败保留旧令牌）。下方 gateway_core_token 仅为兼容/联调写法：
      # 配置了 credential_name 时以运行态令牌为准。
      gateway_core_credential_name: "core-channel"
      gateway_core_credential_token: "__CORE_CHANNEL_TOKEN__"
      gateway_core_token: ""
      # ---- B1 强标标识（GB 45438-2025）密态路径出站兜底（默认关＝现网零变化）----
      # 启用后：上游流未携带 label meta 时，插件在首个明文输出帧前注入 head 标识帧
      # （上游 tee-infer 已带标识 → SawLabel 去重，不重复注入；每流至多一次）。
      # 密态路径推荐以 tee-infer 为注入点，本插件仅兜底；两路同开由 SawLabel 去重防双份。
      content_label_enabled: "false"
      content_label_text: "内容由人工智能生成"
      # ---- P2-1 流式重试（Envoy/Higress 层，默认关＝现网零变化）----
      # 插件侧开关 + 重试归因头注入。默认关闭（false），与现有行为完全一致。
      # 开启后注入 X-Otpmask-Retry-Attempt: 1（首次）+ X-Otpmask-Stream-Retry: on，
      # TEE 侧识别重试不计费。实际重试行为由 Higress Ingress 注解
      # （nginx.ingress.kubernetes.io/proxy-next-upstream-tries 等）控制，
      # 需与 ingress-infer.yaml 的重试配置配合使用。
      stream_retry_enabled: "false"
      stream_retry_max_attempts: "0"
