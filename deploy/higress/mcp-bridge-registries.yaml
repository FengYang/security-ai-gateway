# AI Provider 统一接入（GF.3.2）：McpBridge 厂商上游服务来源（17 家）
#
# 目的：为 ai-proxy 插件（ai-proxy-providers.yaml）声明各厂商上游，
# 与 ingress-ai-providers.yaml（路由）、ai-proxy-providers.yaml（厂商 type 配置，无 key）
# 组成三件套基线；厂商 API Key 由 Higress 控制台「AI 服务提供者」界面录入激活
# （见 deploy/higress/README.md §9），key 不进入本仓库。
#
# 关键点：
#   - dns 类型 registry 的 protocol 默认 HTTP，443 端口必须显式声明 HTTPS
#     （漏配 = 明文打到 443，TLS 握手失败）；
#   - 路由 destination 引用格式为 <registry-name>.<type>:<port>（如 openai.dns:443），
#     见 ingress-ai-providers.yaml；
#   - McpBridge 是 higress-system 下 name=default 的单例资源，spec.registries 为
#     整表替换语义：首次部署（集群尚无 default McpBridge）可直接 apply；
#     若集群已存在（如 Higress Console 创建），须先将现有 registries 条目
#     并入本文件列表后再 apply，避免覆盖丢失。
#
# 厂商域名/type 已与 ai-proxy 2.0.1 provider 实现逐一核对
# （依据见 docs/T1-GF3.2-ai-proxy兼容性评估.md）。
apiVersion: networking.higress.io/v1
kind: McpBridge
metadata:
  name: default
  namespace: higress-system
spec:
  registries:
  # ---- 国际 ----
  - name: openai
    domain: api.openai.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: claude
    domain: api.anthropic.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: gemini
    domain: generativelanguage.googleapis.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: groq
    domain: api.groq.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: openrouter
    domain: openrouter.ai
    port: 443
    type: dns
    protocol: HTTPS
  - name: mistral
    domain: api.mistral.ai
    port: 443
    type: dns
    protocol: HTTPS
  # ---- 国产 ----
  - name: qwen
    domain: dashscope.aliyuncs.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: deepseek
    domain: api.deepseek.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: moonshot
    domain: api.moonshot.cn
    port: 443
    type: dns
    protocol: HTTPS
  - name: minimax
    domain: api.minimax.chat
    port: 443
    type: dns
    protocol: HTTPS
  - name: doubao
    domain: ark.cn-beijing.volces.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: hunyuan
    domain: api.hunyuan.cloud.tencent.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: ernie
    domain: qianfan.baidubce.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: spark
    domain: spark-api-open.xf-yun.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: yi
    domain: api.lingyiwanwu.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: stepfun
    domain: api.stepfun.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: coze
    domain: api.coze.cn
    port: 443
    type: dns
    protocol: HTTPS
  # ---- 限流依赖（cluster-key-rate-limit）----
  # Redis 服务：供 cluster-key-rate-limit 做**集群级计数**（按租户动态分桶，见 security-plugins.yaml）。
  #
  # 关键约束（实境取证 2026-09-12，勿踩）：
  #   - registry 名 `redis-ratelimit` → 插件侧 `redis.service_name` 须写 **`redis-ratelimit.dns`**
  #     （dns 类型后缀为 .dns；静态类型后缀为 .static，本地 standalone 曾用 static + 容器 IP 验证通过）；
  #   - dns 类型的 domain 必须是**合法域名格式**，单标签名会被 controller 拒绝
  #     （`invalid domain format:xxx`）→ 故此处用 K8s 集群内 FQDN；
  #   - protocol 用 TCP（Redis 非 HTTP）；
  #   - **Redis 不可用时 cluster-key-rate-limit 为 fail-open**（实测请求全部放行、限流失效，
  #     恢复后自动重连）→ 必须为 Redis 可用性配告警，不可静默依赖。
  - name: redis-ratelimit
    domain: redis-ratelimit.<namespace>.svc.cluster.local
    port: 6379
    type: dns
    protocol: TCP
  # ---- 平台内部服务（插件出站目标）----
  # 背景（P0b-1 本地集群实测 2026-09-13）：wasm 插件的出站调用走 **FQDNCluster**，
  # 其簇名只可能来自两种注册：① 本 McpBridge 的 dns registry → `outbound|<port>||<name>.dns`；
  # ② 网关**同命名空间** Service → `outbound|<port>||<svc>.<gw-ns>.svc.cluster.local`。
  # 业务服务在 otpmask、网关在 higress-system ⇒ ② 不成立，必须在这里注册为 dns registry，
  # 插件配置（otpmask-plugin.yaml / rpm-shadow-plugin.yaml）与路由注解
  # （ingress-infer.yaml 的 `higress.io/destination`）**必须写 `<name>.dns`**；
  # 写跨命名空间 FQDN（如 `tee-infer-service.otpmask.svc.cluster.local`）会因簇不存在
  # 报 `error status returned by host: bad argument`，表现为插件 fail-closed（503，不降级）。
  #
  # 命名约束：dns registry 的 domain 必须是**合法域名格式**（单标签名会被 controller 拒），
  # 故用集群内 FQDN；registry 的 name 即插件/路由侧引用的 `<name>.dns`。
  - name: tee-infer
    domain: tee-infer-service.<namespace>.svc.cluster.local
    port: 19090
    type: dns
    protocol: HTTP
  - name: embedding
    domain: embedding-service.<namespace>.svc.cluster.local
    port: 18080
    type: dns
    protocol: HTTP
  - name: admin-credential # 段① 凭据运行态拉取端点（gateway-admin-service:19095）
    domain: gateway-admin-service.<namespace>.svc.cluster.local
    port: 19095
    type: dns
    protocol: HTTP
  # - name: gateway-core   # 限流表/策略下发（插件 `gateway_core_service`）——**待补**：
  #   domain: gateway-core.<namespace>.svc.cluster.local   # 仓库尚无 gateway-core 的 K8s 清单，
  #   port: 8085                                           # 无 Service 可指向；P0b-2 前置项。
  #   type: dns
  #   protocol: HTTP
