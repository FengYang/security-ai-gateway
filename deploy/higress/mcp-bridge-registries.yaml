# AI Provider 统一接入（GF.3.2）：McpBridge 厂商上游服务来源（17 家）
#
# 目的：为 ai-proxy 插件（ai-proxy-providers.yaml）声明各厂商上游，
# 与 ingress-ai-providers.yaml（路由）、ai-proxy-providers.yaml（厂商 type 配置，无 key）
# 组成三件套基线；厂商 API Key 由 Higress 控制台「AI 服务提供者」界面录入激活
# （见 deploy/higress/README.md §9），key 不进入本仓库。
#
# 关键点：
#   - dns 类型 registry 的 protocol 默认 HTTP，443 端口必须显式声明 HTTPS
#     （漏配 = 明文打到 443，TLS 握手失败）；
#   - 路由 destination 引用格式为 <registry-name>.<type>:<port>（如 openai.dns:443），
#     见 ingress-ai-providers.yaml；
#   - McpBridge 是 higress-system 下 name=default 的单例资源，spec.registries 为
#     整表替换语义：首次部署（集群尚无 default McpBridge）可直接 apply；
#     若集群已存在（如 Higress Console 创建），须先将现有 registries 条目
#     并入本文件列表后再 apply，避免覆盖丢失。
#
# 厂商域名/type 已与 ai-proxy 2.0.1 provider 实现逐一核对
# （依据见 docs/T1-GF3.2-ai-proxy兼容性评估.md）。
apiVersion: networking.higress.io/v1
kind: McpBridge
metadata:
  name: default
  namespace: higress-system
spec:
  registries:
  # ---- 国际 ----
  - name: openai
    domain: api.openai.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: claude
    domain: api.anthropic.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: gemini
    domain: generativelanguage.googleapis.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: groq
    domain: api.groq.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: openrouter
    domain: openrouter.ai
    port: 443
    type: dns
    protocol: HTTPS
  - name: mistral
    domain: api.mistral.ai
    port: 443
    type: dns
    protocol: HTTPS
  # ---- 国产 ----
  - name: qwen
    domain: dashscope.aliyuncs.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: deepseek
    domain: api.deepseek.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: moonshot
    domain: api.moonshot.cn
    port: 443
    type: dns
    protocol: HTTPS
  - name: minimax
    domain: api.minimax.chat
    port: 443
    type: dns
    protocol: HTTPS
  - name: doubao
    domain: ark.cn-beijing.volces.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: hunyuan
    domain: api.hunyuan.cloud.tencent.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: ernie
    domain: qianfan.baidubce.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: spark
    domain: spark-api-open.xf-yun.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: yi
    domain: api.lingyiwanwu.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: stepfun
    domain: api.stepfun.com
    port: 443
    type: dns
    protocol: HTTPS
  - name: coze
    domain: api.coze.cn
    port: 443
    type: dns
    protocol: HTTPS
  # ---- 限流依赖（cluster-key-rate-limit）----
  # Redis 服务：供 cluster-key-rate-limit 做**集群级计数**（按租户动态分桶，见 security-plugins.yaml）。
  #
  # 关键约束（实境取证 2026-09-12，勿踩）：
  #   - registry 名 `redis-ratelimit` → 插件侧 `redis.service_name` 须写 **`redis-ratelimit.dns`**
  #     （dns 类型后缀为 .dns；静态类型后缀为 .static，本地 standalone 曾用 static + 容器 IP 验证通过）；
  #   - dns 类型的 domain 必须是**合法域名格式**，单标签名会被 controller 拒绝
  #     （`invalid domain format:xxx`）→ 故此处用 K8s 集群内 FQDN；
  #   - **protocol 必须为 HTTP（2026-09-13 本地集群实测纠正）**：原写"Redis 非 HTTP 故用 TCP"
  #     是**错的**——wasm 插件出站调用走 HTTP 语义，TCP 型簇没有 HTTP 选项，
  #     插件报 `redis call failed: error status returned by host: internal failure`
  #     （表现为限流静默不生效、Redis 无计数键）。改 `protocol: HTTP` 后：
  #     同租户连打 8 次出现 **429×7**、Redis 出现
  #     `higress-cluster-key-rate-limit:{otpmask-tenant-qps}:limit_by_per_header:1:x-tenant-id:t-a` 计数键。
  #   - **Redis 不可用时 cluster-key-rate-limit 为 fail-open**（实测请求全部放行、限流失效，
  #     恢复后自动重连）→ 必须为 Redis 可用性配告警，不可静默依赖。
  - name: redis-ratelimit
    domain: redis-ratelimit.<namespace>.svc.cluster.local
    port: 6379
    type: dns
    protocol: HTTP
  # ---- 平台内部服务（插件出站目标）----
  # 背景（P0b-1 本地集群实测 2026-09-13）：wasm 插件的出站调用走 **FQDNCluster**，
  # 其簇名只可能来自两种注册：① 本 McpBridge 的 dns registry → `outbound|<port>||<name>.dns`；
  # ② 网关**同命名空间** Service → `outbound|<port>||<svc>.<gw-ns>.svc.cluster.local`。
  # 业务服务在 otpmask、网关在 higress-system ⇒ ② 不成立，必须在这里注册为 dns registry，
  # 插件配置（otpmask-plugin.yaml / rpm-shadow-plugin.yaml）与路由注解
  # （ingress-infer.yaml 的 `higress.io/destination`）**必须写 `<name>.dns`**；
  # 写跨命名空间 FQDN（如 `tee-infer-service.otpmask.svc.cluster.local`）会因簇不存在
  # 报 `error status returned by host: bad argument`，表现为插件 fail-closed（503，不降级）。
  #
  # 命名约束：dns registry 的 domain 必须是**合法域名格式**（单标签名会被 controller 拒），
  # 故用集群内 FQDN；registry 的 name 即插件/路由侧引用的 `<name>.dns`。
  - name: tee-infer
    domain: tee-infer-service.<namespace>.svc.cluster.local
    port: 19090
    type: dns
    protocol: HTTP
  - name: embedding
    domain: embedding-service.<namespace>.svc.cluster.local
    port: 18080
    type: dns
    protocol: HTTP
  - name: admin-credential # 段① 凭据运行态拉取端点（gateway-admin-service:19095）
    domain: gateway-admin-service.<namespace>.svc.cluster.local
    port: 19095
    type: dns
    protocol: HTTP
  - name: gateway-core # 限流/路由表下发（插件 `gateway_core_service`）
    # P0b-1 补齐：清单见 deploy/k8s/gateway-core.yaml（Deployment+Service，端口 8085）。
    # 密钥对齐：gateway-core 的 OTP_CORE_SIG_KEY 必须与插件 `route_verify_key` 一致，
    # 否则拉表验签失败（按设计保留旧表 + degraded 计数，不阻断业务）。
    domain: gateway-core.<namespace>.svc.cluster.local
    port: 8085
    type: dns
    protocol: HTTP
  # cryptop sidecar（P0-4 §12.1）：与网关同 Pod，故用 **static** 指 127.0.0.1
  # （非跨 Pod 服务，不能写集群 FQDN）；生成簇名 outbound|19097||cryptop-svc.static。
  # ⚠️ 实测（Higress 2.2.5，2026-10-11）：`type: static` 的 `domain` **必须写成 `host:port`**
  #    （`127.0.0.1:19097`）；写裸 IP（`127.0.0.1` / Pod IP）或裸主机名会被 controller 拒绝：
  #    `error invalid endpoint:<值> with static type` ⇒ 簇不物化、插件密码路径 fail-closed。
  # 容器注入见 cryptopsvc-sidecar-patch.yaml。
  - name: cryptop-svc
    domain: 127.0.0.1:19097
    port: 19097
    type: static
    protocol: HTTP
  # attest-verify sidecar（P1-8 T1 部署接线）：与网关同 Pod，用 static 指 127.0.0.1
  # （非跨 Pod 服务，不能写集群 FQDN）；生成簇名 outbound|19191||attest-verify.static。
  # ⚠️ 实测（Higress 2.2.5，2026-10-11）：`type: static` 的 `domain` **必须写成 `host:port`**
  #    （`127.0.0.1:19191`）；写裸 IP 会被 controller 拒绝：
  #    `error invalid endpoint:<值> with static type` ⇒ 簇不物化、插件证明验证 fail-closed。
  # 容器注入见 attest-verify-sidecar-patch.yaml。
  - name: attest-verify
    domain: 127.0.0.1:19191
    port: 19191
    type: static
    protocol: HTTP
  # ---- MCP 后端（非敏感轨：Higress MCP Server 的工具上游）----
  # 用途：为 `/mcp-servers/public-tools` 提供工具后端（方案 §3.2.2 非敏感轨）。
  #
  # ⚠️ **当前为注释骨架，勿直接启用**：本仓库**尚无**真实 MCP 工具后端服务（集群实测：无 mcp-* Service）。
  #    启用前必须：① 部署真实后端；② 把 domain/port 换成实际值。
  #    保留注释的原因：本 McpBridge 为 `name=default` **单例**且 registries 为**整表替换**语义，
  #    写入不存在的后端会注册"幽灵服务"（dns 解析失败 → 请求 503 + controller 反复告警）。
  #
  # 命名约束（同本文件既有说明）：dns 类型 domain 须为合法域名格式 → 用集群内 FQDN；
  #    引用侧（Ingress 的 `higress.io/destination`）写 `<name>.dns:<port>`。
  #
  # - name: mcp-tools
  #   domain: mcp-tools.<namespace>.svc.cluster.local
  #   port: 8080
  #   type: dns
  #   protocol: HTTP
  #
  # ---- 敏感轨（secure-tools）无需新增 registry ----
  # 敏感轨 Ingress 的 destination 复用既有 registry `tee-infer`（`tee-infer.dns:19090`），
  # 见 deploy/higress/ingress-mcp.yaml。故本段**仅**服务非敏感轨。
