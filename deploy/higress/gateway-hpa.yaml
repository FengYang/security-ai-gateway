# Higress 网关水平自动扩缩容（GF.2.6）
#
# 背景（评审意见）：既有 deploy/k8s/hpa.yaml 仅覆盖 embedding-service 与
# tee-infer-service，未覆盖网关自身；启用 WAF（Coraza 规则引擎，CPU 密集）后
# 网关成为新的扩缩容瓶颈，须补齐网关 HPA。
#
# 依赖：集群安装 metrics-server（kind 单节点验证需先部署 metrics-server）。
# 目标：Higress 数据面 Deployment `higress-gateway`（higress-system 命名空间，
# 由官方 Helm 安装）；如自定义 release 名导致 Deployment 名不同，请同步调整
# scaleTargetRef.name。
#
# 阈值策略：WAF 为 CPU 密集，阈值保守（65%），min=2 与旧 envoy-gateway 副本数对齐，
# 保证 fail-closed 语义下始终有冗余实例；scaleDown 加稳定窗口防抖动。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: higress-gateway-hpa
  namespace: higress-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: higress-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65 # WAF CPU 密集，阈值保守
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # 防止抖动
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
