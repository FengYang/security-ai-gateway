# 协议签名密钥 K_sig 与远程证明令牌（Higress 形态 B 密钥源）
#
# 与 deploy/k8s/secret.yaml 的 otpmask-keys 对齐：tee-infer 侧经 secretKeyRef 注入
# -sig-key/-attest-token；otpmask 插件侧（otpmask-plugin.yaml 的 sig_key/attest_token
# 占位符 __SIG_KEY_HEX__ / __ATTEST_TOKEN_HEX__）由部署流水线从本 Secret 经
# Kustomize replacements / Helm values / CI 变量替换注入。
#
# 安全要求（fail-closed）：
#   1. 禁止明文入库（本文件仅含占位符，真实值由 KMS/Vault/TEE 签发后注入集群 Secret）；
#   2. sig-key 与 attest-token 必须与 tee-infer 侧一致（token 模式下签名/证明校验才通过）；
#   3. quote 模式（生产推荐）下二者不参与会话密钥派生，但仍须由密钥管理系统托管轮换。
apiVersion: v1
kind: Secret
metadata:
  name: otpmask-keys
  namespace: otpmask
type: Opaque
stringData:
  sig-key: "__SIG_KEY_HEX__"
  attest-token: "__ATTEST_TOKEN_HEX__"
