#   - ingress:
#     - infer
#     config:
#       server:
#         type: mcp-proxy          # 待核实：mcp-proxy 的完整必填字段
#         transport: http          # http(StreamableHTTP) | sse
#         timeout: 5000
#         passthroughAuthHeader: false
#       # tools: []                 # 待核实：工具级配置与 securitySchemes
