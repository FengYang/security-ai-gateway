# MCP Server 统一托管配置基线（P1：Higress 引入）
#
# ⚠️ 本文件是**声明式基线片段**，**不是**"整份 ConfigMap"：
#   `higress-config` 由 Helm 管理，且其 `higress` 字段还含 `tracing` 等**运行期追加**内容
#   （由 scripts/higress-tracing.py 写入）。直接 `kubectl apply` 整份 ConfigMap 会**覆盖 `higress` 键**
#   → 丢失 tracing 等既有配置（已知风险）。
#
# ✅ 正确用法（二选一）：
#   1) **推荐**：由 `scripts/higress-mcp.py --profile native|secure` **合并**本片段到现有 higress-config
#      （get → 解析 YAML → 仅合并/新增 `mcpServer` 键 → replace → 重启网关；其余键原样保留）
#      （P2-1 T-2 ②）亦可整文件作为源：`--mcp-server-file deploy/higress/mcp-bridge.yaml`
#      ——脚本逐键安全兜底（enable 强制开；sse 后缀/redis/match_list/servers 缺省补齐）
#   2) 干净环境（确认无 tracing 等既有段）可手工把下方 `mcpServer` 段并入其 `higress` 字段
#
# 依据：Higress《MCP Server 快速开始》（需 Higress **2.1.0+**；本集群实测 2.2.5）
# 字段语义与取舍见《GA-Higress-MCP接入与打通-技术实现方案》§4.1 / §4.3。
# 生效前提：Higress 需具备 Redis（见方案 §4.3：R1 复用现有 / R2 官方 helm enableRedis）。
#
# ============================================================================
# 片段：mcpServer 段   （profile = native，对应情况① 客户自建可信内网）
# ============================================================================
mcpServer:
  enable: true
  # MCP 客户端 SSE 后缀；官方客户端 URL 契约：http://<gateway>/mcp-servers/<name>/sse
  sse_path_suffix: /sse
  # Redis：官方列为必填（配置保留）。MCP 2026-07-28 已**无状态化**（移除协议级会话）；
  # U-4 实测（2026-10-19）Streamable HTTP 链路未观察到 Redis 会话依赖
  # （官方 FAQ：SSE 会话保持才需要 Redis；Streamable HTTP 可省）。
  redis:
    # R1（复用现有，默认）：指向集群内既有 Redis
    address: redis-ratelimit.otpmask.svc.cluster.local:6379
    # R2（官方形态）改为：redis-stack-server.higress-system.svc.cluster.local:6379
    username: ""
    password: ""
    db: 0
  # 语义（2026-10-19 官方文档核实闭环，原 U-6）：MCP **会话保持**路由规则——
  #   官方逐字："matchList 中的匹配规则必须要覆盖所有使用 SSE 协议的 MCP 服务器路径"。
  #   字段：match_rule_domain / match_rule_path / match_rule_type(prefix) /
  #         upstream_type(sse) / enable_path_rewrite / path_rewrite_prefix
  #   （来源：《MCP Server 快速开始（对接现存 SSE Server）》《…（Docker 版）》常见问题 #1）。
  #   **U-4 实测闭环（2026-10-19，集群）**：本环境后端为 Streamable HTTP（无状态）→
  #   `match_list: []` 下 public 轨全链路正常（tools/list / tools/call × 双后端；官方 FAQ
  #   亦明确 Streamable HTTP 可不用 Redis 会话保持）→ **保持空登记**；SSE 后端接入时再按上列字段填写。
  match_list: []
  # DB 类内置 MCP Server 在此配置（官方快速开始示例均为 `servers: []`）；REST/OpenAPI 转换型
  # 走**控制台 MCP 管理界面**；存量 MCP 后端（SSE/Streamable HTTP）接入形态＝服务来源+路由+
  # match_list（官方 with-SSE 篇）。样例后端落点见 deploy/samples/mcp-backends/（P2-1 T-2）。
  servers: []

# ============================================================================
# profile = secure（对应情况② 客户不信任基础设施）的差异说明
# ----------------------------------------------------------------------------
# secure **不改变** `mcpServer` 段本身，而是在其之上追加三步（由 higress-mcp.py --profile secure 执行）：
#   ① 注册 MCP 后端服务来源 → deploy/higress/mcp-bridge-registries.yaml「MCP 后端」段（当前为注释骨架，
#      待真实后端就位后启用）
#   ② 新增敏感轨 Ingress（secure-tools → tee-infer）→ deploy/higress/ingress-mcp.yaml
#   ③ 下发 mcpsec 策略到 TEE 并校验 mcpguard 就绪门控（fail-closed）
#
# 分轨语义（红线 V-4 的结构性保障，方案 §3.2.2）：
#   public-tools → Higress MCP Server（明文轨，仅注册**非敏感**工具）
#   secure-tools → otpmask 段① → TEE（密态轨，仅注册**敏感**工具）
#   两轨工具集合**不相交** ⇒ 敏感参数不可能以明文经过网关。
