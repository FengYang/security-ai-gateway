# MCP 统一代理（GF.3.1）：McpBridge 启用模板
#
# 目的：MCP 工具/MCP 服务经网关统一接入，走 text 载荷进入段① 加密链，
# 使 MCP 流量与普通 LLM 流量一样被 key-auth / 限流 / 计量 / 审计 / 加密覆盖。
#
# 关键边界（方案 §3.10 / 研发计划 GF.3.1）：
#   - 实际 MCP Server 部署在 tee-infer 之后的**明文域**（企业内网），网关只做
#     MCP 协议接入与段① 加密转发，不直接暴露明文工具；
#   - MCP 流量复用 text 载荷路径 → 证明会话信封 → tee-infer（Guardrail + 计量 + 审计）；
#   - fail-closed：本插件与 otpmask 链一致，配置错误即拒绝，不降级明文。
#
# 字段级核验（GF.1.7）：mcpServerConfig / registryConfig 字段按目标 Higress 版本
# （v2.1.5）的 McpBridge schema 复核后启用；接入外部 MCP registry（Nacos 等）时改用
# registryConfig，本模板提供内联 mcpServerConfig 骨架。
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: mcp-bridge
  namespace: higress-system
  annotations:
    higress.io/wasm-plugin-title: MCP Bridge
    higress.io/wasm-plugin-category: custom
spec:
  url: http://localhost:8002/plugins/mcp/1.0.0/plugin.wasm
  failStrategy: FAIL_CLOSED
  defaultConfig:
    # 内联 MCP Server 定义骨架（接入外部 registry 时改 registryConfig）
    mcpServerConfig:
    - name: "enterprise-toolbox"            # 网关对外暴露的 MCP 服务名
      timeout: 2000                          # 单次工具调用超时（ms）
      streamableHTTPConfig:
        mcpServerUrl: "http://mcp-toolbox.otpmask.svc.cluster.local:8080/mcp" # 明文域 MCP 服务
        mcpServerHeaders: []                 # 按需补充鉴权头（走 KMS/Vault，GF.2.5）
    # 若使用 Nacos/Zookeeper 注册中心动态发现 MCP 服务，启用以下配置并去掉 mcpServerConfig：
    # registryConfig:
    #   type: nacos
    #   domain: "nacos-server.otpmask.svc.cluster.local"
    #   port: 8848
