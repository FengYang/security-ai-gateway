# AI Provider 统一接入（GF.3.2）：厂商路由（17 条，每厂商独立 path 入口）
#
# 调用契约：POST /provider/<name>/v1/chat/completions（入站 OpenAI 协议，
# ai-proxy 按 path 后缀自动检测协议：/v1/chat/completions=OpenAI、
# /v1/messages=Claude、/v1/embeddings=向量，并自动转换为厂商协议、回转响应）。
#
# 路由目标：higress.io/destination 注解为准，指向 mcp-bridge-registries.yaml
# 声明的 dns registry（格式 <name>.<type>:<port>）；spec.backend 必须用 McpBridge
# resource 方式（同 ingress-infer.yaml 的 default ingress），resource 名 = default。
# 勿用 service backend：name 会被展开成 <name>.<ns>.svc.cluster.local FQDN，
# 路由不到 registry 物化的 <name>.<type> 簇 → 503 cluster_not_found
# （本地 fake-apiserver 端到端已验证：resource+destination 200、service 500 503）。
# 厂商上游协议改写（Host/path/Authorization）由 ai-proxy 插件按 provider type 完成，
# 路由前缀 /provider/<name>/ 会被插件整体重写，无需 Ingress 重写注解；
# 唯一例外 coze：protocol original 透传，前缀剥离由插件 subPath 完成（见
# ai-proxy-providers.yaml）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-openai
  namespace: higress-system
  annotations:
    higress.io/destination: openai.dns:443
spec:
  ingressClassName: higress
  rules:
  - http:
      paths:
      - path: /provider/openai/
        pathType: Prefix
        backend:
          resource:
            apiGroup: networking.higress.io
            kind: McpBridge
            name: default
  tls:
  - secretName: default
---
