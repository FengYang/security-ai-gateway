# MCP 路由（分轨：secure-tools 敏感轨 / public-tools 非敏感轨）
#
# 依据：《GA-Higress-MCP接入与打通-技术实现方案》v1.5
#   · §3.2.2 分轨＝**按 MCP Server 名 / 入口路径**（不依赖运行时 header 覆盖）
#   · §4.4   两轨客户端 URL 与"对外 URL ↔ 内部端点"映射
#   · §3.3   情况② 新增两条 Ingress
#
# 官方客户端 URL 契约：http://<gateway>/mcp-servers/<server-name>/sse
#
# 分轨语义（红线 V-4 的结构性保障）：
#   public-tools → Higress MCP Server（明文轨，仅注册**非敏感**工具）
#   secure-tools → otpmask 段① → TEE（密态轨，仅注册**敏感**工具）
#   两轨工具集合**不相交** ⇒ 敏感参数不可能以明文经过网关。
#
# 插件链：两轨均经 cors / key-auth / ip-restriction / rate-limit；
#   **secure-tools 额外挂 otpmask**（段① 加密）——插件 matchRules 见 deploy/higress/security-plugins.yaml。
---
# ============================================================================
# 敏感轨：/mcp-servers/secure-tools → tee-infer（段① 加密 → TEE 内 MCP 终结）
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-secure-tools
  namespace: higress-system
  annotations:
    # 与 ingress-infer.yaml 同型：目标解析为 McpBridge dns registry 物化的簇
    # （registry 名 tee-infer → 簇 outbound|19090||tee-infer.dns）
    higress.io/destination: tee-infer.dns:19090
spec:
  ingressClassName: higress
  rules:
  - http:
      paths:
      - path: /mcp-servers/secure-tools
        pathType: Prefix
        backend:
          # 必须用 McpBridge **resource** backend（见 ingress-infer.yaml 注释：
          # 用 service backend 会被展开成 <name>.<ns>.svc.cluster.local → cluster_not_found）
          resource:
            apiGroup: networking.higress.io
            kind: McpBridge
            name: default
  tls:
  - secretName: default
---
# ============================================================================
# 非敏感轨：public（样例后端 mcp-demo / mcp-fs）→ 显式路由（**2026-10-19 集群实证启用**）
# ----------------------------------------------------------------------------
# U-1 实测（2026-10-19）：Higress 内置路由**不承载** `/mcp-servers/*` 任意后端
#   （未注册服务路径实测 404，key-auth 通过后亦然）→ **必须显式 Ingress**；
#   public 轨存量后端客户端 URL 契约：`http://<gateway>/mcp-servers/<name>`（**基路径**）。
# U-4 实测（2026-10-19）：后端为 Streamable HTTP（无状态）→ `match_list`/Redis 会话保持
#   **非必需**（`mcpServer.enable=true` + `match_list: []` 下全链路正常）。
# 路径重写：`higress.io/rewrite-target: /mcp`（前缀替换语义：/mcp-servers/<name> → 后端 /mcp；
#   带后缀请求拼接为 /mcp/<suffix>，故客户端应使用基路径）。
# 后端指向 deploy/higress/mcp-bridge-registries.yaml 的 `mcp-demo` / `mcp-fs` registry，
#   与 secure-tools 同型用 **McpBridge resource backend**（防 cluster_not_found）。
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-public-demo
  namespace: higress-system
  annotations:
    higress.io/destination: mcp-demo.dns:8080
    higress.io/rewrite-target: /mcp
spec:
  ingressClassName: higress
  rules:
  - http:
      paths:
      - path: /mcp-servers/mcp-demo
        pathType: Prefix
        backend:
          resource:
            apiGroup: networking.higress.io
            kind: McpBridge
            name: default
  tls:
  - secretName: default
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-public-fs
  namespace: higress-system
  annotations:
    higress.io/destination: mcp-fs.dns:8080
    higress.io/rewrite-target: /mcp
spec:
  ingressClassName: higress
  rules:
  - http:
      paths:
      - path: /mcp-servers/mcp-fs
        pathType: Prefix
        backend:
          resource:
            apiGroup: networking.higress.io
            kind: McpBridge
            name: default
  tls:
  - secretName: default
