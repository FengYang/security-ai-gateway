# 推理路由（P0b：Higress Ingress → tee-infer-service）
#
# Higress 网关将 /infer 请求路由到 tee-infer-service（南向推理），
# 插件链按 phase/priority 在转发前执行；tee-infer 侧段① 解密入口不变。
# 路由目标：以 higress.io/destination 注解为准，写 **McpBridge dns registry 名**
# （`<name>.dns:<port>`，注册见 mcp-bridge-registries.yaml「平台内部服务」段）；
# **勿写跨命名空间 FQDN**——该簇不存在，插件/路由会 fail-closed（503）。
# spec.backend 的 service.name 仅为声明式占位（K8s 标准 Ingress 不支持跨命名空间后端字段）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infer
  namespace: higress-system
  annotations:
    higress.io/destination: tee-infer.dns:19090
    # P2-1 流式重试（Higress 层，兼容 Nginx Ingress 注解）：
    # 默认 0 次（关闭），与现有行为完全一致；
    # 开启后仅在响应头返回前重试（连接失败/5xx/timeout 等），
    # 流式中途断流不重试（HTTP 语义限制）。
    # proxy-next-upstream-tries=0 → 禁用重试；设为 1-3 启用。
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "0"
    # 重试条件：error（连接错误）+ timeout + http_500 + http_502 + http_503 + http_504 + invalid_header
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_500 http_502 http_503 http_504 invalid_header"
    # 重试总超时（秒）；未设置 = 继承全局超时。
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "60"
spec:
  ingressClassName: higress
  rules:
  - http:
      paths:
      - path: /infer
        pathType: Prefix
        backend:
          # 必须用 McpBridge **resource** backend（同 ingress-ai-providers.yaml）：
          # 用 `service` backend 时 name 会被展开成 `<name>.<ns>.svc.cluster.local`，
          # 路由不到 registry 物化的 `<name>.dns` 簇 → 503 `cluster_not_found`
          # （本地集群实测 2026-09-13；该结论与 ai-providers 清单注释一致）。
          resource:
            apiGroup: networking.higress.io
            kind: McpBridge
            name: default
  tls:
  - secretName: default
---
# 管理面路由（治理端点 /usage /audit）
# 内网隔离为硬约束（非假设）：由 security-plugins.yaml 中挂到 tee-admin 的
# ip-restriction 插件（allow 内网 CIDR）强制，且 failStrategy: FAIL_CLOSE。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tee-admin
  namespace: higress-system
  annotations:
    higress.io/destination: tee-infer.dns:19090
spec:
  ingressClassName: higress
  rules:
  - http:
      paths:
      - path: /usage
        pathType: Prefix
        backend:
          # 必须用 McpBridge **resource** backend（同 ingress-ai-providers.yaml）：
          # 用 `service` backend 时 name 会被展开成 `<name>.<ns>.svc.cluster.local`，
          # 路由不到 registry 物化的 `<name>.dns` 簇 → 503 `cluster_not_found`
          # （本地集群实测 2026-09-13；该结论与 ai-providers 清单注释一致）。
          resource:
            apiGroup: networking.higress.io
            kind: McpBridge
            name: default
      - path: /audit
        pathType: Prefix
        backend:
          # 必须用 McpBridge **resource** backend（同 ingress-ai-providers.yaml）：
          # 用 `service` backend 时 name 会被展开成 `<name>.<ns>.svc.cluster.local`，
          # 路由不到 registry 物化的 `<name>.dns` 簇 → 503 `cluster_not_found`
          # （本地集群实测 2026-09-13；该结论与 ai-providers 清单注释一致）。
          resource:
            apiGroup: networking.higress.io
            kind: McpBridge
            name: default
  tls:
  - secretName: default
