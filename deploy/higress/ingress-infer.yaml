# 推理路由（P0b：Higress Ingress → tee-infer-service）
#
# Higress 网关将 /infer 请求路由到 tee-infer-service（南向推理），
# 插件链按 phase/priority 在转发前执行；tee-infer 侧段① 解密入口不变。
# 路由目标：以 higress.io/destination 注解为准（跨命名空间 FQDN）；
# spec.backend 的 namespace 与 Ingress 所在 ns 对齐（消除双写歧义）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infer
  namespace: higress-system
  annotations:
    higress.io/destination: tee-infer-service.otpmask.svc.cluster.local:19090
spec:
  ingressClassName: higress
  rules:
  - http:
      paths:
      - path: /infer
        pathType: Prefix
        backend:
          service:
            name: tee-infer-service
            namespace: otpmask
            port:
              number: 19090
  tls:
  - secretName: default
---
# 管理面路由（治理端点 /usage /audit）
# 内网隔离为硬约束（非假设）：由 security-plugins.yaml 中挂到 tee-admin 的
# ip-restriction 插件（allow 内网 CIDR）强制，且 failStrategy: FAIL_CLOSED。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tee-admin
  namespace: higress-system
  annotations:
    higress.io/destination: tee-infer-service.otpmask.svc.cluster.local:19090
spec:
  ingressClassName: higress
  rules:
  - http:
      paths:
      - path: /usage
        pathType: Prefix
        backend:
          service:
            name: tee-infer-service
            namespace: otpmask
            port:
              number: 19090
      - path: /audit
        pathType: Prefix
        backend:
          service:
            name: tee-infer-service
            namespace: otpmask
            port:
              number: 19090
  tls:
  - secretName: default
