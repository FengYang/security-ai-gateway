# gateway-admin-service Helm values（M2 A-2）
# 参数化对齐 docs/管理门户-apiTokens-Secret化-M2细化方案.md §2.2.5。

# C-18（M9 修订 2→1）：管理面**必须单副本**——tenant store 为 SQLite 多写者、限流计数
# 为进程内实现，水平扩展须先迁移共享数据库（P2 规划）。违反 = 数据不一致 + 风控绕过。
replicaCount: 1

# C-18/M9：单副本 PDB 配套。maxUnavailable=0 → 节点驱逐不被静默放行（须运维显式介入），
# 避免驱逐/滚动期间静默出现双副本。
podDisruptionBudget:
  enabled: true
  maxUnavailable: 0

image:
  repository: security-ai-gateway/gateway-admin-service
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

# 管理面 listener（凭据端点 / 指标 / 探针）
admin:
  port: 19095

# broker listener（中转端点；与管理面网络隔离）
broker:
  enabled: true
  port: 19096
  # 兼容期（三步收口第 1 步）：管理面端口同时暴露 broker，保持既有链路可用。
  # 收口期置 false（仅 :19096 提供服务）。
  legacyPortEnabled: true
  # 凭据目录（文件 Secret 源）。为空则回落 ADMIN_BROKER_PROVIDERS_JSON 环境变量路径。
  secretsDir: /var/run/broker-secrets
  # 生成 provider customUrl 的对外基址（broker 启用时必填）
  publicBase: ""
  # ai-proxy CR 文件路径（可选；设置后启用 CR 漂移检测 orphanDetected）
  crFile: ""
  # 透传的额外环境变量（如 ADMIN_BROKER_ALLOW_HTTP=true 仅限本地联调）
  extraEnv: []
  networkPolicy:
    enabled: true
    # 允许访问 broker 端口的来源命名空间（Higress 数据面）
    ingressFromNamespace: higress-system
    # 允许访问管理面的来源命名空间（控制台 + 监控）
    adminIngressNamespaces:
      - higress-system
      - monitoring
    # broker 出公网允许的 CIDR（缺省空 = 仅 DNS）；生产请收紧至厂商具体地址段
    egressAllowCIDRs: []

# 最小角色控制（M2 §2.4）：写权限用户名白名单；空 = 无人可写（fail-closed）
auth:
  adminUsers: []

# P1-2：Collector allow-list 热更 wiring（方案 B3，2026-10-08）
# 事实源 = Collector ConfigMap；admin-service 读→改→PATCH 写回，并 PATCH otel-collector
# Deployment 的 pod-template 注解触发滚动（OTel Collector 无原生热重载）。
# RBAC 由 templates/rbac.yaml 经 **resourceNames 点名收敛**（仅本 ConfigMap + 本 Deployment）。
# 注意：Collector 须与 admin-service 同 namespace（Role 为 namespace 作用域）。
tracingAllowlist:
  enabled: true
  configMapName: otel-collector-config
  deploymentName: otel-collector
  # true = 由 admin-service 触发滚动重建；false = 仅写配置，交由外部 Reloader 生效
  restart: true

# 内部令牌共享密钥（与 Java 控制台 admin-ext 一致）
jwt:
  # 直接给定明文（仅本地联调）；生产建议 existingSecret
  secret: ""
  existingSecret: ""
  existingSecretKey: jwt-secret

# 凭据目录的 Secret 卷（每 provider 一个 key，值 = 凭据文件内容）。
# 留空则不挂载（此时须以 extraEnv 提供 ADMIN_BROKER_PROVIDERS_JSON 路径）。
brokerSecrets:
  existingSecret: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"

nodeSelector: {}
tolerations: []
affinity: {}

# N10（§4.3.10）：非可信基础设施（轴 A=untrusted）下的门户自保护。
#   * enabled=true：限定机密 VM 机型调度 + 镜像度量 annotation（门户启动自检 fail-closed）；
#   * 轴 A=trusted（普通客户可信域）保持 false。
n10:
  enabled: false
  # 机密 VM 机型调度（节点须带对应标签/污点；按云厂商机型调整）。
  nodeSelector:
    otpmask.io/confidential-vm: "true"
  tolerations:
    - key: otpmask.io/confidential-vm
      operator: Equal
      value: "true"
      effect: NoSchedule
  # 镜像度量 annotation（发布时回填；与门户启动自检口径一致，§4.3.10 item 1）。
  imageMeasurement: ""
  # N3/N10：attest-verify 状态源（内部通道）。未配置 = N3 看板降级 unknown + 强制"未闭环"
  # （C-19）；轴 A=untrusted 时启动自检 fail-closed 拒启动（V-S3）——须先接通聚合通道。
  attestStatusURL: ""
  attestStatusToken: ""
  attestStatusTimeoutSec: 5
  # tenant store 加密卷（§4.3.10 item 3）：TEE 加密块设备 / cryptosvc 信封加密卷。
  # enabled=true 启用门户存储（TENANT_STORE_PATH 指向该卷）；凭据经 existingSecret 注入。
  tenantStore:
    enabled: false
    # 须为机密 VM 加密块设备存储类（按实环境调整；禁 hostPath / 非加密 emptyDir）。
    storageClassName: tee-encrypted
    size: 1Gi
    mountPath: /var/lib/otpmask-tenant
    # 门户启用必填（fail-closed）：Secret 键 = token-pepper（≥32 字节随机）。
    existingSecret: ""
    tokenPepperKey: token-pepper
    # Key 签发通道（§6.11：auth-service POST /v1/issue，:19200）；门户启用必填。
    authServiceURL: ""
