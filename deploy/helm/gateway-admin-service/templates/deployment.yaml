apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway-admin-service.fullname" . }}
  labels:
    {{- include "gateway-admin-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gateway-admin-service.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gateway-admin-service.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        prometheus.io/port: {{ .Values.admin.port | quote }}
        {{- if and .Values.n10.enabled .Values.n10.imageMeasurement }}
        otpmask.io/image-measurement: {{ .Values.n10.imageMeasurement | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "gateway-admin-service.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: gateway-admin-service
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        # ---- 管理面 ----
        - name: ADMIN_SVC_LISTEN
          value: ":{{ .Values.admin.port }}"
        - name: ADMIN_SVC_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "gateway-admin-service.jwtSecretName" . }}
              key: {{ .Values.jwt.existingSecretKey }}
        # 最小角色控制（M2 §2.4）：写权限用户名白名单；空 = 无人可写（fail-closed）
        - name: ADMIN_SVC_ROLE_ADMINS
          value: {{ join "," .Values.auth.adminUsers | quote }}
        # ---- broker listener（A-2）----
        {{- if .Values.broker.enabled }}
        - name: ADMIN_SVC_BROKER_LISTEN
          value: ":{{ .Values.broker.port }}"
        # 兼容期开关：true = 管理面端口同时暴露 broker；收口期置 "false"
        - name: ADMIN_SVC_BROKER_LEGACY_PORT
          value: {{ .Values.broker.legacyPortEnabled | quote }}
        - name: ADMIN_BROKER_SECRETS_DIR
          value: {{ .Values.broker.secretsDir | quote }}
        - name: ADMIN_BROKER_PUBLIC_BASE
          value: {{ include "gateway-admin-service.publicBase" . | quote }}
        {{- if .Values.broker.crFile }}
        - name: ADMIN_BROKER_CR_FILE
          value: {{ .Values.broker.crFile | quote }}
        {{- end }}
        {{- end }}
        {{- range .Values.broker.extraEnv }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        # P1-2：Collector allow-list 热更 wiring（方案 B3）——事实源 = Collector ConfigMap。
        # 权限见 templates/rbac.yaml（resourceNames 点名收敛）。
        {{- if .Values.tracingAllowlist.enabled }}
        - name: ADMIN_OTEL_COLLECTOR_CONFIGMAP
          value: {{ .Values.tracingAllowlist.configMapName | quote }}
        - name: ADMIN_OTEL_COLLECTOR_DEPLOYMENT
          value: {{ .Values.tracingAllowlist.deploymentName | quote }}
        - name: ADMIN_OTEL_COLLECTOR_RESTART
          value: {{ .Values.tracingAllowlist.restart | quote }}
        {{- end }}
        {{- if .Values.n10.attestStatusURL }}
        # N3/N10：attest-verify 状态源（内部通道；未配置 = 看板降级 + untrusted 档自检 fail-closed）
        - name: ATTEST_STATUS_URL
          value: {{ .Values.n10.attestStatusURL | quote }}
        - name: ATTEST_STATUS_TIMEOUT_SEC
          value: {{ .Values.n10.attestStatusTimeoutSec | quote }}
        {{- if .Values.n10.attestStatusToken }}
        - name: ATTEST_STATUS_TOKEN
          value: {{ .Values.n10.attestStatusToken | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.n10.tenantStore.enabled }}
        # N10：tenant store 加密卷（§4.3.10 item 3）+ 门户启用必填（fail-closed）
        - name: TENANT_STORE_PATH
          value: {{ printf "%s/tenants.db" .Values.n10.tenantStore.mountPath | quote }}
        - name: TENANT_TOKEN_PEPPER
          valueFrom:
            secretKeyRef:
              name: {{ required "n10.tenantStore.existingSecret 必填（门户启用需含 token-pepper 的 Secret）" .Values.n10.tenantStore.existingSecret }}
              key: {{ .Values.n10.tenantStore.tokenPepperKey }}
        - name: AUTH_SERVICE_URL
          value: {{ required "n10.tenantStore.authServiceURL 必填（§6.11 auth-service /v1/issue）" .Values.n10.tenantStore.authServiceURL | quote }}
        {{- end }}
        ports:
        - name: http-admin
          containerPort: {{ .Values.admin.port }}
          protocol: TCP
        {{- if .Values.broker.enabled }}
        - name: http-broker
          containerPort: {{ .Values.broker.port }}
          protocol: TCP
        {{- end }}
        {{- if or (and .Values.broker.enabled .Values.brokerSecrets.existingSecret) .Values.n10.tenantStore.enabled }}
        volumeMounts:
        {{- if and .Values.broker.enabled .Values.brokerSecrets.existingSecret }}
        - name: broker-secrets
          mountPath: {{ .Values.broker.secretsDir }}
          readOnly: true
        {{- end }}
        {{- if .Values.n10.tenantStore.enabled }}
        # N10：tenant store 加密卷（禁 hostPath / 非加密 emptyDir）
        - name: tenant-store
          mountPath: {{ .Values.n10.tenantStore.mountPath }}
        {{- end }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        # /readyz 三态：broker 未启用 → 200；正常 → 200；连续重载失败 ≥3 → 503
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-admin
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-admin
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      {{- if or (and .Values.broker.enabled .Values.brokerSecrets.existingSecret) .Values.n10.tenantStore.enabled }}
      volumes:
      {{- if and .Values.broker.enabled .Values.brokerSecrets.existingSecret }}
      # 凭据目录（每 provider 一个 key，值 = 凭据文件内容）；目录缺失即回落环境变量路径
      - name: broker-secrets
        secret:
          secretName: {{ .Values.brokerSecrets.existingSecret }}
      {{- end }}
      {{- if .Values.n10.tenantStore.enabled }}
      # N10：tenant store 加密卷（§4.3.10 item 3，storageClassName 须为加密块设备）
      - name: tenant-store
        persistentVolumeClaim:
          claimName: {{ printf "%s-tenant-store" (include "gateway-admin-service.fullname" .) }}
      {{- end }}
      {{- end }}
      {{- $nodeSelector := .Values.nodeSelector }}
      {{- if .Values.n10.enabled }}
      {{- $nodeSelector = merge (dict) .Values.n10.nodeSelector $nodeSelector }}
      {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $tolerations := .Values.tolerations }}
      {{- if .Values.n10.enabled }}
      {{- $tolerations = concat .Values.tolerations .Values.n10.tolerations }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
