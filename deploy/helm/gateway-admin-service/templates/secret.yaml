{{- if and (not .Values.jwt.existingSecret) .Values.jwt.secret }}
# 内部令牌共享密钥（与 Java 控制台 admin-ext 配置一致）。
# 生产建议改用 jwt.existingSecret（外部 Secret 管理），避免明文落在 values 中。
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway-admin-service.fullname" . }}-jwt
  labels:
    {{- include "gateway-admin-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.jwt.existingSecretKey }}: {{ .Values.jwt.secret | quote }}
{{- end }}
