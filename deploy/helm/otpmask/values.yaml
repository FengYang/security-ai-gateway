# otpmask Helm Chart 默认值（与 deploy/k8s kustomize 清单语义一致）
# 覆盖方式：helm install otpmask ./deploy/helm/otpmask -f my-values.yaml

# 命名空间（release 所在命名空间，通常即部署目标）
namespace: otpmask

# 协议签名密钥与远程证明令牌（D-1：无默认值，必须显式提供——防已知密钥一键安装）
secret:
  sigKey: "" # 必填（32 字节 hex）；或 create: false 引用既有 Secret
  attestToken: "" # 必填；或 create: false 引用既有 Secret
  create: true # false 时引用既有 secret（名称见 secret.existingName）

images:
  registry: ""
  pullPolicy: IfNotPresent
  tag: latest
  embeddingService: otpmask/embedding-service
  teeInferService: otpmask/tee-infer-service
  envoyGateway: otpmask/envoy-gateway
  cryptopsvc: otpmask/cryptopsvc

# cryptop sidecar（§12.1：与 Envoy 同 Pod，loopback 19097；插件密码唯一 HTTP 面）
cryptop:
  enabled: true
  port: 19097
  profile: intl # intl | sm-software | sm-module（须与插件 crypto_profile 一致）
  maskPRG: hmac-sha256 # hmac-sha256 | sm4 | bridge
  # CRYPTO_STATIC_KEYS 原文（JSON：KeyRef→hex；R-16 长度随 profile：intl 32B/sm 16B）。
  # ⚠️ 下列为开发演示值；生产经 -f 覆盖或改由既有 Secret（见 cryptop.existingSecret）。
  staticKeysJSON: |
    {
      "session/sig/v1": "3031323334353637383961626364656630313233343536373839616263646566",
      "session/hmac/v1": "3031323334353637383961626364656630313233343536373839616263646566"
    }
  existingSecret: "" # 非空时改从该 Secret 的 static-keys.json 键读取（不再用 staticKeysJSON）
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }

# 网关（Envoy + otpmask wasm 插件）
envoy:
  replicas: 2
  nodePort: 30000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 1000m, memory: 512Mi }
  # P2-1 流式重试（Envoy 层）：
  # 默认关闭（numRetries=0），与现有行为完全一致；
  # 开启后仅在响应头返回前重试（连接失败/5xx/reset）。
  streamRetry:
    enabled: false      # 总开关；false 时 numRetries 强制为 0
    numRetries: 0       # 最大重试次数（0=关闭）
    retryOn: "connect-failure,refused-stream,502,503,504,reset"
    budgetPercent: 10   # 重试预算百分比（防重试风暴）
  # 异常点检测（与重试配合）：
  # 失败端点被临时摘除后，重试自动选健康端点。
  outlierDetection:
    enabled: true
    consecutive5xx: 5
    baseEjectionTime: 30s
    maxEjectionPercent: 50

# 文本向量服务
embedding:
  replicas: 2
  port: 18080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# TEE 密态推理服务
teeInfer:
  replicas: 2
  port: 19090
  engineUrl: "" # 非空时经 vLLM 适配器远程推理（M12 对接层），如 http://vllm-adapter:19190
  # 威胁模型 GAP-01/GAP-05：本 Chart 默认 mock 飞地、无管理令牌，属开发/演示形态，
  # 故 devMode 默认 true（透传 -dev-mode）。生产必须设 devMode=false，并提供真 TDX 飞地
  # 与管理令牌，否则 tee-infer 启动守卫会拒绝启动（fail-closed）。
  # 注：本 Chart 暂未模板化 -enclave/-admin-token，生产启用前需扩展（见部署指南）。
  devMode: true
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 1000m, memory: 512Mi }

# 水平扩缩容（autoscaling/v2，需 metrics-server）
hpa:
  enabled: true
  embedding: { minReplicas: 1, maxReplicas: 5, cpuUtilization: 60 }
  teeInfer: { minReplicas: 1, maxReplicas: 4, cpuUtilization: 70 }
  scaleDownStabilizationSeconds: 300

# Pod 干扰预算
pdb:
  enabled: true
  minAvailable: 1

# Prometheus 抓取注解（应用 /metrics）
metricsAnnotations: true

# P1-2：全链路 tracing（D-1/D-3/D-8）
# 默认关闭（C-4 安全默认；关闭=现网零变化）。
# 开启后 Envoy 原生 OTel tracer 生效，span 100% 入 Collector，
# 实际采样由 Collector tail_sampling 执行（L1=1% / L2=错误全采 / L3=动态）。
tracing:
  enabled: false
  # Collector 地址（单实例：otel-collector:4317；HA：转发层 loadbalancingexporter）
  collectorHost: otel-collector
  collectorPort: 4317
