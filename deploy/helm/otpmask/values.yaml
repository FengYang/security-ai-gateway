# otpmask Helm Chart 默认值（与 deploy/k8s kustomize 清单语义一致）
# 覆盖方式：helm install otpmask ./deploy/helm/otpmask -f my-values.yaml

# 命名空间（release 所在命名空间，通常即部署目标）
namespace: otpmask

# 协议签名密钥与远程证明令牌（D-1：无默认值，必须显式提供——防已知密钥一键安装）
secret:
  sigKey: "" # 必填（32 字节 hex）；或 create: false 引用既有 Secret
  attestToken: "" # 必填；或 create: false 引用既有 Secret
  create: true # false 时引用既有 secret（名称见 secret.existingName）

images:
  registry: ""
  pullPolicy: IfNotPresent
  tag: latest
  embeddingService: otpmask/embedding-service
  teeInferService: otpmask/tee-infer-service
  envoyGateway: otpmask/envoy-gateway
  cryptopsvc: otpmask/cryptopsvc

# cryptop sidecar（§12.1：与 Envoy 同 Pod，loopback 19097；插件密码唯一 HTTP 面）
cryptop:
  enabled: true
  port: 19097
  profile: intl # intl | sm-software | sm-module（须与插件 crypto_profile 一致）
  maskPRG: hmac-sha256 # hmac-sha256 | sm4 | bridge
  # CRYPTO_STATIC_KEYS 原文（JSON：KeyRef→hex；R-16 长度随 profile：intl 32B/sm 16B）。
  # ⚠️ 下列为开发演示值；生产经 -f 覆盖或改由既有 Secret（见 cryptop.existingSecret）。
  staticKeysJSON: |
    {
      "session/sig/v1": "3031323334353637383961626364656630313233343536373839616263646566",
      "session/hmac/v1": "3031323334353637383961626364656630313233343536373839616263646566"
    }
  existingSecret: "" # 非空时改从该 Secret 的 static-keys.json 键读取（不再用 staticKeysJSON）
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }

# 网关（Envoy + otpmask wasm 插件）
envoy:
  replicas: 2
  nodePort: 30000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 1000m, memory: 512Mi }
  # P2-1 流式重试（Envoy 层）：
  # 默认关闭（numRetries=0），与现有行为完全一致；
  # 开启后仅在响应头返回前重试（连接失败/5xx/reset）。
  streamRetry:
    enabled: false      # 总开关；false 时 numRetries 强制为 0
    numRetries: 0       # 最大重试次数（0=关闭）
    retryOn: "connect-failure,refused-stream,502,503,504,reset"
    budgetPercent: 10   # 重试预算百分比（防重试风暴）
  # 异常点检测（与重试配合）：
  # 失败端点被临时摘除后，重试自动选健康端点。
  outlierDetection:
    enabled: true
    consecutive5xx: 5
    baseEjectionTime: 30s
    maxEjectionPercent: 50

# 文本向量服务
embedding:
  replicas: 2
  port: 18080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# TEE 密态推理服务
teeInfer:
  replicas: 2
  port: 19090
  engineUrl: "" # 非空时经 vLLM 适配器远程推理（M12 对接层），如 http://vllm-adapter:19190
  # 威胁模型 GAP-01/GAP-05：本 Chart 默认 mock 飞地、无管理令牌，属开发/演示形态，
  # 故 devMode 默认 true（透传 -dev-mode）。生产必须设 devMode=false，并提供真 TDX 飞地
  # 与管理令牌，否则 tee-infer 启动守卫会拒绝启动（fail-closed）。
  # 注：本 Chart 暂未模板化 -enclave/-admin-token，生产启用前需扩展（见部署指南）。
  devMode: true
  # 【P1-7 T0 · A4-13】内存上调 512Mi → 1–2 Gi：
  # 审计留痕启用 WORM 持久化（persistence.enabled）后，冷启动需扫描事件文件建立
  # **偏移量索引**、归档与区间检索需**文件区间扫描排序缓冲**，原 512Mi 上限不足
  # （依据本体 §10.2 A3-27 压测复核结论）。
  # ⚠️ 当前取区间**下限** 1Gi（requests 由 128Mi 同步上调至 512Mi）——A4-13 要求
  # 「以压测结论为准并登记实测值」，而 T11 性能基线尚未实测；待 T11 压测后回填实测值，
  # 若实测不足则上调至 2Gi（上限）。
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

# P1-7 T0：审计 WORM 持久化（D-14 单写者形态 / D-17 落盘强度）。
# ⚠️ 准入③：本段默认值（尤其 storageClass / size / 单写者）须与运维确认后方可上生产。
persistence:
  enabled: true                 # 启用 -audit-file/-audit-anchor + PVC（D-14 默认生产形态）
  size: 20Gi                    # 归档前 WORM 事件文件容量（按留存期与日量估算）
  storageClass: ""              # 空 = 集群默认 StorageClass（须由运维拍板 StorageClass）
  accessMode: ReadWriteOnce     # RWO：单写者单副本（D-14）
  mountPath: /var/lib/otpmask/audit
  auditFile: /var/lib/otpmask/audit/audit.jsonl
  auditAnchor: /var/lib/otpmask/audit/anchor.jsonl
  fsync: batch                  # batch（每 1000 条或每 1 秒）| per_event（合规档，D-17）

# 水平扩缩容（autoscaling/v2，需 metrics-server）
hpa:
  enabled: true
  embedding: { minReplicas: 1, maxReplicas: 5, cpuUtilization: 60 }
  teeInfer: { minReplicas: 1, maxReplicas: 4, cpuUtilization: 70 }
  scaleDownStabilizationSeconds: 300

# Pod 干扰预算
pdb:
  enabled: true
  minAvailable: 1

# Prometheus 抓取注解（应用 /metrics）
metricsAnnotations: true

# P1-2：全链路 tracing（D-1/D-3/D-8）
# 默认关闭（C-4 安全默认；关闭=现网零变化）。
# 开启后 Envoy 原生 OTel tracer 生效，span 100% 入 Collector，
# 实际采样由 Collector tail_sampling 执行（L1=1% / L2=错误全采 / L3=动态）。
tracing:
  enabled: false
  # Collector 地址（单实例：otel-collector:4317；HA：转发层 loadbalancingexporter）
  collectorHost: otel-collector
  collectorPort: 4317

# P1-5 S3-c：TLCP 国密前置（§6.6；沿用 P0-4 §12.4 双层架构）
# 默认关闭（现网零变化：网关仍走标准 TLS 入口）。启用后 TLCP 终止于前置 Tongsuo 网关，
# 内层仍标准 TLS1.3 → Higress/Envoy。
tlcp:
  enabled: false            # true 时启用国密前置（Tongsuo 网关，TLCP 终止）
  host: ""                  # 前置网关地址（供验证/文档引用；属前置层，非本 Chart 内嵌）
  port: 443
  # 证书（make tlcp-certgen-prod 产物；生产有效期 ≤1 年，私钥须托管、禁止入库，§6.6）
  signCertSecret: ""        # sign.crt/sign.key 所在 Secret
  encCertSecret: ""         # enc.crt/enc.key 所在 Secret
  caSecret: ""              # ca.crt 所在 Secret
  # 真实 IP/协议透传（B-12.4-1；不透传则限流/审计按网关 IP 计，风险 R-13）
  passRealIP: true
  # 灰度：按域名/租户灰度；回滚 = 切回标准 TLS 入口（DNS/前置网关配置）
  canary:
    enabled: false
    byHost: ""              # 灰度域名（逗号分隔）
    byTenant: ""            # 灰度租户（逗号分隔）
  # SM2 双向认证（强合规租户，§6.6.1/G-7 三级身份鉴别）
  mutualTLS:
    enabled: false
    clientCASecret: ""      # 客户端 CA（引用名）
