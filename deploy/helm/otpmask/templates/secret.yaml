# 协议签名密钥 K_sig 与远程证明令牌。
# 生产：create: false 并预先创建同名 Secret（Vault/KMS 注入），或覆盖 sigKey/attestToken。
apiVersion: v1
kind: Secret
metadata:
  name: otpmask-keys
  namespace: {{ include "otpmask.namespace" . }}
  labels:
    {{- include "otpmask.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.secret.create }}
stringData:
  sig-key: {{ .Values.secret.sigKey | quote }}
  attest-token: {{ .Values.secret.attestToken | quote }}
{{- end }}
