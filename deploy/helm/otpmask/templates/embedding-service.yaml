# embedding-service：文本 → token → 向量（明文；可信区域随场景，见《GA-产品场景与可信区域矩阵》）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: {{ include "otpmask.namespace" . }}
  labels:
    app: embedding-service
    {{- include "otpmask.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.embedding.replicas }}
  selector:
    matchLabels:
      app: embedding-service
  template:
    metadata:
      labels:
        app: embedding-service
      annotations:
        {{- if .Values.metricsAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.embedding.port | quote }}
        {{- end }}
    spec:
      containers:
      - name: embedding-service
        image: {{ printf "%s%s:%s" .Values.images.registry .Values.images.embeddingService .Values.images.tag }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        # tiktoken-go 需要可写的词表缓存目录（P0b 实测：readOnlyRootFilesystem 下默认
        # /tmp/data-gym-cache 创建失败 → init panic）。缓存指向 emptyDir，保持只读根文件系统。
        env:
        - name: TIKTOKEN_CACHE_DIR
          value: /tmp/tiktoken
        ports:
        - containerPort: {{ .Values.embedding.port }}
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: {{ .Values.embedding.resources.requests.cpu }}
            memory: {{ .Values.embedding.resources.requests.memory }}
          limits:
            cpu: {{ .Values.embedding.resources.limits.cpu }}
            memory: {{ .Values.embedding.resources.limits.memory }}
        readinessProbe:
          httpGet:
            path: /metrics
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /metrics
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tiktoken-cache
          mountPath: /tmp
      volumes:
      - name: tiktoken-cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  namespace: {{ include "otpmask.namespace" . }}
  labels:
    app: embedding-service
spec:
  selector:
    app: embedding-service
  ports:
  - name: http
    port: {{ .Values.embedding.port }}
    targetPort: http
