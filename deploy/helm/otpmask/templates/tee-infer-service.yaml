# tee-infer-service：TEE 密态推理（MVP 模拟飞地；生产迁移 TDX/SGX）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tee-infer-service
  namespace: {{ include "otpmask.namespace" . }}
  labels:
    app: tee-infer-service
    {{- include "otpmask.labels" . | nindent 4 }}
spec:
  # P1-7 T0（D-14）：启用审计持久化（persistence.enabled）时为**单写者形态**——
  # replicas=1 + Recreate（Deployment 无法表达 StatefulSet 的 OnDelete；Recreate
  # 等价于「先停旧 Pod 再起新 Pod」，同样杜绝滚动更新双写窗口）。未启用时沿用
  # teeInfer.replicas（多副本 + HPA）。
  replicas: {{ if .Values.persistence.enabled }}1{{ else }}{{ .Values.teeInfer.replicas }}{{ end }}
  {{- if .Values.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: tee-infer-service
  template:
    metadata:
      labels:
        app: tee-infer-service
      annotations:
        {{- if .Values.metricsAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.teeInfer.port | quote }}
        {{- end }}
    spec:
      containers:
      - name: tee-infer-service
        image: {{ printf "%s%s:%s" .Values.images.registry .Values.images.teeInferService .Values.images.tag }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        args:
        - "-sig-key"
        - "$(SIG_KEY)"
        - "-attest-token"
        - "$(ATTEST_TOKEN)"
        {{- if .Values.persistence.enabled }}
        # P1-7 T0（D-14/D-17）：审计 WORM 持久化 + 落盘强度档位（单一计数点归属 fileWorm）。
        - "-audit-file"
        - "{{ .Values.persistence.auditFile }}"
        - "-audit-anchor"
        - "{{ .Values.persistence.auditAnchor }}"
        - "-audit-fsync"
        - "{{ .Values.persistence.fsync }}"
        {{- end }}
        {{- if .Values.teeInfer.engineUrl }}
        - "-engine-url"
        - "{{ .Values.teeInfer.engineUrl }}"
        {{- end }}
        {{- if .Values.teeInfer.devMode }}
        # 开发/演示逃生口（GAP-01/GAP-05）；生产须置 teeInfer.devMode=false 并配置真飞地/管理令牌。
        - "-dev-mode"
        {{- end }}
        env:
        - name: SIG_KEY
          valueFrom:
            secretKeyRef:
              name: otpmask-keys
              key: sig-key
        - name: ATTEST_TOKEN
          valueFrom:
            secretKeyRef:
              name: otpmask-keys
              key: attest-token
        ports:
        - containerPort: {{ .Values.teeInfer.port }}
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: {{ .Values.teeInfer.resources.requests.cpu }}
            memory: {{ .Values.teeInfer.resources.requests.memory }}
          limits:
            cpu: {{ .Values.teeInfer.resources.limits.cpu }}
            memory: {{ .Values.teeInfer.resources.limits.memory }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        # liveness 刻意不联动审核侧车：侧车故障应由 readiness 摘流，
        # 而非重启本容器——重启不修复侧车，且 -seal-file 为空时会使证明会话失效（放大为重启风暴）。
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
        {{- if .Values.persistence.enabled }}
        # P1-7 T0：审计 WORM 事件文件与锚定文件所在持久卷（只追加）。
        volumeMounts:
        - name: audit-data
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
      - name: audit-data
        persistentVolumeClaim:
          claimName: tee-infer-audit-pvc
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: tee-infer-service
  namespace: {{ include "otpmask.namespace" . }}
  labels:
    app: tee-infer-service
spec:
  selector:
    app: tee-infer-service
  ports:
  - name: http
    port: {{ .Values.teeInfer.port }}
    targetPort: http
