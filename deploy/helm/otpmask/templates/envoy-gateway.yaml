# envoy-gateway：Higress Gateway（Envoy 内核）承载 otpmask wasm 插件。
# wasm 插件（7.1MB）超 ConfigMap 1MiB 限制，随镜像打包（images.envoyGateway）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: {{ include "otpmask.namespace" . }}
  labels:
    app: envoy-gateway
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: 9901
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address:
            protocol: TCP
            address: 0.0.0.0
            port_value: 10000
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              scheme_header_transformation:
                scheme_to_overwrite: https
              stat_prefix: ingress_http
              # P1-2：全链路 tracing（D-1，Envoy 原生 OTel tracer）。
              # 由 .Values.tracing.enabled 控制（默认 false，关闭=现网零变化，C-4）。
              # 根采样 100% 保证全量入 Collector，实际采样由 Collector
              # tail_sampling 执行（D-3，§3.4）。
              {{- if .Values.tracing.enabled }}
              tracing:
                provider:
                  name: envoy.tracers.opentelemetry
                  typed_config:
                    "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                    grpc_service:
                      envoy_grpc:
                        cluster_name: otel-collector
                    service_name: envoy-gateway
                random_sampling:
                  value: 100
                overall_sampling:
                  value: 100
                client_sampling:
                  value: 100
                # 实测修正（2026-10-08，Envoy 1.27.7）：HCM tracing 的 custom_tags 为
                # repeated CustomTag（元素字段 `tag`，取值器 request_header 等）；
                # tenant.id 用 request_header x-tenant-id（Wasm 当前未实现 SetProperty）。
                custom_tags:
                  - tag: request.id
                    request_header:
                      name: x-request-id
                  - tag: tenant.id
                    request_header:
                      name: x-tenant-id
              {{- end }}
              route_config:
                name: local_route
                virtual_hosts:
                - name: local_service
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/infer"
                    route:
                      cluster: tee-infer
                      # P2-1 流式重试（Envoy 层，方案 §6.6 V3）
                      # 默认关闭（num_retries=0），与现有行为完全一致；
                      # 开启后仅在响应头返回前重试，流式中途断流不重试。
                      {{- $retry := .Values.envoy.streamRetry }}
                      {{- if and $retry.enabled (gt $retry.numRetries 0) }}
                      retry_policy:
                        num_retries: {{ $retry.numRetries }}
                        retry_on: "{{ $retry.retryOn }}"
                        retry_budget:
                          budget_percent:
                            value: {{ $retry.budgetPercent }}.0
                          min_retry_concurrency: 1
                      {{- end }}
              http_filters:
              - name: envoy.filters.http.buffer
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                  max_request_bytes: 16777216
              - name: otpmask
                typed_config:
                  "@type": type.googleapis.com/udpa.type.v1.TypedStruct
                  type_url: type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                  value:
                    config:
                      name: otpmask
                      vm_config:
                        runtime: envoy.wasm.runtime.v8
                        code:
                          local:
                            filename: /etc/envoy/main.wasm
                      configuration:
                        "@type": "type.googleapis.com/google.protobuf.StringValue"
                        value: |
                          {
                            "mask_modulus": 4294967296,
                            "model": "mock",
                            "embedding_service": "embedding_service",
                            "embedding_port": {{ .Values.embedding.port }},
                            "tee_service": "tee_infer_service",
                            "tee_port": {{ .Values.teeInfer.port }},
                            "sig_key": "{{ .Values.secret.sigKey }}",
                            "attest_token": "{{ .Values.secret.attestToken }}",
                            "crypto_service": "cryptop-svc.dns",
                            "crypto_service_port": {{ .Values.cryptop.port }},
                            "crypto_profile": "{{ .Values.cryptop.profile }}",
                            "mask_prg": "{{ .Values.cryptop.maskPRG }}"
                          }
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: tee-infer
        connect_timeout: 30s
        # P2f：Envoy 承担主动健康检查（方案 §6.3.10，裁决 A：插件侧仅被动 EWMA，
        # 主动探测由 Envoy 完成；插件 routeengine.HealthChecker 保留纯逻辑库＋单测，不接线调度）。
        # 探测路径必须用 /healthz/live（纯进程存活，恒 200）；**切勿改为 /healthz**——它带
        # readiness 语义，requireAttest 且无有效证明会话时返回 503，会把唯一 TEE 端点判为不健康
        # 并在空闲期摘除，导致连建立会话的握手都打不进 → 全量 503 事故（见 tee-infer-service handleHealthz）。
        health_checks:
        - timeout: 3s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: /healthz/live
        # P2-1 流式重试配套：异常点检测（outlier detection）
        {{- $od := .Values.envoy.outlierDetection }}
        {{- if $od.enabled }}
        outlier_detection:
          consecutive_5xx: {{ $od.consecutive5xx }}
          base_ejection_time: {{ $od.baseEjectionTime }}
          max_ejection_percent: {{ $od.maxEjectionPercent }}
        {{- end }}
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: tee-infer
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: tee-infer-service
                    port_value: {{ .Values.teeInfer.port }}
      - name: "outbound|{{ .Values.embedding.port }}||embedding_service.dns"
        connect_timeout: 5s
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: "outbound|{{ .Values.embedding.port }}||embedding_service.dns"
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: embedding-service
                    port_value: {{ .Values.embedding.port }}
      - name: "outbound|{{ .Values.teeInfer.port }}||tee_infer_service.dns"
        connect_timeout: 5s
        # P2f：同 tee-infer——本簇为插件自持派发（HttpCall→FQDNCluster）所用端点簇，
        # 主动健康检查同样由 Envoy 承担，探测路径必须为 /healthz/live（原因见上）。
        health_checks:
        - timeout: 3s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: /healthz/live
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: "outbound|{{ .Values.teeInfer.port }}||tee_infer_service.dns"
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: tee-infer-service
                    port_value: {{ .Values.teeInfer.port }}
      {{- if .Values.cryptop.enabled }}
      # cryptop sidecar：STATIC 直连 127.0.0.1（明文不出 Pod，R-20/C-6）。
      # 簇名与插件 wrapper.FQDNCluster 拼装口径一致：outbound|<port>||<fqdn>。
      - name: "outbound|{{ .Values.cryptop.port }}||cryptop-svc.dns"
        connect_timeout: 5s
        type: STATIC
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: "outbound|{{ .Values.cryptop.port }}||cryptop-svc.dns"
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: {{ .Values.cryptop.port }}
      {{- end }}
      {{- if .Values.tracing.enabled }}
      # P1-2：OTel Collector 集群（tracer 出口，D-1）。
      - name: otel-collector
        connect_timeout: 5s
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        # 实测修正（2026-10-08，Envoy 1.27.7）：http2_protocol_options 已废弃，改用
        # typed_extension_protocol_options + HttpProtocolOptions.explicit_http_config。
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: otel-collector
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: {{ .Values.tracing.collectorHost }}
                    port_value: {{ .Values.tracing.collectorPort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-gateway
  namespace: {{ include "otpmask.namespace" . }}
  labels:
    app: envoy-gateway
    {{- include "otpmask.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.envoy.replicas }}
  selector:
    matchLabels:
      app: envoy-gateway
  template:
    metadata:
      labels:
        app: envoy-gateway
    spec:
      containers:
      - name: envoy
        image: {{ printf "%s%s:%s" .Values.images.registry .Values.images.envoyGateway .Values.images.tag }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        args:
        - "-c"
        - "/etc/envoy/envoy.yaml"
        - "--component-log-level"
        - "wasm:debug"
        ports:
        - containerPort: 10000
          name: http
          protocol: TCP
        - containerPort: 9901
          name: admin
          protocol: TCP
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy/envoy.yaml
          subPath: envoy.yaml
          readOnly: true
        resources:
          requests:
            cpu: {{ .Values.envoy.resources.requests.cpu }}
            memory: {{ .Values.envoy.resources.requests.memory }}
          limits:
            cpu: {{ .Values.envoy.resources.limits.cpu }}
            memory: {{ .Values.envoy.resources.limits.memory }}
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      {{- if .Values.cryptop.enabled }}
      - name: cryptopsvc
        image: {{ printf "%s%s:%s" .Values.images.registry .Values.images.cryptopsvc .Values.images.tag }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        args:
        - "-listen"
        - "127.0.0.1:{{ .Values.cryptop.port }}"
        - "-profile"
        - "{{ .Values.cryptop.profile }}"
        env:
        - name: CRYPTO_STATIC_KEYS
          {{- if .Values.cryptop.existingSecret }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.cryptop.existingSecret }}
              key: static-keys.json
          {{- else }}
          value: |
            {{- .Values.cryptop.staticKeysJSON | nindent 12 }}
          {{- end }}
        resources:
          requests:
            cpu: {{ .Values.cryptop.resources.requests.cpu }}
            memory: {{ .Values.cryptop.resources.requests.memory }}
          limits:
            cpu: {{ .Values.cryptop.resources.limits.cpu }}
            memory: {{ .Values.cryptop.resources.limits.memory }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
      {{- end }}
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-gateway
  namespace: {{ include "otpmask.namespace" . }}
  labels:
    app: envoy-gateway
spec:
  type: NodePort
  selector:
    app: envoy-gateway
  ports:
  - name: http
    port: 10000
    targetPort: http
    nodePort: {{ .Values.envoy.nodePort }}
