# envoy-gateway：Higress Gateway（Envoy 内核）承载 otpmask wasm 插件。
# wasm 插件（7.1MB）超 ConfigMap 1MiB 限制，随镜像打包（images.envoyGateway）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: {{ include "otpmask.namespace" . }}
  labels:
    app: envoy-gateway
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: 9901
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address:
            protocol: TCP
            address: 0.0.0.0
            port_value: 10000
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              scheme_header_transformation:
                scheme_to_overwrite: https
              stat_prefix: ingress_http
              route_config:
                name: local_route
                virtual_hosts:
                - name: local_service
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/infer"
                    route:
                      cluster: tee-infer
              http_filters:
              - name: envoy.filters.http.buffer
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                  max_request_bytes: 16777216
              - name: otpmask
                typed_config:
                  "@type": type.googleapis.com/udpa.type.v1.TypedStruct
                  type_url: type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                  value:
                    config:
                      name: otpmask
                      vm_config:
                        runtime: envoy.wasm.runtime.v8
                        code:
                          local:
                            filename: /etc/envoy/main.wasm
                      configuration:
                        "@type": "type.googleapis.com/google.protobuf.StringValue"
                        value: |
                          {
                            "mask_modulus": 4294967296,
                            "model": "mock",
                            "embedding_service": "embedding_service",
                            "embedding_port": {{ .Values.embedding.port }},
                            "tee_service": "tee_infer_service",
                            "tee_port": {{ .Values.teeInfer.port }},
                            "sig_key": "{{ .Values.secret.sigKey }}",
                            "attest_token": "{{ .Values.secret.attestToken }}"
                          }
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: tee-infer
        connect_timeout: 30s
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: tee-infer
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: tee-infer-service
                    port_value: {{ .Values.teeInfer.port }}
      - name: "outbound|{{ .Values.embedding.port }}||embedding_service.dns"
        connect_timeout: 5s
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: "outbound|{{ .Values.embedding.port }}||embedding_service.dns"
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: embedding-service
                    port_value: {{ .Values.embedding.port }}
      - name: "outbound|{{ .Values.teeInfer.port }}||tee_infer_service.dns"
        connect_timeout: 5s
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: "outbound|{{ .Values.teeInfer.port }}||tee_infer_service.dns"
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: tee-infer-service
                    port_value: {{ .Values.teeInfer.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-gateway
  namespace: {{ include "otpmask.namespace" . }}
  labels:
    app: envoy-gateway
    {{- include "otpmask.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.envoy.replicas }}
  selector:
    matchLabels:
      app: envoy-gateway
  template:
    metadata:
      labels:
        app: envoy-gateway
    spec:
      containers:
      - name: envoy
        image: {{ printf "%s%s:%s" .Values.images.registry .Values.images.envoyGateway .Values.images.tag }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        args:
        - "-c"
        - "/etc/envoy/envoy.yaml"
        - "--component-log-level"
        - "wasm:debug"
        ports:
        - containerPort: 10000
          name: http
          protocol: TCP
        - containerPort: 9901
          name: admin
          protocol: TCP
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy/envoy.yaml
          subPath: envoy.yaml
          readOnly: true
        resources:
          requests:
            cpu: {{ .Values.envoy.resources.requests.cpu }}
            memory: {{ .Values.envoy.resources.requests.memory }}
          limits:
            cpu: {{ .Values.envoy.resources.limits.cpu }}
            memory: {{ .Values.envoy.resources.limits.memory }}
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-gateway
  namespace: {{ include "otpmask.namespace" . }}
  labels:
    app: envoy-gateway
spec:
  type: NodePort
  selector:
    app: envoy-gateway
  ports:
  - name: http
    port: 10000
    targetPort: http
    nodePort: {{ .Values.envoy.nodePort }}
