# 协议签名密钥 K_sig 与远程证明令牌（MVP 演示值，与 docker-compose 一致）。
# 生产：由 TEE 签发注入 / 外部密钥管理（Vault/KMS），严禁明文入库。
#
# jwt-secret：gateway-admin-service 内部服务令牌共享密钥（ADMIN_SVC_JWT_SECRET）。
#   P0b 实测补齐：清单引用 `secretKeyRef: otpmask-keys/jwt-secret`，但本文件此前未提供该键
#   → Pod 报 CreateContainerConfigError（couldn't find key jwt-secret）。缺失时 admin-service
#   自身也会拒绝启动（config.go：密钥为空/<16 字节即 fail-closed）。生产同样须由 KMS/Vault 签发，
#   且必须与控制台侧保持一致。
apiVersion: v1
kind: Secret
metadata:
  name: otpmask-keys
  namespace: otpmask
type: Opaque
stringData:
  sig-key: "3031323334353637383961626364656630313233343536373839616263646566"
  attest-token: "3031323334353637383961626364656630313233343536373839616263646566"
  jwt-secret: "otpmask-dev-jwt-secret-0123456789abcdef"
  # gateway-core 控制面（deploy/k8s/gateway-core.yaml 引用；P0b-1 补齐）：
  #   core-sig-key   → OTP_CORE_SIG_KEY：处方/路由/限流表签名密钥（K_tx/K_rx，≥32 字节 hex）。
  #                    **必须与插件侧 `route_verify_key` 完全一致**，否则插件拉表验签失败（保留旧表）。
  #   core-auth-token→ OTP_CORE_AUTH_TOKEN：控制面静态令牌；为空 = 关闭鉴权（严禁用于集群）。
  #                    **须 ≥32 字符**：同一值经凭据集 `core-channel` 投给插件，而凭据端点对
  #                    `core-channel.token` 有 ≥32 字符校验（minChannelTokenLen）——演示值过短会
  #                    使端点 fail-closed 503、插件永远取不到通道令牌（P0b-1 实测踩到）。
  # 生产同 sig-key：由 KMS/Vault 签发注入，严禁明文入库。
  core-sig-key: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
  core-auth-token: "otpmask-dev-core-auth-token-0123456789abcdef"
