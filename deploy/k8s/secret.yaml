# 协议签名密钥 K_sig 与远程证明令牌（MVP 演示值，与 docker-compose 一致）。
# 生产：由 TEE 签发注入 / 外部密钥管理（Vault/KMS），严禁明文入库。
#
# jwt-secret：gateway-admin-service 内部服务令牌共享密钥（ADMIN_SVC_JWT_SECRET）。
#   P0b 实测补齐：清单引用 `secretKeyRef: otpmask-keys/jwt-secret`，但本文件此前未提供该键
#   → Pod 报 CreateContainerConfigError（couldn't find key jwt-secret）。缺失时 admin-service
#   自身也会拒绝启动（config.go：密钥为空/<16 字节即 fail-closed）。生产同样须由 KMS/Vault 签发，
#   且必须与控制台侧保持一致。
apiVersion: v1
kind: Secret
metadata:
  name: otpmask-keys
  namespace: otpmask
type: Opaque
stringData:
  sig-key: "3031323334353637383961626364656630313233343536373839616263646566"
  attest-token: "3031323334353637383961626364656630313233343536373839616263646566"
  jwt-secret: "otpmask-dev-jwt-secret-0123456789abcdef"
