# envoy-gateway：Higress Gateway（Envoy 内核）承载 otpmask wasm 插件
#
# wasm 插件 7.1MB 超出 ConfigMap 1MiB 限制，随镜像打包（见 Dockerfile.k8s）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: otpmask
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: 9901

    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address:
            protocol: TCP
            address: 0.0.0.0
            port_value: 10000
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              scheme_header_transformation:
                scheme_to_overwrite: https
              stat_prefix: ingress_http
              route_config:
                name: local_route
                virtual_hosts:
                - name: local_service
                  domains: ["*"]
                  cors:
                    # P0a：CORS（生产按需收紧 allow_origin_string_match，如仅企业域名）
                    allow_origin_string_match:
                    - prefix: "*"
                    allow_methods: GET, POST, OPTIONS
                    allow_headers: content-type, authorization, x-tenant-id, x-session-id, x-attest-token
                    expose_headers: content-type
                    max_age: "1728000"
                  routes:
                  - match:
                      prefix: "/infer"
                    route:
                      cluster: tee-infer
                      # P2-1 流式重试（Envoy 层，方案 §6.6 V3）：
                      # 默认 num_retries=0（关闭），与现有行为完全一致；
                      # 开启后仅在响应头返回前重试（连接失败/5xx/reset），
                      # 流式中途断流不重试（HTTP 语义限制）。
                      # 配合 retry_budget 防重试风暴（默认 10% 预算）。
                      retry_policy:
                        num_retries: 0
                        retry_on: "connect-failure,refused-stream,502,503,504,reset"
                        retry_budget:
                          budget_percent:
                            value: 10.0
                          min_retry_concurrency: 1
              http_filters:
              - name: envoy.filters.http.cors
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
              - name: envoy.filters.http.buffer
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                  max_request_bytes: 16777216
              # P0a：IP 黑白名单（RBAC，fail-closed 语义：白名单内放行，其余 403）。
              # 默认 0.0.0.0/0 = 放行全部；生产改为内网/管理网段 CIDR。
              # 位于 wasm 加密链前端，仅按 source IP 决策，不接触密文 body。
              - name: envoy.filters.http.rbac
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                  stat_prefix: rbac_ip
                  rules:
                    action: ALLOW
                    policies:
                      ip_allowlist:
                        permissions:
                        - any: true
                        principals:
                        - remote_ip:
                            address_prefix: 0.0.0.0
                            prefix_len: 0
              # P0a：QPS 限流（Envoy 本地限流，进程内 token bucket，零外部依赖）。
              # 集群级多副本一致限流需 envoy.filters.http.ratelimit + 独立 ratelimit 服务（Redis），
              # 见 GA-AI网关能力补齐方案 §5 P0a 升级路径。超限返回 429。
              - name: envoy.filters.http.local_ratelimit
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                  stat_prefix: http_local_rate_limiter
                  token_bucket:
                    max_tokens: 4000
                    tokens_per_fill: 2000
                    fill_interval: 1s
                  filter_enabled:
                    runtime_key: local_rate_limit_enabled
                    default_value:
                      numerator: 100
                      denominator: HUNDRED
                  filter_enforced:
                    runtime_key: local_rate_limit_enforced
                    default_value:
                      numerator: 100
                      denominator: HUNDRED
                  response_headers_to_add:
                  - append: false
                    header:
                      key: x-local-rate-limit
                      value: "true"
              - name: otpmask
                typed_config:
                  "@type": type.googleapis.com/udpa.type.v1.TypedStruct
                  type_url: type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                  value:
                    config:
                      name: otpmask
                      vm_config:
                        runtime: envoy.wasm.runtime.v8
                        code:
                          local:
                            filename: /etc/envoy/main.wasm
                      configuration:
                        "@type": "type.googleapis.com/google.protobuf.StringValue"
                        value: |
                          {
                            "mask_modulus": 4294967296,
                            "model": "mock",
                            "embedding_service": "embedding_service",
                            "embedding_port": 18080,
                            "tee_service": "tee_infer_service",
                            "tee_port": 19090,
                            "sig_key": "3031323334353637383961626364656630313233343536373839616263646566",
                            "attest_token": "3031323334353637383961626364656630313233343536373839616263646566",
                            "crypto_service": "cryptop-svc.dns",
                            "crypto_service_port": 19097,
                            "crypto_profile": "intl",
                            "mask_prg": "hmac-sha256"
                          }
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: tee-infer
        connect_timeout: 30s
        # P2f：Envoy 承担主动健康检查（方案 §6.3.10，裁决 A：插件侧仅被动 EWMA，
        # 主动探测由 Envoy 完成；插件 routeengine.HealthChecker 保留纯逻辑库＋单测，不接线调度）。
        # 探测路径必须用 /healthz/live（纯进程存活，恒 200）；**切勿改为 /healthz**——它带
        # readiness 语义，requireAttest 且无有效证明会话时返回 503，会把唯一 TEE 端点判为不健康
        # 并在空闲期摘除，导致连建立会话的握手都打不进 → 全量 503 事故（见 tee-infer-service handleHealthz）。
        health_checks:
        - timeout: 3s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: /healthz/live
        # P2-1 流式重试配套：异常点检测（outlier detection）
        # 与 retry_policy 配合——失败端点被临时摘除后，重试会选健康端点。
        # 默认宽松（5 次 5xx 才摘除，base_ejection_time=30s，max_ejection=50%），
        # 单副本场景 max_ejection=50% 确保至少保留一个端点（否则全 503）。
        outlier_detection:
          consecutive_5xx: 5
          base_ejection_time: 30s
          max_ejection_percent: 50
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: tee-infer
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: tee-infer-service
                    port_value: 19090
      - name: "outbound|18080||embedding_service.dns"
        connect_timeout: 5s
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: "outbound|18080||embedding_service.dns"
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: embedding-service
                    port_value: 18080
      - name: "outbound|19090||tee_infer_service.dns"
        connect_timeout: 5s
        # P2f：同 tee-infer——本簇为插件自持派发（HttpCall→FQDNCluster）所用端点簇，
        # 主动健康检查同样由 Envoy 承担，探测路径必须为 /healthz/live（原因见上）。
        health_checks:
        - timeout: 3s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: /healthz/live
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: "outbound|19090||tee_infer_service.dns"
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: tee-infer-service
                    port_value: 19090
      # cryptop sidecar：与 Envoy 同 Pod，STATIC 直连 127.0.0.1:19097（明文不出 Pod，
      # R-20/C-6）。簇名须与插件 wrapper.FQDNCluster 拼装口径一致：outbound|<port>||<fqdn>。
      - name: "outbound|19097||cryptop-svc.dns"
        connect_timeout: 5s
        type: STATIC
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: "outbound|19097||cryptop-svc.dns"
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 19097
---
# cryptopsvc 静态测试密钥（与插件 KeyRef 命名一致）。
# ⚠️ 下列为开发演示值（intl 32B hex）；生产由部署流水线替换为 K8s Secret 注入。
apiVersion: v1
kind: Secret
metadata:
  name: cryptop-static-keys
  namespace: otpmask
type: Opaque
stringData:
  static-keys.json: |
    {
      "session/sig/v1": "3031323334353637383961626364656630313233343536373839616263646566",
      "session/hmac/v1": "3031323334353637383961626364656630313233343536373839616263646566"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-gateway
  namespace: otpmask
  labels:
    app: envoy-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: envoy-gateway
  template:
    metadata:
      labels:
        app: envoy-gateway
    spec:
      containers:
      - name: envoy
        image: otpmask/envoy-gateway:latest
        imagePullPolicy: IfNotPresent
        args:
        - "-c"
        - "/etc/envoy/envoy.yaml"
        - "--component-log-level"
        - "wasm:debug"
        ports:
        - containerPort: 10000
          name: http
          protocol: TCP
        - containerPort: 9901
          name: admin
          protocol: TCP
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy/envoy.yaml
          subPath: envoy.yaml
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: false # envoy 需绑定特权端口场景可放宽；生产收敛
          capabilities:
            drop: ["ALL"]
      # cryptopsvc sidecar（§12.1：与 Envoy 同 Pod，loopback；R-2/R-14/R-16/R-20/R-21
      # 启动期校验失败即 exit1）。
      - name: cryptopsvc
        image: otpmask/cryptopsvc:latest
        imagePullPolicy: IfNotPresent
        args:
        - "-listen"
        - "127.0.0.1:19097"
        - "-profile"
        - "intl"
        env:
        - name: CRYPTO_STATIC_KEYS
          valueFrom:
            secretKeyRef:
              name: cryptop-static-keys
              key: static-keys.json
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-gateway
  namespace: otpmask
spec:
  type: NodePort
  selector:
    app: envoy-gateway
  ports:
  - name: http
    port: 10000
    targetPort: http
    nodePort: 30000
