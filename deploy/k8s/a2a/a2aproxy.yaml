apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2aproxy
  labels:
    app: a2aproxy
    app.kubernetes.io/part-of: a2a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a2aproxy
  template:
    metadata:
      labels:
        app: a2aproxy
        app.kubernetes.io/part-of: a2a
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: a2aproxy
          image: docker.io/security-ai-gateway/a2aproxy:lan-20261021
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
          env:
            - name: A2A_PROXY_ADDR
              value: ":8086"
            - name: A2A_PUBLIC_MODE
              value: "path"
            - name: A2A_GATEWAY_PUBLIC_BASE
              value: "http://192.168.31.73:30086"
            - name: A2A_REGISTRY_SNAPSHOT_FILE
              value: "/etc/a2a/snapshot.json"
            - name: A2A_ACL_FILE
              value: "/etc/a2a-secret/acl.json"
            - name: A2A_ACL_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: a2a-proxy-secrets
                  key: acl-key
            - name: A2A_AUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  name: a2a-proxy-secrets
                  key: auth-tokens
            - name: A2A_AUDIT_SINK_FILE
              value: "/var/log/a2aproxy/audit.jsonl"
            - name: A2A_CONTENT_SAFETY_URL
              value: "http://a2a-guardrail.otpmask.svc.cluster.local:8087/v1/content/check"
            - name: A2A_CONTENT_SAFETY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: a2a-proxy-secrets
                  key: guardrail-token
            - name: A2A_CONTENT_SAFETY_TIMEOUT
              value: "2s"
            - name: A2A_CONTENT_SAFETY_FAIL_CLOSED
              value: "true"
            - name: TRACING_ENABLED
              value: "true"
            - name: TRACING_OTLP_ENDPOINT
              value: "otel-collector.otpmask.svc.cluster.local:4317"
            - name: TRACING_TLS_INSECURE
              value: "true"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: a2a-snapshot
              mountPath: /etc/a2a
              readOnly: true
            - name: a2a-secrets
              mountPath: /etc/a2a-secret
              readOnly: true
            - name: audit
              mountPath: /var/log/a2aproxy
      volumes:
        - name: a2a-snapshot
          configMap:
            name: a2a-snapshot
        - name: a2a-secrets
          secret:
            secretName: a2a-proxy-secrets
            defaultMode: 0440
        - name: audit
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: a2aproxy
  labels:
    app: a2aproxy
    app.kubernetes.io/part-of: a2a
spec:
  type: NodePort
  selector:
    app: a2aproxy
  ports:
    - name: http
      port: 8086
      targetPort: http
      nodePort: 30086
