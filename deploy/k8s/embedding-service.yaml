# embedding-service：文本 → token → 向量（明文，企业内部可信域）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: otpmask
  labels:
    app: embedding-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: embedding-service
  template:
    metadata:
      labels:
        app: embedding-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "18080"
    spec:
      containers:
      - name: embedding-service
        image: otpmask/embedding-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 18080
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /metrics
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /metrics
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  namespace: otpmask
spec:
  selector:
    app: embedding-service
  ports:
  - name: http
    port: 18080
    targetPort: http
