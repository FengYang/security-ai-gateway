# tee-infer-service：TEE 密态推理（MVP 模拟飞地，生产迁移 TDX/SGX）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tee-infer-service
  namespace: otpmask
  labels:
    app: tee-infer-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tee-infer-service
  template:
    metadata:
      labels:
        app: tee-infer-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "19090"
    spec:
      containers:
      - name: tee-infer-service
        image: otpmask/tee-infer-service:latest
        imagePullPolicy: IfNotPresent
        args:
        - "-sig-key"
        - "$(SIG_KEY)"
        - "-attest-token"
        - "$(ATTEST_TOKEN)"
        env:
        - name: SIG_KEY
          valueFrom:
            secretKeyRef:
              name: otpmask-keys
              key: sig-key
        - name: ATTEST_TOKEN
          valueFrom:
            secretKeyRef:
              name: otpmask-keys
              key: attest-token
        ports:
        - containerPort: 19090
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: tee-infer-service
  namespace: otpmask
spec:
  selector:
    app: tee-infer-service
  ports:
  - name: http
    port: 19090
    targetPort: http
