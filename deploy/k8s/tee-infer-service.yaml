# tee-infer-service：TEE 密态推理（MVP 模拟飞地，生产迁移 TDX/SGX）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tee-infer-service
  namespace: otpmask
  labels:
    app: tee-infer-service
spec:
  # OG-11：单节点 K3s（Higress 已占部分资源，现场长期 1 副本运行）；多副本随扩容恢复。
  replicas: 1
  selector:
    matchLabels:
      app: tee-infer-service
  template:
    metadata:
      labels:
        app: tee-infer-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "19090"
    spec:
      containers:
      - name: tee-infer-service
        image: otpmask/tee-infer-service:og11
        imagePullPolicy: IfNotPresent
        args:
        - "-sig-key"
        - "$(SIG_KEY)"
        - "-attest-token"
        - "$(ATTEST_TOKEN)"
        # OG-11：输出侧审查 shadow（L1 词库全量跑、只记不拦），策略随镜像烤入 /app/policy
        - "-output-guard"
        - "shadow"
        - "-output-guard-policy-dir"
        - "/app/policy"
        # P5/OG-11：Phala C-MaaS 密态大模型（api-key 仅经环境变量，不上命令行）
        - "-cmaas-url"
        - "$(CMAAS_URL)"
        - "-cmaas-model"
        - "$(CMAAS_MODEL)"
        env:
        - name: SIG_KEY
          valueFrom:
            secretKeyRef:
              name: otpmask-keys
              key: sig-key
        - name: ATTEST_TOKEN
          valueFrom:
            secretKeyRef:
              name: otpmask-keys
              key: attest-token
        - name: CMAAS_URL
          valueFrom:
            secretKeyRef:
              name: otpmask-cmaas
              key: url
        - name: CMAAS_MODEL
          valueFrom:
            secretKeyRef:
              name: otpmask-cmaas
              key: model
        - name: CMAAS_API_KEY
          valueFrom:
            secretKeyRef:
              name: otpmask-cmaas
              key: api-key
        ports:
        - containerPort: 19090
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        # liveness 刻意不联动审核侧车：侧车故障应由 readiness 摘流，
        # 而非重启本容器——重启不修复侧车，且 -seal-file 为空时会使证明会话失效（放大为重启风暴）。
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          # 身份钉死：镜像 USER 65532:65532 仅数字，而 alpine 的 /etc/group 无 65532 条目，
          # 运行时会把未登记数值 gid 回落为 0(root)，故此处显式声明 user/group。
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: tee-infer-service
  namespace: otpmask
spec:
  selector:
    app: tee-infer-service
  ports:
  - name: http
    port: 19090
    targetPort: http
