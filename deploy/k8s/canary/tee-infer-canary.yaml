# tee-infer-service 金丝雀（canary）Deployment 模板（C-7 灰度发布）
#
# 与稳定版共用 Service 选择器（app: tee-infer-service），副本数比例即流量比例：
#   stable replicas=2 + canary replicas=1 → canary 承担约 1/3 推理流量
# 由 scripts/canary-release.py 替换 __TAG__ 后应用。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tee-infer-canary
  namespace: otpmask
  labels:
    app: tee-infer-service
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tee-infer-service
      version: canary
  template:
    metadata:
      labels:
        app: tee-infer-service
        version: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "19090"
    spec:
      containers:
      - name: tee-infer-service
        image: otpmask/tee-infer-service:__TAG__
        imagePullPolicy: IfNotPresent
        args:
        - "-sig-key"
        - "$(SIG_KEY)"
        - "-attest-token"
        - "$(ATTEST_TOKEN)"
        # 开发/演示逃生口（GAP-01/GAP-05）；生产必须移除并改配 -admin-token。
        - "-dev-mode"
        env:
        - name: SIG_KEY
          valueFrom:
            secretKeyRef:
              name: otpmask-keys
              key: sig-key
        - name: ATTEST_TOKEN
          valueFrom:
            secretKeyRef:
              name: otpmask-keys
              key: attest-token
        ports:
        - containerPort: 19090
          name: http
        readinessProbe:
          httpGet:
            path: /attest
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /attest
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
