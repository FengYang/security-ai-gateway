# 【模板 · 禁止直接 apply · 不在 kustomization resources 内】
# P2-4 T-1.10：共享 PG 凭据 Secret 的形态说明（**凭据禁止入库**，故本文件只有占位值）。
#
# 正确做法（任选其一）：
#   1) 离线注入（推荐）：
#        kubectl -n otpmask create secret generic otpmask-shared-pg \
#          --from-literal=security-store-dsn="$(vault kv get -field=dsn secret/otpmask/pg)" \
#          --from-literal=tenant-store-dsn="$(vault kv get -field=tenant-dsn secret/otpmask/pg)"
#   2) External Secrets Operator / CSI Secrets Store 同步（生产推荐）。
#
# DSN 形态（与代码一致）：
#   security-store-dsn  → SECURITY_STORE_PG_DSN：共享库（captcha/login_attempts/mfa/发信限频）
#   tenant-store-dsn    → TENANT_STORE_PG_DSN：tenant store 13 张表
#                         （装配已接通：T-1.2b 落地于 2026-10-26，PG 非空即走共享库、
#                          PG 打开失败 fail-closed 拒启动；**仍须先完成 T-1.6 迁移 + 对账**，
#                          否则门户数据在 PG 中不可见）
#   示例：postgres://<user>:<pass>@pg.otpmask.svc.cluster.local:5432/otpmask?sslmode=require
#         生产必须 sslmode=require/verify-full（禁止 disable），且账号最小权限。
apiVersion: v1
kind: Secret
metadata:
  name: otpmask-shared-pg
  namespace: otpmask
type: Opaque
stringData:
  security-store-dsn: "postgres://REPLACE_USER:REPLACE_PASSWORD@REPLACE_HOST:5432/otpmask?sslmode=require"
  tenant-store-dsn: "postgres://REPLACE_USER:REPLACE_PASSWORD@REPLACE_HOST:5432/otpmask?sslmode=require"
