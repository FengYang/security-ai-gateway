# 【模板 · 禁止直接 apply · 不在 kustomization resources 内】
# P2-4 T-4.3：审计链导出端点的静态 Bearer 令牌（**临时联调口径**，T-2.3 后由集群身份凭证替换）。
#
# 【凭据禁止入库】本文件只给出**形态与占位**，真实令牌由 KMS/Vault 签发并注入：
#   kubectl -n otpmask create secret generic otpmask-audit-export \
#     --from-literal=export-token="$(vault kv get -field=export-token secret/otpmask/audit-export)"
# 或用 External Secrets Operator / CSI Secrets Store 同步（生产推荐）。
#
# 【消费方】deploy/k8s-overlays/trust 的两个 patch：
#   - gateway-core  → GATEWAY_CORE_AUDIT_EXPORT_TOKEN（空 = deny-all，全部 403）
#   - tee-infer     → -audit-export-token（经 env $(AUDIT_EXPORT_TOKEN) 展开，**不出现在 ps 命令行**）
#
# 【轮换】令牌轮换需同步两侧（Secret 更新 + 集群侧 Pod 重启/热加载）；
# T-2.3 落地后本 Secret 将被集群身份凭证（签发/校验/轮换/吊销）替代，届时删除本文件与对应 patch。
apiVersion: v1
kind: Secret
metadata:
  name: otpmask-audit-export
  namespace: otpmask
type: Opaque
stringData:
  # 令牌建议 ≥32 字节随机串（禁止复用其他密钥）。
  export-token: "REPLACE_WITH_EXPORT_TOKEN_MIN_32_BYTES"
