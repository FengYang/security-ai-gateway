# P1-7 T2c（D-20 候选 ii）：审计回灌「极薄签名器」部署清单。
#
# 作用：Fluent Bit 的 HTTP output 无法对最终字节签名、也无法产出 {"reports":[...]} 包裹结构，
#       故在其后接一个只做「整形 + HMAC 签名 + POST」的适配器（< 100 行核心逻辑）。
#       实现：cmd/audit-sign-relay/（Go，纯标准库）；指标：/metrics；健康：/healthz。
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ 状态：**联调形态（独立 Deployment），尚未联调验证，暂不纳入 kustomization**。
#
# 【形态说明 · 与 D-20 的差距，须在联调通过后收敛】
#   · **生产形态**应为 **Fluent Bit Pod 内的 sidecar**，监听 127.0.0.1:9090（本地通道）——
#     D-20 明确要求「签名器与 Fluent Bit 之间为本地通道，不得跨节点明文暴露」。
#     收敛方式：在 `audit-report-pipeline.yaml` 的 Fluent Bit DaemonSet 中增加 sidecar 容器，
#     **并删除本独立 Deployment 与 Service**。
#   · 本清单为**先跑通链路**的独立形态：以 ClusterIP Service 暴露 9090，
#     故 LISTEN_ADDR 取 0.0.0.0:9090（sidecar 形态须改回 127.0.0.1:9090）。
#
# 【未联调 ⇒ 不得上线】：V-13（401/403/429 各 ≥100 次断言）未完成前，
#   本清单不纳入 kustomization，不计入交付。
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: v1
kind: Secret
metadata:
  name: audit-report-token
  namespace: otpmask
  labels:
    app: audit-sign-relay
type: Opaque
stringData:
  # ⚠️ 占位值，部署前必须替换；生产应改用 SealedSecret / 外部密钥管理，**禁止明文入库**。
  # 令牌须与 tee-infer 的 -audit-report-token 一致；**不得回落管理令牌**（A3-11）。
  AUDIT_REPORT_TOKEN: "CHANGE_ME_AUDIT_REPORT_TOKEN"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-sign-relay
  namespace: otpmask
  labels:
    app: audit-sign-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-sign-relay
  template:
    metadata:
      labels:
        app: audit-sign-relay
      annotations:
        # 丢弃率 > 0 即告警（A3-14 精神）：由 Prometheus 抓取 /metrics
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: sign-relay
          image: audit-sign-relay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          env:
            # 独立形态需对外可达；sidecar 形态改回 127.0.0.1:9090（D-20 本地通道要求）。
            - name: LISTEN_ADDR
              value: "0.0.0.0:9090"
            - name: AUDIT_REPORT_URL
              value: "http://tee-infer-service.otpmask.svc.cluster.local:19090/audit/report"
            - name: AUDIT_REPORT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: audit-report-token
                  key: AUDIT_REPORT_TOKEN
            # 5xx/网络失败重试；4xx（整批校验失败）**不重试**，直接丢弃并计数。
            - name: MAX_RETRY
              value: "3"
            - name: BACKOFF_MS
              value: "200"
            - name: UPSTREAM_TIMEOUT_MS
              value: "5000"
          readinessProbe:
            httpGet: { path: /healthz, port: 9090 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 9090 }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }

---
apiVersion: v1
kind: Service
metadata:
  name: audit-sign-relay
  namespace: otpmask
  labels:
    app: audit-sign-relay
spec:
  type: ClusterIP
  selector:
    app: audit-sign-relay
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
