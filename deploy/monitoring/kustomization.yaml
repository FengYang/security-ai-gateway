# 监控栈入口：kubectl apply -k deploy/monitoring
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- prometheus.yaml
- grafana.yaml
- otel-collector.yaml  # P1-2：OTel Collector（tracing 汇聚 + tail_sampling + 脱敏）
- tempo.yaml           # P1-2：Tempo（trace 存储，30d 保留）
- alertmanager.yaml    # P1-3 M12：集中告警路由（安全/严重告警分投值班）
- security-prometheusrule.yaml  # P1-3 M12：安全与可观测告警规则（鉴权/审计链/Redis/Falco/NTP）
- redis-exporter.yaml  # P1-3 M12：限流 fail-open 检测信号（redis_up）
