# Prometheus：抓取 otpmask 命名空间下带 prometheus.io/scrape=true 注解的 Pod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: otpmask
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otpmask-prometheus
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otpmask-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otpmask-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: otpmask
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: otpmask
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      # 外部标签：多集群聚合与告警去重（M12）。
      external_labels:
        cluster: otpmask
    # 告警投递接线（P1-3 等保 §6.7/§10.3，M12）：规则命中 → Alertmanager → 值班系统。
    alerting:
      alertmanagers:
      - static_configs:
        - targets: ["alertmanager.otpmask.svc.cluster.local:9093"]
    # 规则加载说明：本栈为原生 Prometheus Deployment（无 prometheus-operator），
    # 故 PrometheusRule CR（security-prometheusrule.yaml、slo-*.yaml、billing-*.yaml）
    # 需由 operator 渲染；原生环境下按 Prometheus 文本格式转为 ConfigMap 并挂载后启用：
    #   rule_files:
    #   - /etc/prometheus/rules/*.rules.yml
    scrape_configs:
    - job_name: otpmask
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [otpmask]
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: otpmask
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.53.2
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.retention.time=7d"
        ports:
        - containerPort: 9090
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
          readOnly: true
        - name: data
          mountPath: /prometheus
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534 # nobody
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data # C-9：TSDB 持久化（kind 需先装 local-path provisioner）
---
# C-9：Prometheus TSDB 持久卷（生产替换 storageClassName；kind 单节点用 local-path）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: otpmask
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: otpmask
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
    nodePort: 30090
