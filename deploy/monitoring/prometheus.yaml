# Prometheus：抓取 otpmask 命名空间下带 prometheus.io/scrape=true 注解的 Pod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: otpmask
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otpmask-prometheus
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otpmask-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otpmask-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: otpmask
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: otpmask
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      # 外部标签：多集群聚合与告警去重（M12）。
      external_labels:
        cluster: otpmask
    # 告警投递接线（P1-3 等保 §6.7/§10.3，M12）：规则命中 → Alertmanager → 值班系统。
    alerting:
      alertmanagers:
      - static_configs:
        - targets: ["alertmanager.otpmask.svc.cluster.local:9093"]
    # 规则加载（本栈为原生 Prometheus Deployment，无 prometheus-operator）：
    # 规则以原生文本存于 prometheus-rules ConfigMap，挂载到 /etc/prometheus/rules/，
    # 经下方 rule_files glob 加载（P1-2 SLO 告警，AC-01 修复）。
    # PrometheusRule CR（security-/slo-/billing-*.yaml）仅供 Prometheus Operator 环境
    # 显式 apply，本原生栈勿用（apply 会因 CRD 不存在而失败）。
    rule_files:
    - /etc/prometheus/rules/*.rules.yml
    scrape_configs:
    - job_name: otpmask
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [otpmask]
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: app
---
# P1-2：SLO/错误预算告警规则（原生 Prometheus 文本格式，AC-01 修复）。
# 本栈无 prometheus-operator，PrometheusRule CR 无法被渲染，故规则以本 ConfigMap
# 挂载到 /etc/prometheus/rules/，经 prometheus.yml 的 rule_files glob 自动加载。
# Operator 环境的 CR 形式见 slo-prometheusrule.yaml；两边规则内容须保持一致。
# runbook_url 现为相对占位，上线前替换为内部 wiki 绝对 URL。
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: otpmask
  labels:
    app: otpmask
data:
  slo.rules.yml: |
    groups:
      - name: ai-slo.rules
        interval: 30s
        rules:
          # ---- 可用性燃尽（critical）：1h 窗口燃尽率 ≥ 14.4 ----
          - alert: AISLOAvailabilityBurnFast
            expr: |
              (
                1 - (
                  sum(rate(otpmask_inference_requests_total{result="ok"}[1h]))
                  / clamp_min(sum(rate(otpmask_inference_requests_total[1h])), 1)
                )
              ) / 0.001 >= 14.4
            for: 5m
            labels:
              severity: critical
              category: slo
              team: ai-gateway-ops
            annotations:
              summary: "AI 网关可用性错误预算燃尽过快（1h 燃尽率 ≥ 14.4）"
              description: "近 1h 成功率低于 SLO 99.9% 对应的燃尽速率。当前燃尽率 {{ $value | printf \"%.2f\" }}。排查 tee-infer 错误率（otpmask_denies_total）与上游模型可用性。"
              runbook_url: "docs/详细设计/P1/GA-AI网关能力补齐方案--P1--全链路tracing.md"

          # ---- 可用性燃尽（warning）：6h 窗口燃尽率 ≥ 6 ----
          - alert: AISLOAvailabilityBurnSlow
            expr: |
              (
                1 - (
                  sum(rate(otpmask_inference_requests_total{result="ok"}[6h]))
                  / clamp_min(sum(rate(otpmask_inference_requests_total[6h])), 1)
                )
              ) / 0.001 >= 6
            for: 30m
            labels:
              severity: warning
              category: slo
              team: ai-gateway-ops
            annotations:
              summary: "AI 网关可用性错误预算持续消耗（6h 燃尽率 ≥ 6）"
              description: "近 6h 燃尽率 {{ $value | printf \"%.2f\" }}，持续消耗错误预算。核查租户侧错误分布与拒绝原因。"
              runbook_url: "docs/详细设计/P1/GA-AI网关能力补齐方案--P1--全链路tracing.md"

          # ---- 延迟 SLO（warning）：P99 首 token 时延 > 5s ----
          - alert: AISLOTTFTp99Slow
            expr: |
              histogram_quantile(0.99,
                sum(rate(otpmask_ttft_seconds_bucket[30m])) by (le)
              ) > 5
            for: 10m
            labels:
              severity: warning
              category: slo
              team: ai-gateway-ops
            annotations:
              summary: "P99 首 token 时延超过 5s"
              description: "近 30 分钟 P99 TTFT = {{ $value | printf \"%.2f\" }}s，超过延迟 SLO 阈值 5s。排查上游模型排队/缓存命中率下降（otpmask_cache_lookups_total）/网络时延。"
              runbook_url: "docs/详细设计/P1/GA-AI网关能力补齐方案--P1--全链路tracing.md"

          # ---- 拒绝率（warning）：内容/安全拒绝占比 > 5% ----
          - alert: AIGatewayDenyRateHigh
            expr: |
              sum(rate(otpmask_denies_total[10m]))
              / clamp_min(sum(rate(otpmask_inference_requests_total[10m])), 1) > 0.05
            for: 10m
            labels:
              severity: warning
              category: slo
              team: ai-gateway-ops
            annotations:
              summary: "请求拒绝率 > 5%"
              description: "近 10 分钟拒绝率 {{ $value | humanizePercentage }}。按 reason 拆分（otpmask_denies_total）核实：内容安全拦截 / 配额 / 签名 / 重放。"
              runbook_url: "docs/详细设计/P1/GA-AI网关能力补齐方案--P1--全链路tracing.md"

      # ---- P1-6：TTFT 严格性能择优告警（§6.5 / TT2-06；数据面 otpmask_route_* + 控制面 gateway_core_route_ttft_*）----
      - name: ai-ttft.rules
        interval: 30s
        rules:
          # ---- 上报失败率高（warning）：5m 内 reject/ok > 10% ----
          - alert: AITTFTReportRejectHigh
            expr: |
              (
                rate(otpmask_route_ttft_report_reject_total[5m]) or vector(0)
              ) / clamp_min(
                rate(otpmask_route_ttft_report_ok_total[5m]) or vector(0), 0.000001
              ) > 0.1
            for: 5m
            labels:
              severity: warning
              category: ttft
              team: ai-gateway-ops
            annotations:
              summary: "TTFT 上报失败率 > 10%（近 5m）"
              description: "上报 reject 与 ok 速率比 {{ $value | humanizePercentage }} 超阈值。核对控制面可达性（gateway_core service/port）与通道令牌（TT2-06 上线 checklist）。"
              runbook_url: "docs/详细设计/P1/GA-AI网关能力补齐方案--P1--TTFT严格性能择优.md"
          # ---- 回调丢弃（critical）：上报/拉取回调 5m 零执行且延迟策略有流量（对齐 fetch_cb_total 语义）----
          - alert: AITTFTCallbackDropped
            expr: |
              (
                (increase(otpmask_route_ttft_report_cb_total[5m]) or vector(0)) == 0
              )
              and on() (
                (increase(otpmask_route_ttft_stats_fetch_cb_total[5m]) or vector(0)) == 0
              )
              and on() (
                (sum(increase(otpmask_route_latency_pick_weighted_total[5m])) or vector(0))
                + (sum(increase(otpmask_route_latency_pick_fastest_total[5m])) or vector(0))
                + (sum(increase(otpmask_route_latency_pick_hybrid_total[5m])) or vector(0)) > 0
              )
            for: 5m
            labels:
              severity: critical
              category: ttft
              team: ai-gateway-ops
            annotations:
              summary: "TTFT 上报/拉取回调 5m 零执行（疑似被丢弃）"
              description: "延迟策略有流量（pick 计数增长）但回调恒 0 执行 ⇒ 回调被丢弃（响应已随 fail-closed 发出 / 流上下文结束）。核对 report_cb_total 与 report_ok_total 差值定位。"
              runbook_url: "docs/详细设计/P1/GA-AI网关能力补齐方案--P1--TTFT严格性能择优.md"
          # ---- 回退率高（warning）：五原因合计回退率 > 20%（R2-19 序 1-5）----
          - alert: AITTFTFallbackRateHigh
            expr: |
              (
                (sum(rate(otpmask_route_ttft_fallback_unreachable_total[5m])) or vector(0))
                + (sum(rate(otpmask_route_ttft_fallback_stale_total[5m])) or vector(0))
                + (sum(rate(otpmask_route_ttft_fallback_low_samples_total[5m])) or vector(0))
                + (sum(rate(otpmask_route_ttft_fallback_no_samples_total[5m])) or vector(0))
                + (sum(rate(otpmask_route_ttft_fallback_no_rand_total[5m])) or vector(0))
              ) / clamp_min(
                sum(rate(otpmask_route_requests_total[5m])) or vector(0), 0.000001
              ) > 0.2
            for: 10m
            labels:
              severity: warning
              category: ttft
              team: ai-gateway-ops
            annotations:
              summary: "TTFT 延迟策略回退率 > 20%（近 10m）"
              description: "回退率 {{ $value | humanizePercentage }}。按原因拆名定位：unreachable=控制面不可达；stale=统计陈旧（核对上报/拉取 tick 与 stale_sec）；low_samples/no_samples=样本不足（非流式占比高属预期，持续则核对采样接线）；no_rand=随机源不可用。"
              runbook_url: "docs/详细设计/P1/GA-AI网关能力补齐方案--P1--TTFT严格性能择优.md"
          # ---- 统计陈旧端点比例（warning）：单租户陈旧端点 > 30% ----
          - alert: AITTFTStatsStaleRatio
            expr: |
              count(gateway_core_route_ttft_last_update_seconds < (time() - 120)) by (tenant)
              / clamp_min(count(gateway_core_route_ttft_last_update_seconds) by (tenant), 1) > 0.3
            for: 10m
            labels:
              severity: warning
              category: ttft
              team: ai-gateway-ops
            annotations:
              summary: "TTFT 统计陈旧端点比例 > 30%（近 10m）"
              description: "租户 {{ $labels.tenant }} 陈旧比例 {{ $value | humanizePercentage }}。无更新端点经上报 404 失效 / 上报断流；结合上报成功率与回调丢弃告警排查。"
              runbook_url: "docs/详细设计/P1/GA-AI网关能力补齐方案--P1--TTFT严格性能择优.md"
          # ---- 重置异常（warning）：1h 内重置 > 5 次 ----
          - alert: AITTFTResetFrequent
            expr: |
              increase(gateway_core_route_ttft_reset_total[1h]) > 5
            for: 5m
            labels:
              severity: warning
              category: ttft
              team: ai-gateway-ops
            annotations:
              summary: "TTFT 统计重置频繁（1h 内 > 5 次）"
              description: "疑似控制面重启或统计数据被盗改触发清空；核对控制面实例稳定性与 TTFT 存储目录变更记录。"
              runbook_url: "docs/详细设计/P1/GA-AI网关能力补齐方案--P1--TTFT严格性能择优.md"
          # ---- 上报延迟过大（warning）：最近落片距今 > 300s ----
          - alert: AITTFTStatsUpdateLag
            expr: |
              time() - gateway_core_route_ttft_last_update_seconds > 300
            for: 10m
            labels:
              severity: warning
              category: ttft
              team: ai-gateway-ops
            annotations:
              summary: "TTFT 统计落片延迟 > 300s"
              description: "{{ $labels.tenant }}/{{ $labels.model }}/{{ $labels.endpoint }} 最近落片距今 {{ $value | printf \"%.0f\" }}s。数据面上报断流（周期 tick / 队列满丢弃）或控制面聚合故障。"
              runbook_url: "docs/详细设计/P1/GA-AI网关能力补齐方案--P1--TTFT严格性能择优.md"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: otpmask
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.53.2
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.retention.time=7d"
        ports:
        - containerPort: 9090
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
          readOnly: true
        # P1-2：SLO 告警规则（原生文本，AC-01 修复）。
        - name: rules
          mountPath: /etc/prometheus/rules
          readOnly: true
        - name: data
          mountPath: /prometheus
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534 # nobody
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      # P1-2：SLO 告警规则卷（prometheus-rules ConfigMap，AC-01 修复）。
      - name: rules
        configMap:
          name: prometheus-rules
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data # C-9：TSDB 持久化（kind 需先装 local-path provisioner）
---
# C-9：Prometheus TSDB 持久卷（生产替换 storageClassName；kind 单节点用 local-path）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: otpmask
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: otpmask
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
    nodePort: 30090
