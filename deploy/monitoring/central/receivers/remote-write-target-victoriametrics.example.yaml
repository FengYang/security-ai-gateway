# P2-4 中央侧接收端 ④：VictoriaMetrics
#
# 【本文件不在 kustomization.yaml 内】→ 不会被 `kubectl apply -k` 应用，只是片段库。
# 适用：客户用 VM 做低成本长期存储（单机 `victoria-metrics` 或集群版 `vminsert`）。
#
# 【接收端要求】
#   1. 写入路径按部署形态**不同**，务必择一：
#        · 单机版 `victoria-metrics`        → /api/v1/write
#        · 集群版 `vminsert`，accountID=0  → /insert/0/prometheus/api/v1/write
#        · 集群版多租户 accountID=N        → /insert/<N>/prometheus/api/v1/write
#   2. 成功响应为 **204 No Content**（不是 200）——冒烟校验别把 204 判成异常。
#   3. 附加标签有两种写法，**用途不同**：
#        · URL 查询参数 `?extra_label=cluster=<id>` → 写入时附加到所有序列（服务端侧）
#        · 发送侧 `external_labels.cluster`          → 样本自带（客户端侧）
#      两者**不要同时**用同一个标签名，否则可能产生重复/覆盖歧义。推荐**只用** external_labels。
#   4. 认证：VM 可用 `-httpAuth.username/--httpAuth.password` → 发送侧 basic_auth；
#      或前置 `vmauth` 做 Bearer/多租户路由。
apiVersion: v1
kind: ConfigMap
metadata:
  name: rw-target-victoriametrics-example
  namespace: otpmask
data:
  remote-write.snippet.yml: |
    global:
      external_labels:
        cluster: REPLACE_WITH_CLUSTER_ID

    remote_write:
    # 【路径二选一】按 VM 部署形态改，另一行注释掉
    # 单机版：
    - url: "REPLACE_WITH_CENTRAL_WRITE_ENDPOINT"   # 形如 https://vm.example.com/api/v1/write
    # 集群版 vminsert（把 0 换成实际 accountID）：
    # - url: "REPLACE_WITH_CENTRAL_WRITE_ENDPOINT" # 形如 https://vminsert.example.com/insert/0/prometheus/api/v1/write
      remote_timeout: 30s
      queue_config:
        capacity: 10000
        max_shards: 50
        max_samples_per_send: 2000
        batch_send_deadline: 10s
        min_backoff: 1s
        max_backoff: 60s
      write_relabel_configs:
      - source_labels: [__name__]
        regex: "(otpmask_.*|up|gateway_core_.*)"
        action: keep
      # 【可选】服务端附加标签（若已用 external_labels.cluster，则**不要**启用）
      # 写在 url 上更直观，例如：
      #   url: "https://vm.example.com/api/v1/write?extra_label=cluster=REPLACE_WITH_CLUSTER_ID"
      tls_config:
        ca_file: /etc/prometheus/mtls/ca.crt
        cert_file: /etc/prometheus/mtls/tls.crt
        key_file: /etc/prometheus/mtls/tls.key
        server_name: REPLACE_WITH_CENTRAL_SERVER_NAME
        insecure_skip_verify: false
      # 【认证】VM 内置 httpAuth 时用 basic_auth；前置 vmauth 时用 authorization
      basic_auth:
        username: REPLACE_USER
        password_file: /etc/prometheus/mtls/password
      # authorization:
      #   type: Bearer
      #   credentials_file: /etc/prometheus/mtls/token
