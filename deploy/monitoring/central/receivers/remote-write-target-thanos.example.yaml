# P2-4 中央侧接收端 ②：Thanos Receive
#
# 【本文件不在 kustomization.yaml 内】→ 不会被 `kubectl apply -k` 应用，只是片段库。
# 适用：客户已有 Thanos（Receive + Store + Querier）做长期存储 / 全局视图。
#
# 【接收端要求】
#   1. 路径为 `/api/v1/receive`（**不是** Prometheus 的 `/api/v1/write`）
#   2. `--receive.tenant-header`（默认 `THANOS-TENANT`）决定租户头名；未带头时落到
#      `--receive.default-tenant-id`（默认 `default-tenant`）
#   3. `--label`（如 `--label=replica="central"`）会由接收端强制附加标签，与发送侧
#      `external_labels.cluster` 是**不同维度**，不要互相替代
#   4. Thanos 无内置认证 ⇒ 跨公网必须前置 mTLS 代理；租户头是**路由**不是**认证**
apiVersion: v1
kind: ConfigMap
metadata:
  name: rw-target-thanos-example
  namespace: otpmask
data:
  remote-write.snippet.yml: |
    global:
      external_labels:
        cluster: REPLACE_WITH_CLUSTER_ID

    remote_write:
    - url: "REPLACE_WITH_CENTRAL_WRITE_ENDPOINT"   # 形如 https://thanos-receive.example.com/api/v1/receive
      remote_timeout: 30s
      # 【Thanos 特有】租户头。头名须与接收端 --receive.tenant-header 一致（默认 THANOS-TENANT）
      headers:
        THANOS-TENANT: REPLACE_WITH_TENANT
      queue_config:
        capacity: 10000
        max_shards: 50
        max_samples_per_send: 2000
        batch_send_deadline: 10s
        min_backoff: 1s
        max_backoff: 60s
      write_relabel_configs:
      - source_labels: [__name__]
        regex: "(otpmask_.*|up|gateway_core_.*)"
        action: keep
      tls_config:
        ca_file: /etc/prometheus/mtls/ca.crt
        cert_file: /etc/prometheus/mtls/tls.crt
        key_file: /etc/prometheus/mtls/tls.key
        server_name: REPLACE_WITH_CENTRAL_SERVER_NAME
        insecure_skip_verify: false
      authorization:
        type: Bearer
        credentials_file: /etc/prometheus/mtls/token
