# P2-4 T-4.4：Grafana 中央数据源（**仅中央集群需要**）
#
# 为什么单独一个 ConfigMap：既有 deploy/monitoring/grafana.yaml 的 `grafana-datasources`
# 只声明本地 `Prometheus`（per-集群）。中央看板查询的是中央 Prometheus，
# 需额外数据源 `Prometheus-Central`（uid 同值，看板按 uid 引用）。
# 为避免改动既有清单（默认部署零影响），本文件为**独立 ConfigMap**，由运维一次性挂载：
#
#   kubectl -n otpmask patch deployment grafana --type=json -p '[
#     {"op":"add","path":"/spec/template/spec/volumes/-",
#      "value":{"name":"grafana-central-datasources",
#               "configMap":{"name":"grafana-central-datasources"}}},
#     {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts/-",
#      "value":{"name":"grafana-central-datasources",
#               "mountPath":"/etc/grafana/provisioning/datasources/central","readOnly":true}}
#   ]'
#   kubectl -n otpmask rollout restart deployment/grafana
#
# 未挂载时中央看板会显示 datasource not found——属预期（本资产不在默认栈内生效）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-central-datasources
  namespace: otpmask
  labels:
    app: grafana-central
data:
  central.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus-Central
      type: prometheus
      access: proxy
      url: http://prometheus-central.otpmask.svc.cluster.local:9090
      isDefault: false
      uid: Prometheus-Central
      jsonData:
        timeInterval: 30s
