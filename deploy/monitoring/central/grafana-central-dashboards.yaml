# P2-4 T-4.4：Grafana 统一看板（overview + per-cluster drill-down）
#
# 【cluster 标签口径】看板变量 `cluster` 取自指标标签 `cluster`——由各集群 Prometheus
# `global.external_labels.cluster=<cluster-id>` 在 remote-write 时附加
# （既有锚点 deploy/monitoring/prometheus.yaml:41-43）。中央侧不做重写，
# 故 `label_values(cluster)` 可直接枚举集群、`cluster=~"$cluster"` 可直接下钻。
# 与 T-4.1/T-4.2 审计侧的 `schema=admin|tee|core` 是**不同维度**（指标 vs 审计链），
# 组合查询时二者并列使用，不互相替代。
#
# 【数据源】uid=Prometheus-Central（本目录 grafana-central-datasources.yaml 提供）；
# 未挂载该数据源时看板报 datasource not found，属预期（本资产不在默认栈内生效）。
#
# 挂载方式与既有看板一致：置于 Grafana provisioning 的 dashboards 目录
# （deploy/monitoring/grafana.yaml 的 `grafana-dashboards` 使用 /var/lib/grafana/dashboards）。
# 如需在既有 Grafana 上生效，可把本 ConfigMap 以同样方式挂载到 dashboards 目录，
# 或另起 provider 目录——**均不在默认 kustomization 内**，故默认部署零影响。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-central-dashboards
  namespace: otpmask
  labels:
    app: grafana-central
data:
  # ============ ① 跨集群总览（overview） ============
  multicluster-overview.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "schemaVersion": 38,
      "tags": ["multicluster", "P2-4"],
      "title": "多集群总览 Multi-Cluster Overview",
      "uid": "multicluster-overview",
      "version": 1,
      "weekStart": "",
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "",
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "name": "cluster",
            "label": "Cluster",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "Prometheus-Central"},
            "definition": "label_values(cluster)",
            "query": "label_values(cluster)",
            "refresh": 1,
            "includeAll": true,
            "multi": true,
            "sort": 1,
            "skipUrlSync": false,
            "hide": 0,
            "options": [],
            "current": {},
            "regex": ""
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "在线集群数（有 up 数据的 cluster 数）",
          "datasource": {"type": "prometheus", "uid": "Prometheus-Central"},
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [
            {"expr": "count(count by (cluster) (up{cluster=~\"$cluster\"}))", "legendFormat": "clusters", "refId": "A"}
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "每集群请求速率（req/s）",
          "datasource": {"type": "prometheus", "uid": "Prometheus-Central"},
          "gridPos": {"h": 8, "w": 12, "x": 6, "y": 0},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "sum by (cluster) (rate(otpmask_inference_requests_total{cluster=~\"$cluster\"}[5m]))", "legendFormat": "{{cluster}}", "refId": "A"}
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "每集群成功率",
          "datasource": {"type": "prometheus", "uid": "Prometheus-Central"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "sum by (cluster) (rate(otpmask_inference_requests_total{cluster=~\"$cluster\",result=\"ok\"}[5m])) / clamp_min(sum by (cluster) (rate(otpmask_inference_requests_total{cluster=~\"$cluster\"}[5m])), 0.001)", "legendFormat": "{{cluster}}", "refId": "A"}
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "每集群拒绝率（otpmask_denies / requests）",
          "datasource": {"type": "prometheus", "uid": "Prometheus-Central"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "sum by (cluster) (rate(otpmask_denies_total{cluster=~\"$cluster\"}[5m])) / clamp_min(sum by (cluster) (rate(otpmask_inference_requests_total{cluster=~\"$cluster\"}[5m])), 0.001)", "legendFormat": "{{cluster}}", "refId": "A"}
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "每集群 P99 首 token 时延（s）",
          "datasource": {"type": "prometheus", "uid": "Prometheus-Central"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "histogram_quantile(0.99, sum by (cluster, le) (rate(otpmask_ttft_seconds_bucket{cluster=~\"$cluster\"}[5m])))", "legendFormat": "{{cluster}}", "refId": "A"}
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "中央 remote-write 落后端（全局量，无 cluster 维度）",
          "description": "time() - max(prometheus_remote_storage_highest_timestamp_in_seconds)。>900s 触发 CentralRemoteWriteStalled。该指标为接收侧全局量，无法定位到具体集群，需配合 per-cluster 下钻页人工核对。",
          "datasource": {"type": "prometheus", "uid": "Prometheus-Central"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single"}},
          "targets": [
            {"expr": "time() - max(prometheus_remote_storage_highest_timestamp_in_seconds)", "legendFormat": "lag", "refId": "A"}
          ]
        }
      ]
    }
  # ============ ② 单集群下钻（per-cluster drill-down） ============
  multicluster-per-cluster.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "schemaVersion": 38,
      "tags": ["multicluster", "P2-4"],
      "title": "单集群下钻 Per-Cluster Drill-down",
      "uid": "multicluster-per-cluster",
      "version": 1,
      "weekStart": "",
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "",
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "name": "cluster",
            "label": "Cluster",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "Prometheus-Central"},
            "definition": "label_values(cluster)",
            "query": "label_values(cluster)",
            "refresh": 1,
            "includeAll": false,
            "multi": false,
            "sort": 1,
            "skipUrlSync": false,
            "hide": 0,
            "options": [],
            "current": {},
            "regex": ""
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "该集群在线目标数（up）",
          "datasource": {"type": "prometheus", "uid": "Prometheus-Central"},
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [
            {"expr": "sum(up{cluster=~\"$cluster\"})", "legendFormat": "targets", "refId": "A"}
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "请求速率（按 job）",
          "datasource": {"type": "prometheus", "uid": "Prometheus-Central"},
          "gridPos": {"h": 8, "w": 18, "x": 6, "y": 0},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "sum by (job) (rate(otpmask_inference_requests_total{cluster=~\"$cluster\"}[5m]))", "legendFormat": "{{job}}", "refId": "A"}
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "成功率",
          "datasource": {"type": "prometheus", "uid": "Prometheus-Central"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single"}},
          "targets": [
            {"expr": "sum(rate(otpmask_inference_requests_total{cluster=~\"$cluster\",result=\"ok\"}[5m])) / clamp_min(sum(rate(otpmask_inference_requests_total{cluster=~\"$cluster\"}[5m])), 0.001)", "legendFormat": "success rate", "refId": "A"}
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "拒绝原因分布（by reason）",
          "datasource": {"type": "prometheus", "uid": "Prometheus-Central"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "fieldConfig": {"defaults": {"unit": "reqps", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "sum by (reason) (rate(otpmask_denies_total{cluster=~\"$cluster\"}[5m]))", "legendFormat": "{{reason}}", "refId": "A"}
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "P95 / P99 首 token 时延（s）",
          "datasource": {"type": "prometheus", "uid": "Prometheus-Central"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "histogram_quantile(0.95, sum by (le) (rate(otpmask_ttft_seconds_bucket{cluster=~\"$cluster\"}[5m])))", "legendFormat": "p95", "refId": "A"},
            {"expr": "histogram_quantile(0.99, sum by (le) (rate(otpmask_ttft_seconds_bucket{cluster=~\"$cluster\"}[5m])))", "legendFormat": "p99", "refId": "B"}
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "缓存查找速率（otpmask_cache_lookups）",
          "datasource": {"type": "prometheus", "uid": "Prometheus-Central"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "fieldConfig": {"defaults": {"unit": "reqps", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "single"}},
          "targets": [
            {"expr": "sum(rate(otpmask_cache_lookups_total{cluster=~\"$cluster\"}[5m]))", "legendFormat": "lookups/s", "refId": "A"}
          ]
        }
      ]
    }
