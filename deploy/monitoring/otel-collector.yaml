# P1-2：OTel Collector（全链路 tracing 汇聚 + tail_sampling + 脱敏）
#
# 架构：单实例部署（默认，满足初期容量）；HA 升级路径见 §6.4 两层拓扑：
#   转发层（loadbalancingexporter, routing_key=traceID）→ 采样层（tail_sampling）
#   普通 LB 会打散单 trace 的 span，破坏 tail 决策（R-6）。
#
# 安全默认（C-4 / FD-3）：
#   - 全局 tracing 开关 = 全局配置（feature_gates 或 receiver 开关）
#   - 租户 allow-list = tail_sampling string_attribute policy，默认空=全拒绝
#   - 错误全采（L2）仅对 allow-list 内租户生效
#   - 正常请求默认 1% 采样（L1）
#
# Span 脱敏（D-4 / V-2）：
#   - TEE 内 SanitizingSpanProcessor 第一道
#   - Collector attributes processor 白名单裁剪（纵深防御第二道）
#   - 白名单见 §6.2 Span 属性 Schema
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otpmask
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            # 生产启用 TLS（TEE→Collector 强制 mTLS）
            # tls:
            #   cert_file: /etc/otel/tls/server.crt
            #   key_file: /etc/otel/tls/server.key
          http:
            endpoint: 0.0.0.0:4318
            # tls:
            #   cert_file: /etc/otel/tls/server.crt
            #   key_file: /etc/otel/tls/server.key

    processors:
      # 属性白名单裁剪（纵深防御第二道；TEE 内已做第一道，D-4）。
      # 白名单外一律删除，防止 TEE 侧遗漏或数据面默认 tags 带敏感信息。
      #
      # 实现说明（2026-10-08 本地端到端实测修正）：otelcol-contrib v0.112.0 的
      # `attributes` processor **不支持 `action: keep`**（以 attributes+keep 配置启动即
      # 报 `unsupported action "keep"`，Collector 直接退出）。故改用 `transform` +
      # OTTL `keep_keys` 实现「仅保留白名单」，并顺带在 span 级完成键名兼容映射。
      transform/whitelist:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              # 仅保留 §6.2 白名单 + §7.4 M3 扩展键；其余（含 prompt/response/content/
              # embedding 等）一律删除。
              - keep_keys(attributes, ["tenant.id","request.id","model.id","engine.type","cache.hit","cache.mode","tokens.in","tokens.out","result","deny.reason","og.category","og.mode","is.retry","http.status_code","http.response.status_code","ttft.ms","input.digest","output.digest","http.method","http.request.method","http.route","url.path","user.role","route.name","change.type","otlp.library.name","otlp.resource.version","service.name"])
              # 兼容键名映射：Envoy OTel tracer 新语义约定用 http.response.status_code，
              # 而 tail_sampling http_status_code policy 读 http.status_code。
              - set(attributes["http.status_code"], attributes["http.response.status_code"]) where attributes["http.status_code"] == nil and attributes["http.response.status_code"] != nil
          # Resource 属性白名单：仅保留 service.name（Tempo rootServiceName 依赖），
          # 防止 host.*/process.* 等宿主信息外泄。
          - context: resource
            statements:
              - keep_keys(attributes, ["service.name"])

      # Tail Sampling（D-3 / §3.4）
      # decision_wait 初始 30s（覆盖 LLM 流式长 trace p99），
      # 落地后按实测 trace 时长 p99 校正——过短会在 trace 未闭合时裁决，
      # 导致 status_code 未写入、长错误 trace 仅按 1% 处理而漏采。
      #
      # 拓扑修正（2026-10-08 本地 Docker 端到端实测）：
      #   若把「租户 allow-list」与「错误全采」「默认 1%」**平铺为同级策略**，则
      #   allow-list 被当作「保留该租户的全部 trace」：实测在默认概率置 0（pct=0）时，
      #   白名单租户的**普通 trace 仍被落库** —— 1% 默认采样被绕过，与 §3.4
      #   「99% 在 Collector tail_sampling 丢弃」矛盾。
      #   故改为：**多个顶层 `and` 策略**（顶层之间即 OR），每个都以租户 allow-list 门控：
      #     OR( AND(租户,http-err), AND(租户,span-err), AND(租户,默认 1%) )
      #     ≡ AND(租户∈allow-list, OR(错误全采, 默认 1%))  —— 既「默认拒绝」又「错误全采」。
      #   实测（allow-list=["t-001"]）：非白名单租户 200/500 均不落库（deny-by-default）；
      #   白名单普通 trace 在 pct=0 时不落库、pct=100 时落库；白名单 5xx 恒落库（错误全采）。
      #   备注：`composite`(OR) 不能嵌套在 `and` 内（校验报 `invalid keys: composite`）；
      #         以顶层 composite 包裹多个 `and` 实测会连白名单租户一并拒绝，故不采用。
      tail_sampling:
        decision_wait: 30s
        num_traces: 100000
        expected_new_traces_per_sec: 1000
        policies:
          # ① 白名单租户 + HTTP 4xx/5xx（错误全采）
          - name: tenant-http-err
            type: and
            and:
              and_sub_policy:
                - name: allowlist-http
                  type: string_attribute
                  string_attribute:
                    key: tenant.id
                    # —— 单一事实源：租户 allow-list（空 = 全拒绝，C-4）——
                    # 灰度热更（POST /v1/adminext/tracing/tenant）只需修改此处，
                    # 另两处经 YAML 锚点引用同一列表。
                    values: &tenant_allowlist []
                - name: error-http
                  type: numeric_attribute
                  numeric_attribute:
                    key: http.status_code
                    min_value: 400
                    max_value: 599
          # ② 白名单租户 + OTel span status=ERROR（错误全采）
          - name: tenant-span-err
            type: and
            and:
              and_sub_policy:
                - name: allowlist-span
                  type: string_attribute
                  string_attribute:
                    key: tenant.id
                    values: *tenant_allowlist
                - name: error-span
                  type: status_code
                  status_code:
                    status_codes: [ERROR]
          # ③ 白名单租户 + 默认概率（L1 = 1%）
          - name: tenant-default
            type: and
            and:
              and_sub_policy:
                - name: allowlist-default
                  type: string_attribute
                  string_attribute:
                    key: tenant.id
                    values: *tenant_allowlist
                - name: default-probabilistic
                  type: probabilistic
                  probabilistic:
                    sampling_percentage: 1

    exporters:
      # 导出到 Tempo（OTLP/gRPC）
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true  # 集群内同 namespace，开发/演示形态；生产启用 mTLS

      # 日志 exporter（调试用，默认注释）
      # debug:
      #   verbosity: detailed

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors:
            - transform/whitelist
            - tail_sampling
          exporters:
            - otlp/tempo
      # telemetry:
      #   logs:
      #     level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: otpmask
  labels:
    app: otel-collector
spec:
  replicas: 1  # 单实例起步；HA 须按 §6.4 两层拓扑改造
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.112.0
        imagePullPolicy: IfNotPresent
        command:
        - /otelcol-contrib
        - "--config=/etc/otel/otel-collector.yaml"
        ports:
        - containerPort: 4317
          name: otlp-grpc
          protocol: TCP
        - containerPort: 4318
          name: otlp-http
          protocol: TCP
        - containerPort: 8888
          name: metrics
          protocol: TCP
        volumeMounts:
        - name: otel-collector-config
          mountPath: /etc/otel
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: otel-collector-config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: otpmask
  labels:
    app: otel-collector
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
    protocol: TCP
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
    protocol: TCP
