# OTP-Mask 安全 AI 网关 CI（M12）
#
# 【2026-09-12 拆分（方案①）】原为单 job、且 push 分支写 [main]（仓库实为 master）→ 永不触发；
# 同时裸 go 命令与仓库 vendor/（无 modules.txt）冲突 → 一旦触发即失败。现拆为两个 job：
#   job 1 static-and-unit：不依赖任何本地环境（静态检查/单测/协议一致/门禁/wasm 构建/脚本语法）
#                          → 跑托管 runner（ubuntu-latest），可立即给出结论；
#   job 2 env-suite      ：依赖完整环境（compose 容器组 + kubectl/kustomize/helm/docker）
#                          → 跑自托管 runner（标签 otpmask-e2e），需在具备该环境的机器上注册 runner。
# 说明：未接入自托管 runner 时，job 2 会处于"等待 runner"状态（不阻塞 job 1 的结论）；
#       job 2 依赖 job 1 成功（needs），避免浪费环境机资源。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  # KI#5：BM-2 全量档基线举证为手动触发，不占常规 push/PR 算力。
  workflow_dispatch:

jobs:
  # ---------------- job 1：托管 runner（零本地环境依赖） ----------------
  static-and-unit:
    name: static & unit (hosted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gofmt 增量门禁需 diff 基线（PR base / HEAD^）

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. 静态与单元（-mod=mod：仓库含 vendor/ 但无 modules.txt，裸 go 会 inconsistent vendoring）
      - name: go vet
        run: go vet -mod=mod ./...

      # 1a. 全仓构建（方案 §6.1 R5：本 job 此前只 vet+test，缺"全部包可构建"这条判据；
      #     包级重构要靠它拦回归——例如把包拆错目录、留下重复符号/同名包时，vet 可能不报）。
      - name: go build (all packages)
        run: go build -mod=mod ./...

      # 1b. Guardrail 基准语料：corpus.jsonl 按设计被 .gitignore 忽略（含第三方数据集内容 + 体积），
      #     只入库生成脚本 + sources.json。CI 全新 checkout 无此文件 → 两个 baseline 用例 t.Fatalf。
      #     脚本离线安全：公开集取数失败不中断，合成族（rule/benign/known_fp）照常生成，门禁①②生效。
      - name: generate guardrail bench corpus (CI-only)
        timeout-minutes: 8
        run: pwsh -NoProfile -File scripts/build-guardrail-bench.ps1

      - name: unit tests
        env:
          # KI#5：BM-2 默认全量档 50000x512 的 HNSW 建图常态 575~578s，
          # 逼近 go test 默认单包 10m 超时。日常 CI 降档冒烟（判据
          # p95<15ms、dim 与产品代码均不变）；全量档由下方手动 step 举证。
          CACHE_BM2_VECN: "5000"
        run: go test -mod=mod ./...

      # KI#5 全量档基线：仅 workflow_dispatch 手动触发，单列该包并放宽
      # 框架截止线到 30m，让 p95<15ms 判据真正跑完再裁决。
      - name: BM-2 full-scale baseline (manual, 30m)
        if: github.event_name == 'workflow_dispatch'
        run: make test-bm2-full

      # 1b. 密态大模型适配器离线契约测试（T05 / PRD P0-3·P0-4 举证）
      #     - -race 抓数据竞争（§7.10 T05）；
      #     - 进程级网络隔离（unshare -n + 起 lo）做交叉证据，证明离线契约不触外网
      #       （库内 TestMain 已替换 transport/resolver 并断言 EgressAttempts()==0，此处再加一层
      #        进程级兜底；环境不支持 unshare 时退化为普通运行，仍由库内离线守卫把关）。
      - name: confllm adapter offline contract tests
        run: |
          if command -v unshare >/dev/null 2>&1 && command -v ip >/dev/null 2>&1 && unshare -n true 2>/dev/null; then
            unshare -n bash -c 'ip link set lo up; exec make test-adapters'
          else
            make test-adapters
          fi

      # 2. 供应链漏洞扫描（TH-12 缓解）
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # 2b. Trivy 依赖扫描门禁（P1-3 等保 §6.4④/§6.7：漏洞扫描门禁，HIGH/CRITICAL 阻止合入）。
      #     范围限本仓库自有依赖清单（go.sum 等）；跳过 vendor/ 与外部工具/模型树，避免历史遗留
      #     第三方向量产生噪声门禁失败（本方案自有依赖的高危以本步骤 + govulncheck 双门禁兜底）。
      #     ⚠ 版本钉死说明（2026-11-13）：`version` 必须显式给出。trivy-action 的默认 trivy 版本
      #     曾指向**没有 release 资产**的 tag（v0.33.1 默认 v0.65.0、v0.34.0 默认 v0.69.1，
      #     releases/tags 均 404）⇒ setup-trivy 下载 tar.gz 失败、步骤在安装阶段即退出，
      #     门禁从未真正执行过（表现为看似随机的红灯，极易被误判成依赖漏洞）。此处钉 v0.70.0
      #     （与 action v0.36.0 同批测试的版本，tar.gz + checksums 资产齐备）；漏洞检出能力由
      #     扫描时拉取的漏洞库决定、与二进制版本无关，故钉版本不降低门禁强度。
      - name: trivy fs scan (deps)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          skip-dirs: vendor,.tools,tools,vllm,docs,node_modules,.git

      # 3. 南向协议 Go/Python 交叉一致性（M5 验收）
      #    Python 侧的信封断言依赖 cryptography（惰性导入，见 otpmask_protocol.py:300）。
      #    托管 runner 的 setup-python 不装第三方包 ⇒ 此前该步骤必然
      #    `ModuleNotFoundError: No module named 'cryptography'`。此处显式安装而非
      #    「缺库就跳过信封断言」：跳过等于给交叉一致性开静默豁免口子，门禁不允许降级。
      - name: install python deps (protocol cross)
        run: python -m pip install --disable-pip-version-check -q -r protocol/python/requirements.txt

      - name: protocol cross
        run: python protocol/python/cross_test.py

      # 4. 决策门 PoC（路径 B 数学闭合验证）
      - name: decision gate PoC
        run: go run ./gateway/poc/linear-mask-poc

      # 5. Higress 插件版本门禁（防“版本漂移 → 插件 URL 404 → wasm 加载失败 → FAIL_OPEN 静默放行”）
      #    仅校验“仓库 ↔ plugin-versions.lock”（不传 -Container），故不依赖 Docker
      - name: higress plugin version gate
        run: pwsh -NoProfile -File scripts/check-higress-plugin-versions.ps1

      # 6. wasm 插件构建（Go 1.25 原生 wasm；国密库 gmsm 要求 1.25+）
      #    注：本 job 为 Linux 原生 go，GOOS/GOARCH 生效。若在 WSL 下调 Windows go.exe 则**不传递** env
      #    ⇒ 静默产出 Windows PE（T-4 集群窗口实测），故由 6c 断言产物真身。
      - name: build wasm plugin
        run: |
          GOOS=wasip1 GOARCH=wasm go build -mod=mod -buildmode=c-shared \
            -o gateway/wasm/otpmask-plugin/main.wasm ./gateway/wasm/otpmask-plugin
          GOOS=wasip1 GOARCH=wasm go build -mod=mod -buildmode=c-shared \
            -o gateway/wasm/mcp-acl-plugin/main.wasm ./gateway/wasm/mcp-acl-plugin

      # 6b. wasm-guard 门禁（§9.1「Wasm 内无密码运算」/ R-11；①a/①b/② 三断言）
      #     2026-10-19 接入：此前仅手工执行；曾因工作区 vendor/ 导致 go list 静默失败
      #     ⇒ 门禁空跑假绿，既有违例（report.go 直算 HMAC）未被发现（T-4 留证）。
      - name: wasm-guard
        run: make wasm-guard

      # 6c. wasm 产物真身断言（magic == \0asm）：防「GOOS/GOARCH 未生效 → 静默产出 PE(DLL)
      #     → Envoy 判 invalid → 零强制直通上游」假绿（T-4 集群窗口缺口，见 Makefile）。
      - name: wasm artifact guard
        run: make wasm-artifact-guard

      # 7. 脚本语法（纯静态：bash -n + 全部 ps1 解析）
      - name: Linux scripts syntax
        run: |
          bash -n scripts/setup-env.sh
          pwsh -NoProfile -Command "Get-ChildItem scripts/*.ps1 | ForEach-Object { \$null = [System.Management.Automation.Language.Parser]::ParseFile(\$_.FullName, [ref]\$null, [ref]\$e); if (\$e) { throw \$e[0] } }; Write-Host 'ps1 parse OK'"

      # 7b. 明文凭据门禁（口令仅经环境变量注入，严禁入库；T-4 窗口发现 68 件硬编码口令）。
      #     既有债务登记于 scripts/secrets-baseline.txt；仅 **新增** 命中失败（值级兜底见脚本 docstring）。
      - name: secrets-guard
        run: python scripts/check-secrets.py

      # 7c. SBOM 一致性门禁（方案 §6.3：主仓与新库须各带机器可读 SBOM）。
      #     判据：sbom.cyclonedx.json 必须存在，且与当前 go.mod 依赖**逐字节一致**。
      #     依赖变更后忘记刷新 SBOM ⇒ 这里红（而不是等到发版才发现清单过期）。
      #     生成器确定性由 scripts/gen-sbom.py 保证（除 metadata.timestamp 外无易变字段，
      #     timestamp 缺省取固定值，故 CI 与本地生成结果一致）。
      - name: sbom gate
        run: |
          python scripts/gen-sbom.py --out /tmp/sbom.regen.json
          diff -u sbom.cyclonedx.json /tmp/sbom.regen.json
          echo "PASS: SBOM 与当前依赖一致"

      # 8. gofmt 增量门禁（仅校验本次变更的 .go 文件；防新代码格式漂移）
      #    全仓历史仍存在漂移，故不做全量校验；待全量清零后可放宽。
      - name: gofmt gate (changed files)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD^"
          fi
          pwsh -NoProfile -File scripts/check-gofmt.ps1 -Base "$BASE"

      # 9. 架构边界门禁（《路线2-架构理清与包级重构方案》§6.3）
      #    四层依赖方向（engine ↛ 信任锚 / adapters ↛ orchestrator / cryptop 无环 /
      #    orchestrator 仅产品层与 cmd/route2-* 可引用）+ 国密实现零命中。
      #    判据在 gateway/archtest，用 AST 读 import；`go test ./...` 已覆盖，此处单列一步，
      #    使边界回归在 CI 上"一眼可见失败原因"，而不是淹没在全量单测输出里。
      - name: arch boundary gate
        run: go test -mod=mod -count=1 -run 'TestDependencyDirection|TestNoGuomiImplementation' -v ./gateway/archtest/

  # ---------------- job 1b：构建标签矩阵（方案 §6.1 R5） ----------------
  # 为什么单独成 job：job 1 的 `go build ./...` 只用默认 CGO + 默认标签，覆盖不到
  # 「关掉 cgo 的纯 Go 回退路径」与「saas/pkcs11 档位」——重构把包搬来搬去时，最典型的
  # 回归就是某个文件忘了加/加错构建标签：默认档全绿，换档直接编不过（本地不易发现）。
  #
  # 关于 CUDA/昇腾（方案 §6.1 R5 括注）：本仓加速后端不是编译期标签，而是运行期
  # dlopen（`ACCEL_BACKEND_LIB` + 统一 C ABI `accel_cipher_linear_int128`），
  # 唯一编译期开关是 `//go:build cgo`（拆分后独立仓 masked-infer/core/accel_dispatch.go）。
  # 目标硬件轨道（CUDA/昇腾）的运行期 .so 注入与逐位对拍由下方 accel-e2e job 覆盖（M-5/G-3）；
  # 真机 GPU/NPU 取证仍属 🖥 待环境就绪（E-11 / M5-3），不得用编译通过冒充。
  #
  # 组合均为**实测通过**后才写入（避免把没验过的组合塞进 CI 造成长期红灯）；
  # 嵌套 module（testkit/poc、wasm/*）由 ./... 自动排除，不在此矩阵覆盖面。
  build-matrix:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cgo-on / 默认标签（含 CUDA·昇腾加速后端编译路径）
            cgo: "1"
            tags: ""
          - name: cgo-off / 默认标签（纯 Go 回退路径）
            cgo: "0"
            tags: ""
          - name: cgo-on / pkcs11（硬件密码模块档）
            cgo: "1"
            tags: "pkcs11"
          - name: cgo-off / saas（租户化档）
            cgo: "0"
            tags: "saas"
          - name: cgo-off / perf（性能基准档）
            cgo: "0"
            tags: "perf"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true

      - name: go build ./... (${{ matrix.name }})
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -mod=mod ${{ matrix.tags != '' && format('-tags {0}', matrix.tags) || '' }} ./...

  # ---------------- job 1c：加速后端 ABI 端到端（M-5 / G-3 修复，需主理人授权后落地） ----------------
  # 语义分层红线（§4.6）：
  #   ACCEL_BUILD_TRACK = 构建期轨道（cpu|cuda|ascend|both），只决定 .so 产物，不作运行期值；
  #   ACCEL_BACKEND_LIB = 运行期注入，必须是逗号分隔的受信**绝对路径**候选列表。
  # 链路（G-3 缺口）：编译 .so → 注入绝对路径 → 跑 TestAccelDispatch 与 CPU 基准逐位对拍；
  # 负向用例：把构建期轨道字面量 / 相对路径注入运行期变量，须被路径校验拒绝并回退 CPU。
  # ⚠ CUDA / 昇腾目标硬件轨道属 🖥 待环境就绪（E-11）：本 job 用可移植参考实现验证
  #   「统一 C ABI + 后端无关派发」链路，**不冒充**真机 GPU/NPU 取证（M5-3 另计）。
  accel-e2e:
    name: accel ABI e2e (${{ matrix.track }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        track: [cpu, ascend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true

      # TestAccelDispatch 位于拆分后的独立仓；CI 检出 master 以取得最新负向用例。
      - name: checkout masked-infer
        uses: actions/checkout@v4
        with:
          repository: FengYang/masked-infer
          ref: master
          path: masked-infer

      - name: build .so from build-time track
        env:
          ACCEL_BUILD_TRACK: ${{ matrix.track }}
        run: |
          set -euo pipefail
          case "$ACCEL_BUILD_TRACK" in
            cpu|ascend) ;;
            cuda|both) echo "CUDA/CANN 目标工具链未就绪（E-11），本 job 不覆盖目标硬件轨道"; exit 1 ;;
            *) echo "unknown ACCEL_BUILD_TRACK=$ACCEL_BUILD_TRACK"; exit 1 ;;
          esac
          SO="${RUNNER_TEMP}/libaccel_${ACCEL_BUILD_TRACK}.so"
          g++ -shared -fPIC -O2 -I masked-infer/core \
            masked-infer/core/cipher_linear_int128_ascend.cpp -o "$SO"
          chmod 0644 "$SO"   # validateAccelLibPath：group/other 不可写
          test -f "$SO"
          echo "built $SO ($(stat -c %s "$SO") bytes)"

      - name: negative cases (build-time literals / relative paths rejected → CPU fallback)
        run: |
          cd masked-infer
          go test -count=1 -v -run 'TestAccelDispatchRejectsLiteralBackendAndFallsBackCPU' ./core/

      - name: bit-exact golden (runtime injection via ACCEL_BACKEND_LIB absolute path)
        env:
          ACCEL_BACKEND_LIB: ${{ runner.temp }}/libaccel_${{ matrix.track }}.so
          TEST_ACCEL_LIB: ${{ runner.temp }}/libaccel_${{ matrix.track }}.so
        run: |
          cd masked-infer
          go test -count=1 -v -run 'TestAccelDispatch$|TestAccelPoolDualBackendSwitchByHint' ./core/

  # ---------------- job 2：自托管 runner（完整环境依赖） ----------------
  # 前置条件（在环境机上注册 runner 并打标签 otpmask-e2e）：
  #   - 已启动 compose 环境（higress 控制面/网关 + tee-infer + embedding 等容器组）；
  #   - 具备 kubectl（kustomize 子命令）、helm、docker（可构建镜像）与 go/python 工具链；
  #   - Windows 环境亦可（脚本均为 ps1，经 pwsh 调用；python 需在 PATH）。
  env-suite:
    name: e2e & governance (self-hosted)
    needs: static-and-unit
    runs-on: [self-hosted, otpmask-e2e]
    steps:
      - uses: actions/checkout@v4

      # 8. 端到端 + 治理 + 渗透（Docker Compose 环境）
      - name: e2e & governance suite
        run: pwsh -NoProfile -File scripts/verify-all.ps1
        env:
          GO_BIN: go

      # 10. L2 两段式端到端冒烟（Qwen3Guard Q8_0 + 侧车 + HTTP 客户端）
      #     需自托管 runner 具备 llama-server + GGUF + transformers；
      #     环境不满足时自动跳过，不阻塞 CI。
      - name: L2 two-stage smoke (optional)
        shell: pwsh
        run: |
          $gguf = ".tools/models/Qwen3Guard-Gen-0.6B-GGUF/Qwen3Guard-Gen-0.6B.Q8_0.gguf"
          $llama = ".tools/llamacpp/llama-server.exe"
          if (-not (Test-Path $gguf) -or -not (Test-Path $llama)) {
            Write-Host "SKIP: llama-server or GGUF not found (expected at $llama / $gguf)"
            exit 0
          }
          # 起 llama-server（后台）
          $llamaProc = Start-Process -FilePath $llama `
            -ArgumentList "-m", $gguf, "--host", "127.0.0.1", "--port", "19110", "-np", "2", "-c", "2048", "-t", "4" `
            -PassThru -NoNewWindow
          try {
            # 等健康检查
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:19110/health" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { break }
              } catch { Start-Sleep -Seconds 2 }
            }
            # 起侧车
            $sidecarProc = Start-Process -FilePath "python" `
              -ArgumentList "scripts/qwen3guard-l2-sidecar.py", "--model-dir", ".tools/models/Qwen3Guard-Gen-0.6B", `
                "--port", "19112", "--llama-url", "http://127.0.0.1:19110" `
              -PassThru -NoNewWindow
            try {
              Start-Sleep -Seconds 5
              python scripts/og1b-smoke.py --sidecar http://127.0.0.1:19112
              if ($LASTEXITCODE -ne 0) { throw "smoke test failed with exit $LASTEXITCODE" }
            } finally {
              Stop-Process -Id $sidecarProc.Id -Force -ErrorAction SilentlyContinue
            }
          } finally {
            Stop-Process -Id $llamaProc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: penetration tests
        run: python scripts/pen_test.py

      # 9. K8s 清单校验（kustomize 渲染 + YAML 语法 + dry-run + 镜像构建 + helm lint）
      #    依赖 kubectl/helm/docker，故与 e2e 同置自托管 runner
      - name: K8s manifests
        run: pwsh -NoProfile -File scripts/verify-k8s.ps1

  # ---------------- job 3：镜像供应链（构建 → 扫描 → SBOM → 签名） ----------------
  # P1-3 等保 §6.7（W11/M9）：镜像 digest + cosign 签名 + SBOM（SPDX）随镜像发布 + 扫描门禁。
  # 说明：cosign 私钥生产环境由 KMS 托管；此处用 keyless（OIDC）示例，生产切换为 KMS 密钥签名。
  #      镜像构建依赖较重（多阶段 Dockerfile），若宿主环境受限可整体迁移至 self-hosted runner。
  supply-chain:
    name: image supply chain (hosted)
    runs-on: ubuntu-latest
    needs: static-and-unit
    # 推 GHCR + keyless 签名所需最小权限（2026-11-13 决策）：
    #   contents: read  —— checkout
    #   packages: write —— docker push ghcr.io
    #   id-token: write —— cosign keyless 需向 Fulcio 换取 OIDC 令牌
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: build image
        # 构建上下文=仓库根，Dockerfile 指 gateway-admin-service（与 deploy/k8s 清单镜像一致）。
        run: docker build -t security-ai-gateway/gateway-admin-service:ci -f gateway/gateway-admin-service/Dockerfile .

      # 镜像漏洞扫描门禁（§6.4④：高危漏洞禁止合入）。
      # `version` 显式钉死：理由同 2b（action 默认 trivy 版本曾指向无 release 资产的 tag）。
      - name: trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          image-ref: security-ai-gateway/gateway-admin-service:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # SBOM（SPDX）生成并随构建产物归档（§6.7：SBOM 随镜像发布）。
      - name: generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: security-ai-gateway/gateway-admin-service:ci
          format: spdx-json
          output-file: sbom-admin-service.spdx.json

      - name: upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-admin-service
          path: sbom-admin-service.spdx.json

      # 镜像签名（cosign；生产以 KMS 托管密钥，admission 侧校验签名后方可入集群）。
      # ⚠ 2026-11-13 修正：原实现 `cosign sign <纯本地镜像名>` 不成立——cosign 直接向
      # registry 解析 ref（不经 docker daemon），本地名必然 404/401；且 keyless 需要
      # `id-token: write` 而 job 未声明。现改为：先推 GHCR，再对 registry 中的 ref 签名。
      # PR 场景不推送、不签名（fork PR 的 token 无 packages:write，也不应对外发布产物），
      # 仅保留 构建 + 漏洞扫描 + SBOM。
      - name: compute image ref
        if: github.event_name == 'push'
        run: |
          REF="ghcr.io/${GITHUB_REPOSITORY,,}/gateway-admin-service:ci-${GITHUB_SHA::7}"
          echo "IMAGE_REF=${REF}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${REF}"

      - name: login GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: push image to GHCR
        if: github.event_name == 'push'
        run: |
          docker tag security-ai-gateway/gateway-admin-service:ci "$IMAGE_REF"
          docker push "$IMAGE_REF"

      - uses: sigstore/cosign-installer@v3
      - name: cosign sign (keyless; 生产切 KMS)
        if: github.event_name == 'push'
        run: cosign sign --yes "$IMAGE_REF"
