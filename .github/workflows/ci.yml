# OTP-Mask 安全 AI 网关 CI（M12）
# 覆盖：单元测试、协议交叉一致性、供应链漏洞扫描、wasm 构建、端到端验证、渗透测试
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. 静态与单元
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: go test ./...

      # 2. 供应链漏洞扫描（TH-12 缓解）
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # 3. 南向协议 Go/Python 交叉一致性（M5 验收）
      - name: protocol cross
        run: python protocol/python/cross_test.py

      # 4. 决策门 PoC（路径 B 数学闭合验证）
      - name: decision gate PoC
        run: go run ./gateway/poc/linear-mask-poc

      # 5. wasm 插件构建（Go 1.25 原生 wasm；国密库 gmsm 要求 1.25+）
      - name: build wasm plugin
        run: |
          GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared \
            -o gateway/wasm/otpmask-plugin/main.wasm ./gateway/wasm/otpmask-plugin

      # 6. 端到端 + 治理 + 渗透（Docker Compose 环境）
      - name: e2e & governance suite
        run: pwsh -NoProfile -File scripts/verify-all.ps1
        env:
          GO_BIN: go

      - name: penetration tests
        run: python scripts/pen_test.py

      # 7. K8s 清单校验（kustomize 渲染 + YAML 语法；无集群执行 dry-run 跳过）
      - name: K8s manifests
        run: pwsh -NoProfile -File scripts/verify-k8s.ps1

      # 8. Linux 一键脚本语法 + 脚本集校验
      - name: Linux scripts syntax
        run: |
          bash -n scripts/setup-env.sh
          pwsh -NoProfile -Command "Get-ChildItem scripts/*.ps1 | ForEach-Object { \$null = [System.Management.Automation.Language.Parser]::ParseFile(\$_.FullName, [ref]\$null, [ref]\$e); if (\$e) { throw \$e[0] } }; Write-Host 'ps1 parse OK'"
