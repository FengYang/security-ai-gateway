apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    higress.io/domain_higress-default-domain: "true"
    higress.io/resource-definer: higress
  name: otpmask-infer
  namespace: higress-system
  annotations:
    higress.io/destination: mock-infer:9000
spec:
  ingressClassName: higress
  rules:
    - http:
        paths:
          - backend:
              service:
                name: mock-infer
                port:
                  number: 9000
            path: /infer
            pathType: Prefix